# 阿鸦章节 → 六段标识映射表（KGE-02 设计要点 1；spec 待人确认 #2）
# 状态：待教研核对。由 KGE-02 按 legacy/aya/content/topics.ts 的 chapterLabel 机械起草，未经教研确认，不是结论。
# 用途：tools/kge-import 按题目所在章节推出年级、册次、教材；推出的六段只写进 tagging-report.json，
#       items.sql 不写 platform.curriculum_version（那是内容登记脚本的事）。
# 规则：
#   - label 必须与 legacy 的 chapterLabel 逐字一致，不一致时导入器报进工作单（防止映射表与 legacy 漂移）；
#   - 不在本表里的章节、压轴专项（sprint，没有章节）推不出六段，进工作单；
#   - 一题出现在多个年级的章节时，只登记首次出现（年级、册次最早）的那个。
# 待教研核对的点：
#   - defaults 的 region / exam_year / content_version 沿用内容包（adapters/aya/content/pack.json）的整包常量，
#     登记时是猜的；exam_year 对七、八年级内容是否应按届别区分，待定；
#   - textbook_version 统一写 suke-2024（苏科版），教材修订年份待核对；
#   - term：upper = 上册，lower = 下册。
