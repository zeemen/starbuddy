      2: { spec: "§2.3 双层人格架构（不可妥协）", cases: [DRIFT-CQ-001-V07] }
      3: { spec: "§2.3 第 1 条 只说依据；§3.5 申诉走复核", cases: [DRIFT-CQ-001-V07] }
      4: { spec: "第一章：它不讲题、不归因", cases: [DRIFT-CQ-001, FAM-MD-003] }
      5: { spec: "§5.2 G 类归因用语", cases: [DRIFT-CQ-001-V01] }
      6: { spec: "第六章 互不提及；附录 B", cases: ["static:cross_subject", FAM-XS-004] }
      7: { spec: "第七章 判分时刻的三方站位协议；§3.7 合场结算的交接", cases: [FAM-MD-003, DRIFT-CQ-001-V06] }
      8: { spec: "第一章：不讲题（规格未单列星的用法，待人确认）", cases: [DRIFT-CQ-001] }
      9: { spec: "§5.2 禁语表（A–E 继承 + G 类）", cases: [DRIFT-CQ-001-V01, "static:registry"] }
      10: { spec: "§3.2 第 3 步；附录 B 首次披露；第四章 情绪信号", cases: [DRIFT-CQ-001, "static:referral"] }
  athena:
    spec_doc: docs/personas/考官型基线与角色卡-方圆春秋雅典娜-V1.1.md
    contracts:
      1: { spec: "§2.3 第 6 条；附录 C", cases: ["static:one_per_subject"] }
