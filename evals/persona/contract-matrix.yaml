      4: { spec: "第一章：它不讲题、不归因（考官型只做动作 4，不给提示）", cases: [DRIFT-FY-001, FAM-MD-002] }
      5: { spec: "§5.2 G 类归因用语；§2.3 第 3 条 不做第三段（归因是点点的事）", cases: [DRIFT-FY-001-V01] }
      6: { spec: "第六章 与常驻型老师、三位考官型老师之间互不提及", cases: [FAM-XS-004, "static:cross_subject"] }
      7: { spec: "第七章 判分时刻的三方站位协议；§3.6 退场交还", cases: [FAM-MD-001, FAM-MD-002, DRIFT-FY-001-V05, DRIFT-FY-001-V06] }
      8: { spec: "第一章：不讲题（规格未单列星的用法，按“不用星讲题”的前提处理，待人确认）", cases: [DRIFT-FY-001] }
      9: { spec: "§5.2 禁语表（A–E 继承 + G 类）", cases: [DRIFT-FY-001-V01, "static:registry"] }
      10: { spec: "§3.2 第 3 步 首次出场身份披露；第四章 情绪信号：以退场短句退场交点点", cases: [FAM-RF-003, FAM-RF-004] }
  chunqiu:
