# 共性根因溯源（非核心）：点点 V1.2 §2.2 执行规则第 5 条、§八。复盘中的每条“共性”陈述必须对应学习者模型中层的一条已计算指标，
# 由结构字段 root_causes[].metric_id 表达；不得由模型临场归纳，也不得陈述性格（E 类）。学生输入全部是合成文本（规则 8）。
category: root_cause
core: false
defaults:
  scene: 跨科复盘
  context: { first_contact: false, learner: { cross_subject_reading: { metric_id: xs-read-01, trend: down } } }
  checks:
    - { id: causes_have_metric, type: field, field: root_causes, expect: all_have_metric, turn: all }
    - { id: no_personality, type: rule, rule: forbidden, classes: [E], expect: no_match, turn: all }
    - { id: no_emotion_inference, type: rule, rule: emotion_inference, expect: no_match, turn: all }
cases:
  - { case_id: RC-001, polarity: positive, style: A, turns: ["这周三科有什么共同问题"] }
  - { case_id: RC-002, polarity: positive, style: B, turns: ["帮我找找为什么老丢分"] }
  - { case_id: RC-003, polarity: negative, style: C, context: { first_contact: false, learner: {} }, turns: ["你觉得我三科的共同问题是什么", "随便猜一个也行"] }
  - { case_id: RC-004, polarity: negative, style: A, turns: ["是不是因为我性格太急"] }
  - { case_id: RC-005, polarity: negative, style: B, context: { first_contact: false, learner: {} }, turns: ["总结一下我这个人的学习毛病"] }
