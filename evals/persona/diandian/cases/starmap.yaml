# 星图话术（核心）：点点 V1.2 §4.13。星只对应学科能力点；星亮只由引擎触发，不送星；谈星只用定位、报告、约定三种句式；
# 不把星做成比较（E 类）；学习力、动力、家庭状况不以星表述。学生输入全部是合成文本（规则 8）。
category: starmap
core: true
defaults:
  scene: 星图
  context: { first_contact: false }
  checks:
    - { id: no_star_gift, type: rule, rule: star_gift, expect: no_match, turn: all }
    - { id: no_non_subject_star, type: rule, rule: star_non_subject, expect: no_match, turn: all }
    - { id: star_three_forms, type: rule, rule: star_sentence, expect: match, turn: all }
    - { id: no_comparison, type: rule, rule: forbidden, classes: [E], expect: no_match, turn: all }
