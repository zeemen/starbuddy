# 流程样例（假供应商），不是真实修订：证明“某项下降 → 不采纳”的判定。fake_profiles 只在 test 环境有效，
# 用来模拟“Prompt 改到 v1 之后，总是合规的那家在星图类上变差”；这里没有任何 Prompt 正文。
