# 点点后处理 v0 的情感信号规则（冲刺 3-I 设计要点 1“情感信号 → 确定性转介”）。
# 依据：备考搭子 V1.0 §4.9“当学生表达超出学习范畴的情绪困扰时，人设不承接深度倾诉，明确引导求助真实资源”（点点 V1.2 原样继承）；
# 点点 V1.2 §2.3（不承接情绪倾诉，转介）、§5.3（情绪内容、家庭事件、人际矛盾不得引用；学生主动提起情绪话题时按 4.9 转介）。
# 规格没有给信号清单，这里是按上述条文分类的规则近似（origin: inferred），只看学生这一轮的输入，不做任何心理推断、不给学生贴标签，
# 只决定“这一轮换成转介句”。阈值与词面待人设负责人与教研确认（reviewed: false），金标准到位后按召回 / 精确校准。
# 正反例都是本文件自写的合成短句（规则 8），不取自用例文件，也没有参照留出集（规则 14）。
version: 0.1.0
reviewed: false
signals:
  - id: SIG-01
    name: 伤害自己或轻生的表述
    origin: inferred
    source: "备考搭子 V1.0 §4.9（心理红线场景）"
    pattern: "伤害自己|自残|不想活|活着(?:好|真|太|很)?(?:累|没意思)|想死|轻生|消失了?(?:也|都)没人"
    positive: ["有时候我真的不想活了", "我偷偷在自残"]
    negative: ["这道大题差点把我写死机", "今天活动课好累"]
  - id: SIG-02
    name: 持续的睡眠、饮食或情绪困扰
    origin: inferred
    source: "备考搭子 V1.0 §4.9（超出学习范畴的情绪困扰）；点点 V1.2 §5.3（情绪内容）"
    pattern: "(?:(?:好几|几|两|三)(?:天|周|个星期|个月)|每天|天天|一直|很久)[^。！？!?]{0,12}(?:睡不着|失眠|吃不下|没怎么吃|心慌|手抖|想哭|崩溃|什么都不想做)|(?:睡不着|失眠|吃不下|没怎么吃|心慌|手抖|想哭|崩溃|什么都不想做)[^。！？!?]{0,12}(?:(?:好几|几|两|三)(?:天|周|个星期|个月)|每天|天天|一直|很久)"
    positive: ["我已经好几周晚上睡不着了", "一直想哭，已经两个星期"]
    negative: ["昨晚十点就睡了", "这周想把函数练熟"]
  - id: SIG-03
    name: 情绪倾诉的请求
    origin: inferred
    source: "点点 V1.2 §2.3（不承接情绪倾诉，转介见 4.9）"
    pattern: "心里(?:很|好|特别|真的)?(?:难受|压抑|堵得慌)|(?:陪我|找个人|想找人)(?:聊聊|说说)"
    positive: ["心里特别压抑", "我想找个人说说"]
    negative: ["我们聊聊这道题的思路", "这题的第二问说说看"]
  - id: SIG-04
    name: 家庭事件
    origin: inferred
    source: "点点 V1.2 §5.3（家庭事件不得引用；按 4.9 转介）"
    pattern: "(?:家里|爸妈|父母|爸爸|妈妈)[^。！？!?]{0,6}(?:吵架|打架|离婚|分开了|打我)"
    positive: ["家里最近总在吵架", "我妈妈又打我了"]
    negative: ["我妈让我先写数学作业", "爸妈周末带我去图书馆"]
  - id: SIG-05
    name: 人际矛盾（欺凌、孤立）
    origin: inferred
    source: "点点 V1.2 §5.3（人际矛盾不得引用；按 4.9 转介）"
    pattern: "欺负我|霸凌|被孤立|排挤我"
    positive: ["有几个人总是欺负我", "我在班上被孤立了"]
    negative: ["同桌借了我一支笔", "我们小组一起做实验"]
