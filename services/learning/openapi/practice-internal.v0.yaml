# 学习服务的错题再练内部接口（specs/practice-loop-stage1/spec.md 设计要点 1–4）。只供 BFF 调用。
# 放在服务目录而不是 packages/contracts：本任务不改契约（CLAUDE.md 必停项；沿用 SIE-02a 诊断接口先例）；
# 是否并入 learning-internal 契约另起 [NEEDS-HUMAN] PR（待人确认 #3）。
openapi: 3.1.0
info:
  title: StarBuddy learning service · practice loop (internal, v0 draft)
  version: 0.1.0
  description: >
    错题条目读时推导（不落库、不新增表）：单元 = 学生 × 学科 × 主节点 × 认知层次。错题 = verdict ∈ {incorrect, partial}、不待复核、
    证据等级 A 或 B、不在申诉中、键盘或画布作答、有打标、在回看期内；同单元另一道题独立做对即闭环（闭环只是再练状态，不是掌握结论）。
    再练做错归入同一条目，按 round_delay_hours 开下一轮，做满 max_rounds 为 exhausted。开着的 retest_task(hint_followup) 读成同类条目。
    选题：知识服务 item.similar（必要时 item.search）→ 平台过滤（同节点同层次、未做过、版权不受限、已登记已准入、验证器或确定性
    Rubric 判分的客观题）→ 不同题目族优先
    （只有同族时出同族题并标 same_family_only）→ 插件 API v1.0 generate_variation（选题不生成）→ 核对每道题都在候选档里且已准入，
    否则这一轮 unavailable。出题时签发再练票据（HMAC，不落库，有效期 ticket_ttl_minutes）。
    作答：验票 → 重新确认条目仍开着票据那一轮 → 组装 learning-internal v1 的 GradeIngest 信封经既有 grade 写入流程落库并同步重算
    （channel = keypad、purpose = practice 由服务端写入；hint_level_used = 0）。判分请求的键就是作答的 idempotency_key：
    同键同内容回原结果（响应头 idempotent-replayed: true），同键异内容 409 IDEMPOTENCY_CONFLICT；5xx 一律是结果未知，BFF 用同一个键重试。
    只查不执行的重放不另建：用既有的 GET /internal/v1/replay/grade/{idempotency_key}?student_ref=&usage_id=（learning-internal v1），
    BFF 只取其中的 verdict，条目状态另调 queue（重放摘要里的证据 ID、错因不得转给前端）。
    返回给 BFF 的内容不含掌握、置信度、证据 ID、错因与任何解释文字（规则 3、11）；题面只有 format、stem、options，不含答案与解析。
    鉴权：Bearer 服务间令牌，只认 BFF 的令牌（编排层、洞察服务、路由客户端令牌一律 401）。请求体上限 64 KB，拒绝未知键、NaN、重复键。
    没配再练（LEARNING_PRACTICE_CONFIG）时一律 501 PRACTICE_UNAVAILABLE；没配题面提供者（合成题面只允许 LEARNING_ENV=test）、
    知识服务或该科适配器时 next、answer 回 501 PRACTICE_UNAVAILABLE。计量在 BFF（PR 3）：queue、next 不计量，answer 带 usage_id。
    写入前核对计量（LT-04，迁移 0058）：answer 的 usage_id + idempotency_key + 学生须对上 BFF 的题库自练计次（meter_practice），
    否则 409 IDEMPOTENCY_KEY_SEALED（该幂等键无有效计量，不可写入）；同键已成功的重放不受影响。
servers:
  - url: http://127.0.0.1:8788
security:
  - serviceToken: []
paths:
  /internal/v1/practice/queue:
    post:
      operationId: practiceQueue
      description: 学生一科的错题条目（每个单元一条，按最近活动从新到旧，最多 queue_cap 条）。只读，不写任何表，不计量。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, subject]
              properties:
                student_ref: { type: string, format: uuid, description: 小写 UUID }
                subject: { enum: [aya, zhixing, wenli], description: 只接受配置里开启的学科（默认 aya、zhixing），否则 400 SUBJECT_NOT_SUPPORTED }
      responses:
        '200':
          description: 条目列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subject, entries]
                properties:
                  subject: { type: string }
                  entries: { type: array, items: { $ref: '#/components/schemas/Entry' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { description: BUSY（连接池忙），可重试 }
  /internal/v1/practice/next:
    post:
      operationId: practiceNext
      description: >
        为一个开着（due）的条目出一道再练题：题目引用、题面与票据。没有合格候选、适配器返回空或结果没通过平台核对时
        200 status = unavailable 加 empty_reason（不生成新题）。不写任何表，不计量。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, subject, entry_id]
              properties:
                student_ref: { type: string, format: uuid }
                subject: { enum: [aya, zhixing, wenli] }
                entry_id: { type: string, format: uuid, description: queue 返回的条目 ID }
      responses:
        '200':
          description: 一道再练题，或这一轮不可用
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/NextReady' }
                  - { $ref: '#/components/schemas/NextUnavailable' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: ENTRY_NOT_FOUND（不存在与不属于这个学生同样 404） }
        '409': { description: PRACTICE_NOT_DUE（条目在等下一轮、已闭环或做满） }
        '501': { description: PRACTICE_UNAVAILABLE、PRESENTER_UNAVAILABLE }
        '503': { description: KNOWLEDGE_UNAVAILABLE、UPSTREAM_UNAVAILABLE、BUSY（连接池忙），可重试 }
  /internal/v1/practice/answer:
    post:
      operationId: practiceAnswer
      description: >
        再练作答：票据有效、属于这个学生与学科、条目仍开着票据那一轮，才经既有 grade 写入流程落库（证据由学习服务落库，掌握由 KGE-04 重算）。
        purpose、channel 不能由请求给出（给了即 400）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, subject, ticket, answer, idempotency_key, usage_id]
              properties:
                student_ref: { type: string, format: uuid }
                subject: { enum: [aya, zhixing, wenli] }
                ticket: { type: string, maxLength: 1024, description: next 返回的票据 }
                answer: { type: object, description: '{text} 或 {choice}，按题型核对（不合格 422 INVALID_ANSWER，不送判分）' }
                idempotency_key: { type: string, description: 小写 UUIDv4；也是判分请求的键（重放查询用它） }
                usage_id: { type: string, format: uuid, description: BFF 计量返回的 usage_id（PR 3：题库自练 meter_practice） }
      responses:
        '200':
          description: 作答已记录（响应头 idempotent-replayed 标明是否同一键重放）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerResult' }
        '400': { description: INVALID_REQUEST、SUBJECT_NOT_SUPPORTED }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: TICKET_INVALID（伪造、篡改、跨学生、跨学科） }
        '409': { description: PRACTICE_NOT_DUE、TICKET_USED（这张票据的题签发后已作答过，换键也不能再答）、IDEMPOTENCY_CONFLICT、IDEMPOTENCY_KEY_SEALED }
        '410': { description: TICKET_EXPIRED }
        '422': { description: INVALID_ANSWER、CONTENT_NOT_REGISTERED }
        '501': { description: PRACTICE_UNAVAILABLE、PRESENTER_UNAVAILABLE }
        '502': { description: ADAPTER_RESULT_REJECTED（判分结果没通过平台核对；一行不写） }
        '503': { description: BUSY（同一条目正在判分，或连接池忙）、UPSTREAM_UNAVAILABLE，可重试（用同一个键） }
        '500': { description: INTERNAL：结果未知，用同一个键重试 }
components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer }
  schemas:
    RichItem:
      type: object
      additionalProperties: false
      required: [stem]
      description: |
        PLT-12：受限富文本题面（插件契约 1.1.0 候选版 present_item 的题干段落与选项片段，学习服务过两道白名单后原样给出）。
        只在 LEARNING_PRESENT_ITEM_SOURCE=adapter 时出现（候选契约开关打开，签字前只在测试里）；开关关闭时没有这个键，题面与之前逐字节一致。
        stem、options[].text 是纯文字兜底（公式写 LaTeX 源码、图片写 [图]）。不含答案、解析、采分点。
      properties:
        stem: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/RichParagraph' } }
        options:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [key, content]
            properties:
              key: { type: string, pattern: '^[A-Za-z0-9]{1,8}$' }
              content: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/RichInline' } }
    RichParagraph:
      type: object
      additionalProperties: false
      required: [type, runs]
      properties:
        type: { const: paragraph }
        runs: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/RichInline' } }
    RichInline:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties: { type: { const: text }, text: { type: string, maxLength: 2000, pattern: '^[^<>\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u200B-\u200F\u2028\u2029\u202A-\u202E\u2066-\u2069\uFEFF]{1,2000}$' } }
        - type: object
          additionalProperties: false
          required: [type, latex]
          properties: { type: { const: math }, latex: { type: string, maxLength: 1000, pattern: '^(?!.*\\(?:href|url|includegraphics|htmlClass|htmlId|htmlStyle|htmlData|def|gdef|edef|xdef|let|newcommand|renewcommand|providecommand|newenvironment|input|include|write|immediate|catcode|csname)(?![A-Za-z]))[\x20-\x7E]{1,1000}$' } }
        - type: object
          additionalProperties: false
          required: [type, image_ref]
          properties:
            type: { const: image }
            image_ref: { type: string, pattern: '^objstore://[a-z0-9][a-z0-9/_.\-]{0,255}$' }
            alt: { type: string, maxLength: 200, pattern: '^[^<>\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u200B-\u200F\u2028\u2029\u202A-\u202E\u2066-\u2069\uFEFF]{1,200}$' }
    Entry:
      type: object
      additionalProperties: false
      required: [entry_id, node_id, cognitive_level, source, status, round, max_rounds, source_item_ref, next_round_at, retest_due,
                 same_family_only, empty_reason]
      properties:
        entry_id: { type: string, format: uuid, description: 同一学生同一单元固定；不同学生不同 }
        node_id: { type: string }
        cognitive_level: { enum: [know, understand, apply, synthesize] }
        source: { enum: [wrong, hint_followup] }
        status: { enum: [due, waiting, closed, exhausted, unavailable] }
        round: { type: integer, minimum: 1 }
        max_rounds: { type: integer, minimum: 1 }
        source_item_ref: { type: [string, 'null'], description: 原题引用（hint_followup 找不到提示后做对的题时为空） }
        next_round_at: { type: [string, 'null'], format: date-time, description: 只在 waiting 时有值 }
        retest_due: { type: boolean, description: 单元有到期的复测轮：这时的再练作答同时就是复测（KGE-04 既有规则，前端照常显示“再练”） }
        same_family_only: { type: boolean, description: 只有同族候选（做对能闭环，但不计入掌握）；只对 due 条目计算 }
        empty_reason: { type: [string, 'null'], description: 只在 unavailable 时有值 }
    NextReady:
      type: object
      additionalProperties: false
      required: [status, entry_id, round, item_ref, item, ticket, expires_at, same_family_only]
      properties:
        status: { const: ready }
        entry_id: { type: string, format: uuid }
        round: { type: integer, minimum: 1 }
        item_ref: { type: string, description: 只给 BFF；前端只要题面 }
        item:
          type: object
          additionalProperties: false
          required: [format, stem]
          properties:
            format: { enum: [single, multi, fill] }
            stem: { type: string }
            options:
              type: array
              items: { type: object, additionalProperties: false, required: [key, text], properties: { key: { type: string }, text: { type: string } } }
            rich: { $ref: '#/components/schemas/RichItem' }
        ticket: { type: string, maxLength: 1024 }
        expires_at: { type: string, format: date-time }
        same_family_only: { type: boolean }
    NextUnavailable:
      type: object
      additionalProperties: false
      required: [status, empty_reason]
      properties:
        status: { const: unavailable }
        empty_reason:
          enum: [no_candidate, no_admitted_candidate, all_excluded, skill_node_unknown, subject_not_supported, adapter_result_rejected,
                 adapter_unavailable, no_objective_candidate, no_source_item]
          description: >
            no_objective_candidate：有已准入候选，但没有验证器或确定性 Rubric 判分的客观题（首发只覆盖客观题）；
            no_source_item：hint_followup 找不到提示后做对的那道题，不调适配器。
    AnswerResult:
      type: object
      additionalProperties: false
      required: [verdict, entry]
      properties:
        verdict: { type: string, description: 来自 grade 摘要的判分结论（验证器或 Rubric，规则 3）；待复核时原样保留 }
        pending_review:
          const: true
          description: 只在判分待人工复核（human_review_required）时出现：verdict 不是定论，这次作答不算错题也不能闭环
        entry:
          type: object
          additionalProperties: false
          required: [entry_id, status, round, next_round_at]
          properties:
            entry_id: { type: string, format: uuid }
            status: { enum: [due, waiting, closed, exhausted] }
            round: { type: integer, minimum: 1 }
            next_round_at: { type: [string, 'null'], format: date-time }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        retryable: { type: boolean }
  responses:
    Problem:
      description: 错误（problem+json；detail 不含作答与票据）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
