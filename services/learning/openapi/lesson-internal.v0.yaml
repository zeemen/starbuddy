# 学习服务的讲评课内部接口（specs/stage-lesson-session/spec.md 第二节第 1、4 条，PR ③b-4）。只供 BFF 调用。
# 放在服务目录而不是 packages/contracts：与诊断、再练、复测、今日编排的内部接口同一先例（规格第二节第 1 条）。
openapi: 3.1.0
info:
  title: StarBuddy learning service · lesson session (internal, v0 draft)
  version: 0.1.0
  description: >
    一节讲评课一笔 lesson_whiteboard 预留（BFF 打开时预留、内容下发即结算），课内提问不另扣，只累计会话上的次数（迁移 0064）。
    打开（open）：BFF 先以学生身份预留一次 lesson_whiteboard（teach，数量 1），再把 usage_id 与预留幂等键交给这里。建会话时库里的守卫
    核对这笔预留（usage_id、幂等键、学生、teach、lesson_whiteboard、未过期），对不上 409 IDEMPOTENCY_KEY_SEALED、不调适配器；
    同一个预留键再来按幂等重放（同一个会话，响应头 idempotent-replayed: true）。然后调适配器 teach(mode: lesson, lesson_ref)
    （插件契约 1.1.0 候选版），按契约 TeachResponse、packages/stage 冻结的 0.3.0 schema 与台词配对规则校验讲解 DSL 与台词稿：
    合格 → 会话 open、签发讲评课票据（lt1，HMAC，不落库，到会话过期时间失效）；适配器确定拒绝 → 422 LESSON_NOT_AVAILABLE、
    结果不合格 → 502 ADAPTER_RESULT_REJECTED（两者会话都标 failed，BFF 释放预留）；暂时失败 → 503（会话留在 opening，BFF 用同一个键重试）。
    提问（ask）：BFF 核过自己的票据封装后转来学习服务票据与第一阶段的提问对象（cursor、anchor、intent；讲评课引用与 DSL 版本取自票据）。
    验票（学生一致、未过期）→ 库里 platform.lesson_session_ask 放行（已下发、未过期、预留仍有效、没到上限；同一个提问键是重放，不加次数）
    → 调适配器 teach(question)，usage_id 用会话那一笔，幂等键按（会话，第几问）派生。超过上限、适配器 422 MODE_NOT_SUPPORTED（没有这条答疑）
    都回 200 outcome = no_answer；每问都不扣次。answer_submitted 由学习服务按作答记录判定，不信前端自报。
    提问与回答不进证据、掌握与判断，不落库、不进日志（规格第二节第 5 条）。返回给 BFF 的讲解与回答是公共层内容，不含关于学生的陈述。
    鉴权：Bearer 服务间令牌，只认 BFF 的会话令牌（LEARNING_SESSION_TOKEN）。请求体上限 64 KB，拒绝未知键、NaN、重复键。
    没配讲评课票据密钥（LEARNING_LESSON_TICKET_SECRET；签字前还要 STARBUDDY_ALLOW_CANDIDATE_CONTRACT=1）时一律 501 LESSON_UNAVAILABLE。
servers:
  - url: http://127.0.0.1:8788
security:
  - bffSessionToken: []
paths:
  /internal/v1/lesson/open:
    post:
      operationId: lessonOpen
      description: 打开一节讲评课（建会话、取讲解 DSL 与台词稿、签发票据）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, subject, lesson_ref, usage_id, idempotency_key]
              properties:
                student_ref: { type: string, format: uuid, description: 小写 UUID }
                subject: { enum: [aya], description: 只有阿鸦有讲评课；其余 400 SUBJECT_NOT_SUPPORTED }
                lesson_ref:
                  type: object
                  additionalProperties: false
                  required: [lesson_id, lesson_version]
                  properties:
                    lesson_id: { type: string, pattern: '^[a-z][a-z0-9_.\-]{0,63}$' }
                    lesson_version: { type: string, pattern: '^\d{1,3}\.\d{1,3}\.\d{1,4}$' }
                usage_id: { type: string, format: uuid, description: BFF 预留的 lesson_whiteboard 的 usage_id }
                idempotency_key: { type: string, description: 那笔预留的幂等键（小写 UUIDv4） }
      responses:
        '201':
          description: 新开的讲评课
          content: { application/json: { schema: { $ref: '#/components/schemas/LessonOpened' } } }
        '200':
          description: 同一个预留键的幂等重放（同一个会话）
          content: { application/json: { schema: { $ref: '#/components/schemas/LessonOpened' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: IDEMPOTENCY_KEY_SEALED（没有对得上的讲评课预留）、IDEMPOTENCY_CONFLICT（同一个键开过另一节课）
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: LESSON_NOT_AVAILABLE（讲评课目录里没有这节课、带来的节点或题与目录不一致——这两种不建会话；适配器确定拒绝，或这节课之前已打开失败）
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501': { $ref: '#/components/responses/Problem' }
        '502':
          description: ADAPTER_RESULT_REJECTED（讲解 DSL 或台词稿不合格，不下发）
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/lesson/catalog:
    post:
      operationId: lessonCatalog
      description: >
        讲评课目录（specs/lesson-catalog PR B）：一科已发布的讲评课，经适配器只读方法 list_lessons（插件契约 1.1.0 草稿内追加）取得，
        按学科在进程内缓存 5 分钟。只给编号、版本、标题与步数；节点与题不出学习服务。不计量、不建会话；与学生无关，student_ref 只用于库层处理判据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, subject]
              properties:
                student_ref: { type: string, format: uuid }
                subject: { enum: [aya], description: 只有阿鸦有讲评课；其余 400 SUBJECT_NOT_SUPPORTED }
      responses:
        '200':
          description: 目录（没有讲评课时为空数组）
          content: { application/json: { schema: { $ref: '#/components/schemas/LessonCatalog' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '502':
          description: ADAPTER_RESULT_REJECTED（适配器的目录不合契约，整份拒绝）
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/lesson/ask:
    post:
      operationId: lessonAsk
      description: 课内提问（指着白板元素问为什么、是什么、从哪来）。不扣次，只累计会话上的提问次数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, ticket, question, idempotency_key]
              properties:
                student_ref: { type: string, format: uuid }
                ticket: { type: string, maxLength: 1024, description: 打开时签发的学习服务讲评课票据（lt1.<载荷>.<签名>） }
                question:
                  type: object
                  additionalProperties: false
                  required: [cursor, anchor, intent]
                  properties:
                    cursor: { type: integer, minimum: 1, maximum: 100 }
                    anchor:
                      type: object
                      additionalProperties: false
                      required: [kind, id]
                      properties:
                        kind: { enum: [element, slot, step] }
                        id: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
                    intent: { enum: [why_step, what_is, where_from] }
                idempotency_key: { type: string, description: 这一问的幂等键（小写 UUIDv4）；同一个键再来是重放 }
      responses:
        '200':
          description: 回答，或“不答”（没有这条答疑、到了上限）
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/AskAnswered' }
                  - { $ref: '#/components/schemas/AskNoAnswer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: LESSON_NOT_OPEN（还没下发或已失败）、IDEMPOTENCY_KEY_SEALED（那笔预留已释放或已过期）
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '410':
          description: TICKET_EXPIRED（过了会话有效期，与预留一致）
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: TICKET_INVALID（伪造、篡改、换学生）、QUESTION_NOT_ANSWERABLE（适配器拒收这一问，例如指着还没出现的东西）
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bffSessionToken: { type: http, scheme: bearer }
  schemas:
    LessonOpened:
      type: object
      additionalProperties: false
      required: [session_id, usage_id, dsl_version, dsl, script, ticket, expires_at, question_limit, question_count]
      properties:
        session_id: { type: string, format: uuid }
        usage_id: { type: string, format: uuid, description: 会话挂的那笔预留（BFF 据此结算） }
        dsl_version: { const: 0.3.0 }
        dsl: { type: object, description: 讲解 DSL（packages/stage 0.3.0；已校验） }
        script:
          type: object
          description: 台词稿（只有字幕台词，不含预制答疑；已与讲解 DSL 配对核对）
          required: [dsl_version, lines]
          additionalProperties: false
          properties:
            dsl_version: { const: 0.3.0 }
            lines: { type: array }
        ticket: { type: string, maxLength: 1024 }
        expires_at: { type: string, format: date-time, description: 会话过期时间（即那笔预留的过期时间） }
        question_limit: { type: integer, minimum: 1, maximum: 20 }
        question_count: { type: integer, minimum: 0 }
    LessonCatalog:
      type: object
      additionalProperties: false
      required: [subject, lessons]
      properties:
        subject: { enum: [aya] }
        lessons:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [lesson_ref, title, step_count]
            properties:
              lesson_ref:
                type: object
                additionalProperties: false
                required: [lesson_id, lesson_version]
                properties:
                  lesson_id: { type: string, pattern: '^[a-z][a-z0-9_.\-]{0,63}$' }
                  lesson_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
              title: { type: string, minLength: 1, maxLength: 40, description: 讲解 DSL 的标题（公共层内容） }
              step_count: { type: integer, minimum: 1, maximum: 100 }
    AskAnswered:
      type: object
      additionalProperties: false
      required: [outcome, text, question_seq, questions_left]
      properties:
        outcome: { const: answered }
        text: { type: string, description: 预制答疑台词原文（公共层内容） }
        question_seq: { type: integer, minimum: 1 }
        questions_left: { type: integer, minimum: 0 }
    AskNoAnswer:
      type: object
      additionalProperties: false
      required: [outcome, reason, question_seq, questions_left]
      properties:
        outcome: { const: no_answer }
        reason: { enum: [not_available, limit], description: not_available：没有这条答疑；limit：已到本节提问上限 }
        question_seq: { type: [integer, 'null'], minimum: 1, description: limit 时为 null（这一问不计次） }
        questions_left: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        retryable: { type: boolean }
  responses:
    Problem:
      description: 错误（problem+json；detail 不含提问、票据与讲解文字）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
