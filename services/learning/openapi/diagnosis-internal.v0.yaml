# 学习服务的自适应诊断内部接口（SIE-02a，specs/sie-02a-math-diagnosis/spec.md 设计要点 1–3）。只供 BFF 调用。
# 放在服务目录而不是 packages/contracts：本任务不改契约（CLAUDE.md 必停项）；是否并入 learning-internal 契约另起 [NEEDS-HUMAN] PR（lessons 待人确认）。
openapi: 3.1.0
info:
  title: StarBuddy learning service · adaptive diagnosis (internal, v0 draft)
  version: 0.1.0
  description: >
    显式状态机：created → probing → awaiting_answer → grading → selecting → process_tasks → finished | paused | abandoned
    （grading 只存在于一次请求之内）。会话与步骤存迁移 0027 的两张表；证据、作答、判分经既有 grade 写入流程落库（阿鸦验证器，规则 3）。
    选题规则 aya-diag-trace@0.1.0（确定性、算法版本入库）。学习服务不认学生身份：BFF 负责只认学生本人，这里只核对会话属于 student_ref
    （不属于与不存在同样 404 SESSION_NOT_FOUND）。计量在 BFF：会话只记 usage_id。
    幂等：开始按 (student_ref, idempotency_key)；探针、作答、暂停、放弃以（会话、序号）为锚点，重放回原结果与响应头 idempotent-replayed: true。
    鉴权：Bearer 服务间令牌（与 learning-internal 契约同一做法）。请求体上限 64 KB，拒绝未知键、NaN、重复键。
    没配合成题面（LEARNING_DIAGNOSIS_PRESENTER=synthetic，只允许 LEARNING_ENV=test）时一律 501 DIAGNOSIS_UNAVAILABLE。
servers:
  - url: http://127.0.0.1:8788
security:
  - serviceToken: []
paths:
  /internal/v1/diagnosis/sessions:
    post:
      operationId: startDiagnosisSession
      description: 开始；同一幂等键重放回原会话；已有未结束的会话时续做它（暂停的恢复为进行中），返回它原来的 usage_id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, subject, usage_id, idempotency_key]
              properties:
                student_ref: { type: string, format: uuid }
                subject: { const: aya }
                usage_id: { type: string, format: uuid }
                idempotency_key: { type: string, description: 小写 UUIDv4 }
      responses:
        '201': { $ref: '#/components/responses/Started' }
        '200': { $ref: '#/components/responses/Started' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/diagnosis/sessions/{session_id}:
    get:
      operationId: getDiagnosisSession
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: student_ref, in: query, required: true, schema: { type: string, format: uuid } }
      description: 当前状态与当前题（题面来自题面提供者，不含答案）。判分成功而步骤未推进（上一请求中断）时按已记录的判分推进。
      responses:
        '200':
          description: 会话视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /internal/v1/diagnosis/sessions/{session_id}/probe:
    post:
      operationId: recordDiagnosisProbe
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      description: 把 BFF 以学生身份写好的 2-L 探针记到当前步骤（核对：同一学生、同一学科、同一道题、尚未关联作答）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, seq, probe_id]
              properties:
                student_ref: { type: string, format: uuid }
                seq: { type: integer }
                probe_id: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: STEP_NOT_CURRENT、INVALID_STATE、PROBE 已记另一条 }
        '422': { description: PROBE_MISMATCH }
  /internal/v1/diagnosis/sessions/{session_id}/answer:
    post:
      operationId: answerDiagnosisStep
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      description: >
        作答：经 grade 写入流程调阿鸦验证器（请求键 diag-<会话>-<序号>-<n>，同一内容重放不再判）；步骤记下判分引用，会话累计用时与题数，
        按规则选下一步。过程题、讲解题的书写原文另记一条学生原文证据（不评分），步骤以 process_observation 进统一复核队列。不回对错。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, seq, answer, elapsed_sec]
              properties:
                student_ref: { type: string, format: uuid }
                seq: { type: integer }
                answer: { type: object, description: '{text} 或 {choice}，按题型核对' }
                work: { type: string, maxLength: 20000 }
                elapsed_sec: { type: integer, minimum: 0, maximum: 7200 }
      responses:
        '200':
          description: 作答已记录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attempt_id, probe_id, status, usage_id]
                properties:
                  attempt_id: { type: string, format: uuid, description: BFF 用它按 2-L 关联探针 }
                  probe_id: { type: [string, 'null'], format: uuid }
                  status: { enum: [active, paused, finished, abandoned] }
                  usage_id: { type: string, format: uuid, description: 会话结束时 BFF 据此结算 }
        '409': { description: STEP_NOT_CURRENT、INVALID_STATE、IDEMPOTENCY_CONFLICT、SESSION_INCONSISTENT }
        '422': { description: INVALID_ANSWER（不送验证器） }
        '502': { description: ADAPTER_RESULT_REJECTED（验证器结果没通过平台核对；换内容可再答） }
        '503': { description: BUSY（同一步正在判分）、KNOWLEDGE_UNAVAILABLE，可重试 }
  /internal/v1/diagnosis/sessions/{session_id}/pause:
    post:
      operationId: pauseDiagnosisSession
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref]
              properties:
                student_ref: { type: string, format: uuid }
                seq: { type: integer }
                step_elapsed_sec: { type: integer, minimum: 0, maximum: 7200 }
      responses:
        '200': { $ref: '#/components/responses/Status' }
        '409': { description: INVALID_STATE（已结束或已放弃） }
  /internal/v1/diagnosis/sessions/{session_id}/abandon:
    post:
      operationId: abandonDiagnosisSession
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref]
              properties:
                student_ref: { type: string, format: uuid }
      responses:
        '200':
          description: 已放弃（返回 usage_id 供 BFF 释放预留）
          content:
            application/json:
              schema:
                type: object
                required: [status, usage_id]
                properties: { status: { const: abandoned }, usage_id: { type: string, format: uuid } }
        '409': { description: INVALID_STATE（已结束） }
components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer }
  schemas:
    SessionView:
      type: object
      additionalProperties: false
      required: [session_id, status, state, usage_id, elapsed_sec, time_budget_sec, item_count, item_limit, step]
      properties:
        session_id: { type: string, format: uuid }
        status: { enum: [active, paused, finished, abandoned] }
        state: { enum: [created, probing, awaiting_answer, grading, selecting, process_tasks, paused, finished, abandoned] }
        usage_id: { type: string, format: uuid }
        elapsed_sec: { type: integer }
        time_budget_sec: { type: integer }
        item_count: { type: integer }
        item_limit: { type: integer }
        step:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [seq, kind, subject, item_id, item, probe_recorded, step_elapsed_sec]
              properties:
                seq: { type: integer }
                kind: { enum: [adaptive, process, explain] }
                subject: { const: aya }
                item_id: { type: string, description: 只给 BFF 写探针用；BFF 不转给前端 }
                item:
                  type: object
                  additionalProperties: false
                  required: [format, stem]
                  properties:
                    format: { enum: [single, multi, fill] }
                    stem: { type: string }
                    options: { type: array, items: { type: object, required: [key, text], properties: { key: { type: string }, text: { type: string } } } }
                probe_recorded: { type: boolean }
                step_elapsed_sec: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        retryable: { type: boolean }
  responses:
    Started:
      description: 会话（响应头 idempotent-replayed 标明是否同一幂等键重放）
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [session_id, usage_id, status, created]
            properties:
              session_id: { type: string, format: uuid }
              usage_id: { type: string, format: uuid }
              status: { enum: [active, paused, finished, abandoned] }
              created: { type: boolean }
    Ok:
      description: 已记录
      content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } }
    Status:
      description: 会话状态
      content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } }
    Problem:
      description: 错误（problem+json；detail 不含作答）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
