# 学习服务的自适应诊断内部接口（SIE-02a，specs/sie-02a-math-diagnosis/spec.md 设计要点 1–3）。只供 BFF 调用。
# 放在服务目录而不是 packages/contracts：本任务不改契约（CLAUDE.md 必停项）；是否并入 learning-internal 契约另起 [NEEDS-HUMAN] PR（lessons 待人确认）。
openapi: 3.1.0
info:
  title: StarBuddy learning service · adaptive diagnosis (internal, v0 draft)
  version: 0.1.0
  description: >
    显式状态机：created → probing → awaiting_answer → grading → selecting → process_tasks → finished | paused | abandoned
    （grading 只存在于一次请求之内）。会话与步骤存迁移 0027 的两张表；证据、作答、判分经既有 grade 写入流程落库（阿鸦验证器，规则 3）。
    选题规则 aya-diag-trace@0.1.0（确定性、算法版本入库）。学习服务不认学生身份：BFF 负责只认学生本人，这里只核对会话属于 student_ref
    （不属于与不存在同样 404 SESSION_NOT_FOUND）。计量在 BFF：会话只记 usage_id。
    幂等：开始按 (student_ref, idempotency_key)；探针、暂停、放弃以（会话、序号）为锚点，重放回原结果与响应头 idempotent-replayed: true；
    作答另记幂等键（diagnosis_step.answer_key）：同键或同内容重放回原结果，键不同且内容不同 409 ANSWER_CONFLICT。
    用时按墙钟封顶：min(上报值, 暂停前已记 + 现在 − max(出题时间, 最近一次续做时间))。
    作答走 v1 写入路径（learning-internal v1 信封，channel = keypad；learning-internal v1 于 2026-10-20 签字，LT-04）；写入前按会话自己的
    usage_id 与预留键（开始时的 idempotency_key）、方法 diagnose 核对 BFF 的 diagnosis_full 预留，预留中、已结算，或会话在预留有效期内开始
    而预留之后才过期（已过期未处理或已过期；开始后超过有效期才作答仍可推进）才放行；会话创建于预留过期之后、预留已释放、没有记录等一律作答 409
    IDEMPOTENCY_KEY_SEALED（该幂等键无有效计量，不可写入）；
    合成题面只允许 LEARNING_ENV=test 且库名为 starbuddy_dev* / starbuddy_test*。
    鉴权：Bearer 服务间令牌（与 learning-internal 契约同一做法）。请求体上限 64 KB，拒绝未知键、NaN、重复键。
    没配合成题面（LEARNING_DIAGNOSIS_PRESENTER=synthetic，只允许 LEARNING_ENV=test）时一律 501 DIAGNOSIS_UNAVAILABLE。
servers:
  - url: http://127.0.0.1:8788
security:
  - bffSessionToken: []
paths:
  /internal/v1/diagnosis/sessions:
    post:
      operationId: startDiagnosisSession
      description: >
        开始；同一幂等键重放回原会话；已有未结束的会话时续做它（暂停的恢复为进行中），返回它原来的 usage_id。
        续做的会话中途届别被改、建立时刻的年级变了（或不在 7–9）时 409 SESSION_INCONSISTENT，问题体带 session_id 与 reason = grade_changed，
        会话不动（迁移 0049，specs/policy-decisions-v0.9.1 PR3 #12）；取当前题、作答时同样。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, subject, usage_id, idempotency_key]
              properties:
                student_ref: { type: string, format: uuid }
                subject: { const: aya }
                usage_id: { type: string, format: uuid }
                idempotency_key: { type: string, description: 小写 UUIDv4 }
      responses:
        '201': { $ref: '#/components/responses/Started' }
        '200': { $ref: '#/components/responses/Started' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/diagnosis/sessions/{session_id}:
    get:
      operationId: getDiagnosisSession
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: x-student-ref, in: header, required: true, schema: { type: string, format: uuid },
            description: 学生 ID 走请求头，不进 URL（访问日志里不留学生 ID）；放在 query 里 400 }
      description: 当前状态与当前题（题面来自题面提供者，不含答案）。判分成功而步骤未推进（上一请求中断）时按已记录的判分推进。
      responses:
        '200':
          description: 会话视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /internal/v1/diagnosis/sessions/{session_id}/probe:
    post:
      operationId: recordDiagnosisProbe
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      description: >
        把 BFF 以学生身份写好的 2-L 探针记到当前步骤（核对：同一学生、同一学科、同一道题、尚未关联作答）。
        probe_id 与 probe_key 二选一：BFF 写探针用（会话、序号）派生的幂等键，并发提交时后到的那次按键找回同一条（不留孤儿行）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, seq]
              properties:
                student_ref: { type: string, format: uuid }
                seq: { type: integer }
                probe_id: { type: string, format: uuid }
                probe_key: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: STEP_NOT_CURRENT、INVALID_STATE、PROBE 已记另一条 }
        '422': { description: PROBE_MISMATCH }
  /internal/v1/diagnosis/sessions/{session_id}/answer:
    post:
      operationId: answerDiagnosisStep
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      description: >
        作答：经 v1 grade 写入流程调阿鸦验证器（请求键由（会话、序号、n）派生，同一内容重放不再判）；步骤记下判分引用与作答幂等键，
        会话累计用时（封顶后）与题数，按规则选下一步。过程题、讲解题的书写原文另记一条学生原文证据（不评分，准入 pending_review），
        证据 ID 记到步骤的 work_evidence_id，步骤以 process_observation 进统一复核队列。不回对错。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref, seq, answer, elapsed_sec, idempotency_key]
              properties:
                student_ref: { type: string, format: uuid }
                seq: { type: integer }
                answer: { type: object, description: '{text} 或 {choice}，按题型核对' }
                work: { type: string, maxLength: 20000, description: 过程题、讲解题必填。中断后重放须带同一段原文（学习服务不缓存原文）。 }
                elapsed_sec: { type: integer, minimum: 0, maximum: 7200 }
                idempotency_key: { type: string, description: 小写 UUIDv4（BFF 转来的前端作答键） }
      responses:
        '200':
          description: 作答已记录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attempt_id, probe_id, status, usage_id]
                properties:
                  attempt_id: { type: string, format: uuid, description: BFF 用它按 2-L 关联探针 }
                  probe_id: { type: [string, 'null'], format: uuid }
                  status: { enum: [active, paused, finished, abandoned] }
                  usage_id: { type: string, format: uuid, description: 会话结束时 BFF 据此结算 }
        '409': { description: STEP_NOT_CURRENT、INVALID_STATE、ANSWER_CONFLICT（同一步已用别的内容作答）、IDEMPOTENCY_CONFLICT、SESSION_INCONSISTENT }
        '422': { description: INVALID_ANSWER（不送验证器）、ANSWER_RETRIES_EXHAUSTED }
        '502': { description: ADAPTER_RESULT_REJECTED（验证器结果没通过平台核对；换内容可再答） }
        '503': { description: BUSY（同一步正在判分）、KNOWLEDGE_UNAVAILABLE，可重试 }
  /internal/v1/diagnosis/sessions/{session_id}/pause:
    post:
      operationId: pauseDiagnosisSession
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref]
              properties:
                student_ref: { type: string, format: uuid }
                seq: { type: integer }
                step_elapsed_sec: { type: integer, minimum: 0, maximum: 7200 }
      responses:
        '200': { $ref: '#/components/responses/Status' }
        '409': { description: INVALID_STATE（已结束或已放弃） }
  /internal/v1/diagnosis/sessions/{session_id}/abandon:
    post:
      operationId: abandonDiagnosisSession
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_ref]
              properties:
                student_ref: { type: string, format: uuid }
      responses:
        '200':
          description: >
            已放弃（返回 usage_id、已作答题数与放弃原因）。普通放弃：没答过题 BFF 才释放预留，答过题不退。
            abandon_reason = grade_changed：会话中途届别被改、建立时刻的年级变了（迁移 0049，记在会话上）；这类放弃即使答过题也退回额度
            （BFF 调 platform.meter_refund_grade_changed，库里按会话上的原因再核对）。重放时返回第一次记下的原因
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, usage_id, item_count, abandon_reason]
                properties:
                  status: { const: abandoned }
                  usage_id: { type: string, format: uuid }
                  item_count: { type: integer }
                  abandon_reason: { enum: [grade_changed, null] }
        '409': { description: INVALID_STATE（已结束） }
components:
  securitySchemes:
    bffSessionToken:  # PLT-24（T49）：BFF 的会话令牌（LEARNING_SESSION_TOKEN / BFF_LEARNING_SESSION_TOKEN）；写入令牌与其他调用方的令牌一律 401
      type: http
      scheme: bearer
      description: BFF → 学习服务会话令牌，只开诊断、错题再练、复测、今日编排四组接口；与契约 learning-internal v1 的 bffServiceToken 不是同一枚。
  schemas:
    RichItem:
      type: object
      additionalProperties: false
      required: [stem]
      description: |
        PLT-12：受限富文本题面（插件契约 1.1.0 候选版 present_item 的题干段落与选项片段，学习服务过两道白名单后原样给出）。
        只在 LEARNING_PRESENT_ITEM_SOURCE=adapter 时出现（候选契约开关打开，签字前只在测试里）；开关关闭时没有这个键，题面与之前逐字节一致。
        stem、options[].text 是纯文字兜底（公式写 LaTeX 源码、图片写 [图]）。不含答案、解析、采分点。
      properties:
        stem: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/RichParagraph' } }
        options:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [key, content]
            properties:
              key: { type: string, pattern: '^[A-Za-z0-9]{1,8}$' }
              content: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/RichInline' } }
    RichParagraph:
      type: object
      additionalProperties: false
      required: [type, runs]
      properties:
        type: { const: paragraph }
        runs: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/RichInline' } }
    RichInline:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties: { type: { const: text }, text: { type: string, maxLength: 2000, pattern: '^[^<>\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u200B-\u200F\u2028\u2029\u202A-\u202E\u2066-\u2069\uFEFF]{1,2000}$' } }
        - type: object
          additionalProperties: false
          required: [type, latex]
          properties: { type: { const: math }, latex: { type: string, maxLength: 1000, pattern: '^(?!.*\\(?:href|url|includegraphics|htmlClass|htmlId|htmlStyle|htmlData|def|gdef|edef|xdef|let|newcommand|renewcommand|providecommand|newenvironment|input|include|write|immediate|catcode|csname)(?![A-Za-z]))[\x20-\x7E]{1,1000}$' } }
        - type: object
          additionalProperties: false
          required: [type, image_ref]
          properties:
            type: { const: image }
            image_ref: { type: string, pattern: '^objstore://[a-z0-9][a-z0-9/_.\-]{0,255}$' }
            alt: { type: string, maxLength: 200, pattern: '^[^<>\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u200B-\u200F\u2028\u2029\u202A-\u202E\u2066-\u2069\uFEFF]{1,200}$' }
    SessionView:
      type: object
      additionalProperties: false
      required: [session_id, status, state, usage_id, elapsed_sec, time_budget_sec, item_count, item_limit, process_tasks, abandon_reason, step]
      properties:
        session_id: { type: string, format: uuid }
        status: { enum: [active, paused, finished, abandoned] }
        state: { enum: [created, probing, awaiting_answer, grading, selecting, process_tasks, paused, finished, abandoned] }
        usage_id: { type: string, format: uuid }
        elapsed_sec: { type: integer }
        time_budget_sec: { type: integer }
        item_count: { type: integer }
        item_limit: { type: integer }
        process_tasks: { type: boolean, description: 本次是否已作答过过程题或讲解题（结束页据此决定文案；不是对学生的结论） }
        abandon_reason:
          enum: [grade_changed, null]
          description: 放弃原因（迁移 0049）；grade_changed 的已放弃会话，BFF 取当前题时也补调退回额度（幂等）
        step:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [seq, kind, subject, item_id, item, probe_recorded, step_elapsed_sec]
              properties:
                seq: { type: integer }
                kind: { enum: [adaptive, process, explain] }
                subject: { const: aya }
                item_id: { type: string, description: 只给 BFF 写探针用；BFF 不转给前端 }
                item:
                  type: object
                  additionalProperties: false
                  required: [format, stem]
                  properties:
                    format: { enum: [single, multi, fill] }
                    stem: { type: string }
                    options: { type: array, items: { type: object, required: [key, text], properties: { key: { type: string }, text: { type: string } } } }
                    rich: { $ref: '#/components/schemas/RichItem' }
                probe_recorded: { type: boolean }
                step_elapsed_sec: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        retryable: { type: boolean }
        session_id:
          type: string
          format: uuid
          description: >
            只在 409 SESSION_INCONSISTENT、reason = grade_changed 时出现：会话中途届别被改的那个会话（该学生自己的会话）。
            BFF 透传给前端，前端“重新开始”：放弃这个会话（退回额度）再开新会话
        reason: { enum: [grade_changed], description: 同上，只在会话中途届别被改时出现 }
  responses:
    Started:
      description: 会话（响应头 idempotent-replayed 标明是否同一幂等键重放）
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [session_id, usage_id, status, created]
            properties:
              session_id: { type: string, format: uuid }
              usage_id: { type: string, format: uuid }
              status: { enum: [active, paused, finished, abandoned] }
              created: { type: boolean }
    Ok:
      description: 已记录
      content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } }
    Status:
      description: 会话状态
      content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } }
    Problem:
      description: 错误（problem+json；detail 不含作答）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
