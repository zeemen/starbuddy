# BFF ↔ 统一壳前端的内部成员测试运营接口（specs/launch-lt06-internal-test-ops 范围第 3、4 条，决定记录第 1–3 条；迁移 0059）。
# 服务内部接口，不是学科插件契约，不放 packages/contracts（与 family-goals.v0.yaml 同一做法）。
openapi: 3.1.0
info:
  title: StarBuddy BFF · internal test operations (v0, prototype)
  version: 0.1.0
  description: >
    内部成员测试（2026 年 12 月，staging）的问题反馈、退出状态与退出测试。挂在功能开关 internal_test 上，默认关闭：关闭时三条路由都不注册，
    与表外路径同一个 404，也不做退出判断（STARBUDDY_INTERNAL_TEST=internal_test，dev / test 与 staging 可开；依赖迁移 0059，执行之前不开）。
    问题反馈：学生本人写自己的（来源记 student_self_report），有效绑定家长写孩子的（来源记 guardian_observation），来源由会话决定、请求里不收；
    固定分类 + 1–500 字文本（不含控制字符与零宽、方向覆盖等格式字符）+ 可选的页面路由模板（只收登记的模板，不含任何标识）；不附截图、
    不采集设备指纹。授权在库里（RLS：提交者必须是会话账号、来源与账号关系一致、已退出的档案不收）：兄妹、别家、已解除绑定、不存在同一个 404。
    自由文本只作反馈处理：不进判断账本、画像与任何关于学生的陈述（规则 11、12），不进访问日志、SLS 与指标（访问日志只记 outcome 枚举）。
    退出测试：家长在确认页二次确认后提交 { confirm: true }；库函数在一个事务里撤回同意（每类最新一条是 granted 的追加一条 revoked）、
    作废学生会话、写退出记录（幂等），提交之后 staging 白名单固定码按库给出的家长账号（该学生的有效绑定家长里已没有别的在测孩子的）
    作废他们固定码登录成功时对应上的条目（审计记 revoked）。已有数据保留到测试结束统一删除（走数据权利的删除流程）。
    统一判据（不挂开关：迁移 0059 执行之后无条件生效）：已退出的档案（当前账号能读且有退出记录）在任何带 {student_id} 的路由上一律
    409 TEST_EXITED——新写入、读取与触发模型处理的请求都拦，只有退出状态、退出本身与数据权利（查看与发起、确认、撤回删除，导出与下载）
    照常可用；当前账号读不到的档案判为未退出，照常得到原路由的 404（不泄露存在性）。shell.v0、trust.v0 等各文件的问题码枚举都含
    TEST_EXITED、相关操作都列 409（tests/shell-openapi.test.ts 核对）。
    不计量（反馈与退出不是消耗类请求，规则 4 不适用）。身份只来自会话（请求头 x-sb-session）；改变状态的请求另要 Origin 等于壳的来源、
    带与会话绑定的 x-csrf-token（见 shell.v0.yaml）。限流：反馈每账号每天 feedback.account.day，退出每账号每小时
    internal_test_exit.account.hour（config/auth.json）。请求体上限 16 KB。
servers:
  - url: http://127.0.0.1:8787
paths:
  /bff/v0/students/{student_id}/feedback:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/Session'
    post:
      x-sb-auth: session
      x-sb-rate-buckets: [feedback.account.day]
      operationId: postFeedback
      description: 提交一条问题反馈（学生本人或有效绑定家长）。未知键 422；不返回反馈 ID 与内容。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackInput' }
      responses:
        '201':
          description: 已记下
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: recorded }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: CSRF（Origin 或 x-csrf-token 不对）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: TEST_EXITED（档案已退出内部测试）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: INVALID（分类不在枚举、文本为空或超过 500 字或含控制与格式字符、路由模板未登记、未知键）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /bff/v0/students/{student_id}/internal-test:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/Session'
    get:
      x-sb-auth: guardian
      x-sb-rate-buckets: []
      operationId: getInternalTestStatus
      description: 有效绑定家长读孩子是否已退出内部测试。档案已退出时照常可读。
      responses:
        '200':
          description: 退出状态
          headers: { Cache-Control: { schema: { const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [student_id, exited]
                properties:
                  student_id: { type: string, format: uuid }
                  exited: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: FORBIDDEN（学生会话）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /bff/v0/students/{student_id}/internal-test/exit:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/Session'
    post:
      x-sb-auth: guardian
      x-sb-rate-buckets: [internal_test_exit.account.hour]
      operationId: postInternalTestExit
      description: >
        有效绑定家长让孩子退出内部测试（前端确认页二次确认后提交 confirm: true）：撤回同意、作废学生会话、写退出记录；重复提交幂等
        （newly_exited 为 false，结果相同）。staging 配了白名单固定码时同时按账号作废家长的白名单条目：只作废已没有别的在测孩子的
        有效绑定家长、且用固定码登录过的账号对应的号码的全部条目（whitelist_entries_revoked 是这次新作废的条数；没配时为 null）。
        档案已退出时照常可调。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { type: boolean, description: 必须为 true；为 false 时授权通过后回 403 CONFIRMATION_REQUIRED，不改任何东西 }
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [student_id, status, exited_at, newly_exited, consents_revoked, whitelist_entries_revoked]
                properties:
                  student_id: { type: string, format: uuid }
                  status: { const: exited }
                  exited_at: { type: string, format: date-time }
                  newly_exited: { type: boolean }
                  consents_revoked:
                    type: array
                    items: { enum: [guardian_consent_under14, privacy_policy, voice_processing, pilot_participation] }
                  whitelist_entries_revoked: { type: [integer, 'null'], minimum: 0 }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: CSRF、FORBIDDEN（学生会话）、CONFIRMATION_REQUIRED（confirm 不是 true）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { description: INVALID（请求体不是 { confirm 布尔 }）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    StudentId:
      name: student_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Session:
      name: x-sb-session
      in: header
      required: true
      description: 会话令牌（64 位十六进制），不进 URL 与日志
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
  schemas:
    FeedbackInput:
      type: object
      additionalProperties: false
      required: [category, body]
      properties:
        category: { enum: [malfunction, wrong_content, display, slow, login, suggestion, other] }
        body: { type: string, minLength: 1, maxLength: 500, description: 按 Unicode 码位计数；不含控制字符（换行、回车、制表除外）与零宽、方向覆盖、行段分隔等格式字符；不要填写姓名、电话等个人信息 }
        route_template:
          type: [string, 'null']
          description: 提交时所在页面的路由模板（只收 services/bff/src/http/internal-test-routes.ts 的 FEEDBACK_ROUTES 登记的模板，如 /s/[studentId]/today）
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          enum: [UNAUTHENTICATED, CSRF, FORBIDDEN, NOT_FOUND, INVALID, CONFIRMATION_REQUIRED, TEST_EXITED, TOO_MANY_REQUESTS,
                 METHOD_NOT_ALLOWED, TOO_LARGE, UNSUPPORTED_MEDIA_TYPE]
  responses:
    Problem:
      description: 统一错误体
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
