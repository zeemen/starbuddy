# BFF ↔ 统一壳前端的讲评课会话接口（specs/stage-lesson-session 第二节第 1、4 条，PR ③b-4b）。
# 服务内部接口，不是学科插件契约，不放 packages/contracts（与 practice.v0.yaml 同一做法）。
# 后面接的是学习服务的内部接口 services/learning/openapi/lesson-internal.v0.yaml（只认 BFF 的会话令牌）。
openapi: 3.1.0
info:
  title: StarBuddy BFF · lesson session (v0, prototype)
  version: 0.1.0
  description: >
    学生本人打开一节讲评课（讲解 DSL 与台词稿）并在课内指着白板元素提问（为什么、是什么、从哪来）。
    挂在功能开关 lesson 上，默认关闭：关闭时两条路由都不注册，与表外路径同一个 404（STARBUDDY_LESSON=lesson，只在 dev / test）。
    只认学生本人（x-sb-auth: student）：家长会话在任何查询之前 403；兄妹、另一户学生、不存在的学生、路径参数不合法一律同一个 404
    （x-sb-not-self: 404），越权请求不到达学习服务、不预留。
    返回给前端的只有讲解 DSL、台词稿（只有字幕台词，不含预制答疑）、不透明票据、过期时间、提问余量，以及每一问的回答文字或“不答”：
    都是公共层内容，不含关于学生的陈述（CLAUDE.md 规则 11）；提问与回答不落库、不进日志。
    计量（规则 4；规格第五节第 1、2 条，[NEEDS-HUMAN]）：打开时预留一次 lesson_whiteboard（teach，数量 1；资源、数量、usage_id 都由 BFF 决定，
    usage_id 由请求的幂等键派生），讲评课内容成功下发即结算；学习服务确定拒绝（这节课打不开、内容不合格）即释放；结果未知时不结算、不释放，
    用同一个幂等键重试找回同一笔预留与同一个会话（响应头 idempotent-replayed: true）。额度不足、基础档、宵禁等 402 QUOTA_UNAVAILABLE（reason 同 meter_reserve）。
    同一个幂等键换一节课 409 IDEMPOTENCY_KEY_REUSED；预留已释放或已过期 409 KEY_FAILED_PREVIOUSLY / KEY_EXPIRED，换一个键重新打开。
    课内提问不扣次、不预留：BFF 先核票据（换学生、伪造 422 TICKET_INVALID；过期 410 TICKET_EXPIRED，都不调学习服务），学习服务按会话那一笔预留放行，
    只累计会话上的提问次数；超过每节上限、没有这条答疑都回 200 outcome = no_answer（前端显示兜底与“再讲一遍”）。
    每一问带一个幂等键：同一问重试带同一个键（学习服务重放同一个回答，不再计次）。“再讲一遍”在前端本地重放，不调这里。
    宵禁（platform.meter_guard_status 的 in_curfew，与诊断、再练同一口径）：提问 402 reason = curfew，不调学习服务；打开由 meter_reserve 判定。
    学习服务调用在结果未知时由 BFF 重试，整体总时限 45 秒。
    身份只来自会话（请求头 x-sb-session）；改变状态的请求另要 Origin 等于壳的来源、带与会话绑定的 x-csrf-token（见 shell.v0.yaml）。
    限流：两条路由按每会话桶 lesson.session.minute（config/auth.json，每分钟 60 次）。请求体上限 16 KB。
servers:
  - url: http://127.0.0.1:8787
paths:
  /bff/v0/students/{student_id}/lessons/open:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/Session'
    post:
      x-sb-auth: student
      x-sb-rate-buckets: [lesson.session.minute]
      x-sb-not-self: 404
      operationId: openLesson
      description: 打开一节讲评课：预留一次 lesson_whiteboard，取讲解 DSL 与台词稿，下发即结算。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, lesson_ref, skill_node, idempotency_key]
              properties:
                subject: { const: aya, description: 只有阿鸦有讲评课 }
                lesson_ref:
                  type: object
                  additionalProperties: false
                  required: [lesson_id, lesson_version]
                  properties:
                    lesson_id: { type: string, pattern: '^[a-z][a-z0-9_.\-]{0,63}$' }
                    lesson_version: { type: string, pattern: '^\d{1,3}\.\d{1,3}\.\d{1,4}$' }
                skill_node: { type: string, pattern: '^aya:[A-Za-z0-9][A-Za-z0-9_.\-]{0,63}$' }
                item_ref: { type: string, pattern: '^aya:[A-Za-z0-9][A-Za-z0-9_.\-]{0,63}$', description: 讲评课针对某道题时给出 }
                idempotency_key: { type: string, description: 小写 UUIDv4；每次打开生成一个，结果未知时用同一个键重试 }
      responses:
        '200':
          description: 讲评课（新打开或同一个键的重放）
          headers:
            Cache-Control: { schema: { const: no-store } }
            idempotent-replayed: { schema: { enum: ['true', 'false'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonOpened' }
        '401': { $ref: '#/components/responses/Problem' }
        '402':
          description: 额度不足、基础档、宵禁等（reason 同 meter_reserve）；没有预留
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/QuotaProblem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: IDEMPOTENCY_KEY_REUSED（同一个键换了内容）、KEY_FAILED_PREVIOUSLY、KEY_EXPIRED（换一个键重新打开）、TEST_EXITED（LT-06）,
                 content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: INVALID（请求体不合格）、LESSON_NOT_AVAILABLE（这节课打不开；预留已释放）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { description: LESSON_UNAVAILABLE（没配学习服务或没开讲评课）、UPSTREAM_UNAVAILABLE（结果未知，用同一个键重试）,
                 content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /bff/v0/students/{student_id}/lessons/ask:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/Session'
    post:
      x-sb-auth: student
      x-sb-rate-buckets: [lesson.session.minute]
      x-sb-not-self: 404
      operationId: askLesson
      description: 课内提问（指着白板元素）。不扣次；回答文字或“不答”。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket, question, idempotency_key]
              properties:
                ticket: { type: string, maxLength: 1700, description: 打开时下发的不透明票据（sbl1.），原样带回 }
                question:
                  type: object
                  additionalProperties: false
                  required: [cursor, anchor, intent]
                  properties:
                    cursor: { type: integer, minimum: 1, maximum: 100, description: 提问时已播放的步数 }
                    anchor:
                      type: object
                      additionalProperties: false
                      required: [kind, id]
                      properties:
                        kind: { enum: [element, slot, step] }
                        id: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
                    intent: { enum: [why_step, what_is, where_from] }
                idempotency_key: { type: string, description: 这一问的小写 UUIDv4；同一问重试带同一个键 }
      responses:
        '200':
          description: 回答，或“不答”（没有这条答疑、到了本节上限）
          headers:
            Cache-Control: { schema: { const: no-store } }
            idempotent-replayed: { schema: { enum: ['true', 'false'] } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Answered' }
                  - { $ref: '#/components/schemas/NoAnswer' }
        '401': { $ref: '#/components/responses/Problem' }
        '402':
          description: 宵禁（reason = curfew）；不调学习服务
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/QuotaProblem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: LESSON_CLOSED（这节课不能再提问：没下发成功或预留已失效，重新打开）、TEST_EXITED（LT-06）,
                 content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '410': { description: TICKET_EXPIRED（过了会话有效期；BFF 本地拒绝时不调学习服务）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: INVALID（请求体或提问不合格）、TICKET_INVALID（伪造、篡改、换学生）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { description: LESSON_UNAVAILABLE、UPSTREAM_UNAVAILABLE（用同一个键重试）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
components:
  parameters:
    StudentId:
      name: student_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Session:
      name: x-sb-session
      in: header
      required: true
      description: 会话令牌（64 位十六进制），不进 URL 与日志
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
  schemas:
    LessonOpened:
      type: object
      additionalProperties: false
      required: [dsl_version, dsl, script, ticket, expires_at, questions_left]
      properties:
        dsl_version: { const: 0.3.0 }
        dsl: { type: object, description: 讲解 DSL（packages/stage 0.3.0；前端播放前再用 migrateStageDsl 读一次） }
        script: { type: object, description: 台词稿（只有字幕台词，不含预制答疑；前端用 migrateStageScript 读） }
        ticket: { type: string, description: 不透明票据（sbl1.），绑定当前学生 }
        expires_at: { type: string, format: date-time, description: 会话过期时间（与预留一致） }
        questions_left: { type: integer, minimum: 0, maximum: 20 }
    Answered:
      type: object
      additionalProperties: false
      required: [outcome, text, questions_left]
      properties:
        outcome: { const: answered }
        text: { type: string, description: 预制答疑台词（公共层内容） }
        questions_left: { type: integer, minimum: 0 }
    NoAnswer:
      type: object
      additionalProperties: false
      required: [outcome, reason, questions_left]
      properties:
        outcome: { const: no_answer }
        reason: { enum: [not_available, limit], description: not_available：没有这条答疑；limit：本节提问已到上限 }
        questions_left: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          enum: [UNAUTHENTICATED, FORBIDDEN, CSRF, NOT_FOUND, METHOD_NOT_ALLOWED, TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, INVALID, TOO_MANY_REQUESTS,
                 INTERNAL, IDEMPOTENCY_KEY_REUSED, LESSON_UNAVAILABLE, UPSTREAM_UNAVAILABLE, LESSON_NOT_AVAILABLE, TICKET_INVALID, TICKET_EXPIRED,
                 LESSON_CLOSED, KEY_FAILED_PREVIOUSLY, KEY_EXPIRED, QUOTA_UNAVAILABLE, TEST_EXITED]
    QuotaProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            reason: { enum: [curfew, curfew_soon, insufficient, no_entitlement, daily_cap_reached, retained_no_ai, dedup_in_progress] }
  responses:
    Problem:
      description: 错误（problem+json；只有错误码，不回显提问、票据与内部细节）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 不是本人、学生不存在、路径参数不合法、开关关闭（同一个 404）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
