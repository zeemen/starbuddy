# 全量检查（冲刺 1-A，specs/contract-conformance-sprint1/spec.md 范围第 5 条）。
# 严格模式 CONTRACT_STRICT=1：缺任何依赖都直接失败，不允许“跳过”变绿。
# 只用合成数据与本机一次性 Postgres；不需要、也不配置任何密钥（CLAUDE.md 规则 8、9）。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # 只取消同一 PR 的旧运行；主干上的每次推送都要跑完（安全审查 N7）
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  make-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"   # Next.js 默认会向境外发匿名遥测（ADR 09）
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 仓库令牌不写进 .git/config（安全审查 S3）
          fetch-depth: 0               # 人设回归要算 merge-base 与基线提交（冲刺 3-F，spec 待人确认 #11）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: PostgreSQL 16（只用来起本机一次性实例）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16
          sudo systemctl stop postgresql || true

      - name: 契约检查与一致性测试的依赖
        run: |
          python -m venv .venv-contracts
          .venv-contracts/bin/pip install -q -r packages/contracts/requirements-dev.txt

      - name: 学习服务依赖
        working-directory: services/learning
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: 阿鸦适配器依赖
        working-directory: adapters/aya
        run: npm ci --no-audit --no-fund

      - name: KGE-00 盘点工具依赖（只有 typescript 与 @types/node）
        working-directory: tools/kge-inventory
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: BFF 依赖
        working-directory: services/bff
        run: npm ci --no-audit --no-fund

      - name: 统一壳前端依赖与 Playwright 浏览器（冲刺 3-H；浏览器只处理合成数据，spec 待人确认 #11）
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      # 人设回归每次都跑（不靠 paths 过滤）：Prompt、禁语表、人设规格有变更时报告标“人设变更”，缺录音或录音过期严格模式失败。
      # 报告作为 Gate 0“最近一次运行报告”上传（spec 设计要点 6、待人确认 #11、#12）；不需要任何密钥
      - name: 人设回归与报告（冲刺 3-F，严格模式）
        run: make eval-persona CONTRACT_STRICT=1 PERSONA_REPORT_DIR=${{ runner.temp }}/persona-report

      - name: 上传人设回归报告（保留 90 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-report
          path: ${{ runner.temp }}/persona-report/
          retention-days: 90
          if-no-files-found: warn

      - name: make check（严格模式）
        run: make check CONTRACT_STRICT=1 PYTHON=.venv-contracts/bin/python PGBIN=/usr/lib/postgresql/16/bin
