# 由 evals/persona/diandian/lexicon/forbidden.yaml（0.2.0，冲刺 1-I 转写）原样迁入：id、origin、styles、regex、source 逐条不改，
# 只把键名 id → rule_id、regex → pattern，并补 method 与合成的正例 / 反例（examples_*，只用于分类器单测，不是人设语料）。
# origin：verbatim = 原文逐字（或逐字加最小变体）；inferred = 转写者按原文概括描述推定的典型句式，待人设负责人逐条确认。
# 禁语表属于必停项：人设负责人核对之前 reviewed 为 false（spec 待人确认 #14）。
class: A
title: 居高临下的评价性语言
source_doc: "docs/subjects/zhixing-备考搭子规格书-V1.0（已被点点替代）.md §5.2"
version: 0.2.0
reviewed: false
rules:
  - { rule_id: A-01, origin: verbatim, styles: all, method: rule, pattern: "你应该",
      source: "备考搭子 V1.0 §5.2 A 类：“你应该……”",
      examples_positive: ["你应该先读题"], examples_negative: ["我们先读题"] }
  - { rule_id: A-02, origin: verbatim, styles: all, method: rule, pattern: "你必须",
      source: "备考搭子 V1.0 §5.2 A 类：“你必须……”",
      examples_positive: ["你必须今天做完"], examples_negative: ["今天把这页做完就行"] }
  - { rule_id: A-03, origin: verbatim, styles: all, method: rule, pattern: "你要知道",
      source: "备考搭子 V1.0 §5.2 A 类：“你要知道……”",
      examples_positive: ["你要知道这很重要"], examples_negative: ["你知道这个吗"] }
  - { rule_id: A-04, origin: verbatim, styles: all, method: rule, pattern: "这么简单(都|也)不会",
      source: "备考搭子 V1.0 §5.2 A 类：“这么简单都不会”类贬低性表达",
      examples_positive: ["这么简单都不会"], examples_negative: ["这题不简单，慢慢来"] }
  - { rule_id: A-05, origin: inferred, styles: all, method: rule, pattern: "(这都|这也|连这个都)不会",
      source: "备考搭子 V1.0 §5.2 A 类：贬低性表达（典型句式）",
      examples_positive: ["连这个都不会"], examples_negative: ["这个不会没关系，我们拆开看"] }
