# 非人设的模型 Prompt：只做版本与指纹锁（改了不升版本就失败），不跑人设回归；判分 Prompt 的回归仍由各科 make eval-grade 负责（spec 待人确认 #13）。
# Prompt 是代码里的常量：登记“文件 + 符号名”，指纹按这些符号的源码（规范化后）计算；version_symbol / template_symbol 必须与登记值一致。
tasks:
  - task_id: zhixing-grade
    type: task
    owner: adapters/zhixing
    prompts:
      - prompt_id: zhixing-m3-grade
        path: adapters/zhixing/src/core/m3-prompt.ts
        symbols: [GRADING_RULES, FAILURE_MODES, JUDGMENT_TIERS, OUTPUT_FORMAT, renderPoint, buildM3GradeMessages]
        prompt_version: 0.2.0
        version_symbol: PROMPT_VERSION
        template_symbol: PROMPT_TEMPLATE
  - task_id: wenli-grade
    type: task
    owner: adapters/wenli
    prompts:
      - prompt_id: wenli-essay-grade
        path: adapters/wenli/src/core/essay-prompt.ts
        symbols: [GRADING_RULES, ANTI_FORMULA_SIGNALS, OUTPUT_FORMAT, renderDimension, buildEssayGradeMessages]
        prompt_version: 0.1.0
        version_symbol: PROMPT_VERSION
        template_symbol: PROMPT_TEMPLATE
  - task_id: kge-compile
    type: task
    owner: services/knowledge
    prompts:
      - prompt_id: kge-compile-kp
        path: services/knowledge/knowledge/compiler/full.py
        symbols: [SYSTEM_PROMPT, build_messages]
        prompt_version: "1"
        version_scheme: integer   # 代码里 PROMPT_VERSION = "1"（KGE-03），不是 semver；不改代码，登记为整数版本（lessons 偏差）
        version_symbol: PROMPT_VERSION
        template_symbol: PROMPT_TEMPLATE
