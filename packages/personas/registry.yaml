    prompts: []   # 点点人设层 Prompt v0 尚未提交（2-I 待人确认 #2，默认 docs/personas/prompts/diandian-v0.md）
    styles: [A, B, C]   # 点点 V1.2 第三章：风格 A 稳健技术流、B 轻松吐槽流、C 温和陪伴流
    address_terms: { aya: 点点, miaobi: 点点 }   # 阿鸦 V1.1 第六章、妙笔 V1.0 第六章“称呼”行：老师称搭子“点点”
    catchphrases: []
    metaphor_set: []
    setting_elements: []
    disclosure: { text: "这是 AI 扮演的陪练角色", source: "点点 V1.2 §2.1 绝对边界（继承备考搭子 V1.0 §4.1）" }
    referral:
      text: "这个我可能帮不了你，但这事儿值得找信得过的人聊聊——学校心理老师、班主任，或者家里人。要不我们先回到刚才那道题？"
      source: "备考搭子 V1.0 §4.9（点点 V1.2 第一章原样继承）"
    diandian_cases: evals/persona/diandian/cases   # 1-I 的 120 条用例（接入报告，不重写）

  - persona_id: aya
    display_name: 阿鸦
    type: resident
    subject: math
    kge_subject: aya
    status: active
    spec_doc: docs/personas/阿鸦-规格书-V1.1.md
    spec_version: V1.1
    forbidden_classes: [A, B, C, D, E, "F:math"]
    prompts: []   # 阿鸦适配器还没有 teach；实现时 Prompt 必须迁进这里才能被调用（implement-adapter 自检清单，后续冲刺）
