# 人设 Prompt 登记表（冲刺 3-F，specs/persona-governance-sprint3/spec.md 设计要点 1）。
#
# 每个角色一条记录；非人设的模型 Prompt（判分、编纂）登记在 tasks 里（type: task，只做版本与指纹锁，不跑人设家族级回归，spec 范围第 11 条）。
# 仓库里还没有任何老师或点点的真实人设 Prompt：personas[*].prompts 目前都是空的，各科实现 teach 时把 Prompt 迁进来并补录音。
# 除 prompts 外，其余字段都是从规格书摘录的判定依据（称谓、比喻与设定元素、转介话术、出场时刻、固定句），逐项注明出处；
# 这些摘录属于人设变更的判定依据，随禁语种子词表同一个 [NEEDS-HUMAN] PR 请人设负责人与教研确认（reviewed 为 false）。
# 改动本文件、prompts.lock、forbidden/、docs/personas/ 或 evals/persona/ 的 PR，报告里标“人设变更”。
version: 0.1.0
reviewed: false
lexicon: packages/personas/forbidden/manifest.yaml
lock: packages/personas/prompts.lock
eval:
  cases_dir: evals/persona/cases
  recordings_dir: evals/persona/recordings
  contract_matrix: evals/persona/contract-matrix.yaml
# 未登记 Prompt 的启发式扫描范围（spec 设计要点 1 第 4 条）；legacy/ 不在 CI 范围内
scan:
  dirs: [adapters, services, packages, apps]
  exclude_dirs: [node_modules, .venv, .venv-contracts, .next, dist, build, coverage, __pycache__, .git, .cache]
# 类型标签：KGE-03 页面人设中立检查把它当角色名（考官型基线一级标题「考官型老师」）
type_labels:
  examiner: 考官型老师
# 学生可见、但不属于任何角色的平台文案（前端探针、诊断文案）适用的禁语类
surfaces:
  platform: { forbidden_classes: [A, B, C, D, E], note: "平台文案不是角色输出，只查 A–E（与前端现有文案单测口径一致）" }
subjects:
  math: { name: 数学, aliases: [数学] }
  chinese: { name: 语文, aliases: [语文] }
  english: { name: 英语, aliases: [英语] }
  physics: { name: 物理, aliases: [物理] }
  chemistry: { name: 化学, aliases: [化学] }
  daofa: { name: 道法, aliases: [道法, 道德与法治] }
  history: { name: 历史, aliases: [历史] }

personas:
  - persona_id: diandian
