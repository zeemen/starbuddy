openapi: 3.1.0
info:
  title: StarBuddy 学习服务内部 API（BFF → 学习服务）
  version: 1.0.0
  summary: 冲刺 1-C 写入接口。只供 BFF 调用，学生与家长不能直接访问。
  description: |
    状态：**v1 候选版，待评审签字**（`specs/plugin-api-v1.0/spec.md`；评审清单 N17、N18）。v0 保留到迁移期结束。

    相对 v0：请求体改为信封（插件 API v1.0 的 `GradeRequest` / `DiagnoseRequest` 加平台侧的 `IngestContext`）；
    新增只查询、不执行的重放接口（N17）；写明 5xx 一律是结果未知（N18）；摘要带证据等级与是否写入学习者模型。

    请求体是信封 `{ request, ingest }`：`request` 是学科插件 API v1.0 的 `GradeRequest` / `DiagnoseRequest`
    （`plugin-api.v1.0.yaml`），原样转发给适配器；`ingest` 是平台侧的作答上下文（输入通道、用途），只由学习服务使用，
    不转发给适配器（ADR 15；specs/evidence-attributes-sprint1）。
    BFF 在调用前已完成鉴权、家长授权、选科（subject_enrollment）与同意（consent）检查，以及计量预留
    （ADR 01 第 4 条、ADR 06）。学习服务不重复检查这些。学习服务调用对应学科的适配器，
    按平台规则核对结果，在一个事务里幂等地写入学习者模型，然后返回**平台摘要**，不原样转发适配器响应。

    ## 幂等
    - 同一个 `request.context.idempotency_key` 与同一请求体（含 `ingest`，不含 `request_id`）重试：返回同一摘要，
      响应头 `idempotent-replayed: true`，不再调用适配器、不写任何行。
    - 同一个 key 配不同请求体：409 `IDEMPOTENCY_CONFLICT`。
    - 并发到达的同 key 请求只执行一次，其余等它完成后拿到同一结果。

    ## 计量
    学习服务不预留、不结算（ADR 06）。BFF 按本接口的结果结算：
    - 200：结算。
    - 4xx 且 `retryable: false`：结果确定没有写入，回滚。
    - **5xx 一律是结果未知**，不论 `retryable` 取值（评审 N18）；`retryable: true` 的 4xx（`BUSY` 等）与 BFF 自己超时同样是结果未知。
      原来那次执行可能随后成功落库。BFF 不能直接回滚，必须用**同一个** `idempotency_key` 重试，按重试的结果结算或回滚
      （安全审查 S7；ADR 06）。
    - 计量预留过期后，BFF 先用重放接口（`GET /internal/v1/replay/{method}/{idempotency_key}`）查结果，只查不执行：
      已写入就拿回摘要且不扣费；没有记录或失败过，重放接口**同时封存这个 key**，之后以它到达的原请求一律返回
      409 `IDEMPOTENCY_KEY_SEALED`、不执行，BFF 再换新 key 重新预留。这样晚到的原请求不会在没有预留的情况下执行，
      同一次作答也不会写两遍（评审 N17；安全审查、契约审查必须改）。
  license:
    name: 内部，未授权对外
    identifier: LicenseRef-StarBuddy-Internal
servers:
  - url: http://127.0.0.1:8788
    description: 学习服务只监听本机，由平台侧网关转发。
security:
  - bffServiceToken: []

paths:
  /internal/v1/grade:
    post:
      operationId: ingestGrade
      summary: 判分并写入学习者模型
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeIngest' }
            examples:
              keypad: { $ref: '#/components/examples/GradeIngestKeypad' }
      responses:
        '200':
          description: 已写入（或重放已写入的结果）
          headers:
            idempotent-replayed: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeSummary' }
              examples:
                levelC: { $ref: '#/components/examples/GradeSummaryLevelC' }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/diagnose:
    post:
      operationId: ingestDiagnose
      summary: 诊断并写入学习者模型（冲刺 1 只支持带 attempts 的同步诊断）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnoseIngest' }
            examples:
              canvasC: { $ref: '#/components/examples/DiagnoseIngestCanvasC' }
      responses:
        '200':
          description: 已写入（或重放已写入的结果）
          headers:
            idempotent-replayed: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnoseSummary' }
              examples:
                levelC: { $ref: '#/components/examples/DiagnoseSummaryLevelC' }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/replay/{method}/{idempotency_key}:
    get:
      operationId: replayResult
      summary: 只查询、不执行：按方法与幂等键返回已有结果（评审 N17）
      description: |
        不调用适配器，不写任何行。已成功写入 → 200 与原摘要（响应头 `idempotent-replayed: true`）；
        没有记录，或之前的执行确定失败 → 404 `REPLAY_NOT_FOUND`，并封存这个 key（见“计量”）；
        同 key 的执行仍在进行 → 409 `BUSY`（结果未知，稍后再查）。
        必须带 `student_ref` 与 `usage_id`：与原请求不一致时和“没有记录”同样返回 404，不透露 key 是否存在，也不封存别人的 key。
        只供 BFF 以服务令牌调用，**禁止**经网关对客户端开放。
      parameters:
        - { name: method, in: path, required: true, schema: { type: string, enum: [grade, diagnose] } }
        - name: idempotency_key
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        - { name: student_ref, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: usage_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 已写入的结果
          headers:
            idempotent-replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GradeSummary'
                  - $ref: '#/components/schemas/DiagnoseSummary'
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/model/route:
    post:
      operationId: routeModelCall
      summary: 各科适配器调用模型的唯一入口（平台模型路由；specs/adapter-zhixing-sprint2 设计要点 5）
      description: |
        适配器不持有任何模型供应商的地址或 Key（ADR 04 第 1 条），由这里交给平台模型路由：调用方声明任务类型与数据级别，
        路由按配置选主备、超时重试与熔断；生产与试点环境不出境。令牌按学科发放并绑定学科，`subject` 必须与令牌一致（否则 403）。
        响应里的 `output` 是模型原文，只回给调用它的适配器；学习服务的日志不记 `messages` 与 `output`。
        调用方负责把 `usage_id`、`idempotency_key` 与计量预留对应上；本接口不预留、不结算，也不按幂等键去重（lessons）。
      security:
        - routeClientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelRouteRequest' }
            examples:
              zhixingGrade: { $ref: '#/components/examples/ModelRouteRequestZhixing' }
      responses:
        '200':
          description: 模型输出与可追溯的版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouteResponse' }
              examples:
                zhixingGrade: { $ref: '#/components/examples/ModelRouteResponseZhixing' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bffServiceToken:
      type: http
      scheme: bearer
      description: BFF 到学习服务的服务间令牌。
    routeClientToken:
      type: http
      scheme: bearer
      description: 各科适配器到学习服务模型路由接口的令牌（LEARNING_ROUTE_CLIENT_<SUBJECT>_TOKEN），按学科发放、绑定学科，与服务间令牌不同。

  responses:
    Problem:
      description: 统一错误体
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  examples:
    ModelRouteRequestZhixing:
      summary: 知行适配器的逐点判分调用（合成作答）
      value:
        task: T2
        data_class: L2
        subject: zhixing
        prompt_template: zhixing-m3-grade
        prompt_version: 0.2.0
        messages:
          - { role: system, content: （合成）判分说明与采分点 }
          - { role: user, content: （合成）居民参与民主决策，体现了居民自治。 }
        usage_id: 00000000-0000-4000-8000-00000000b010
        idempotency_key: 00000000-0000-4000-8000-00000000c010
        deadline_ms: 9000
    ModelRouteResponseZhixing:
      summary: 模型输出（调用方按自己的 schema 校验）与可追溯的版本
      value:
        output: '{"points": []}'
        model_version: model:fake-a/fake-reasoner@2026-09-01
        source_version: prompt:zhixing-m3-grade@0.2.0
        model_mismatch: false
    GradeIngestKeypad:
      summary: 键盘作答、练习用途：证据记 A 级、独立作答
      value:
        request:
          context:
            request_id: 00000000-0000-4000-8000-000000000401
            contract_version: 1.0.0
            subject: aya
            student_ref: 00000000-0000-4000-8000-00000000a002
            data_class: L2
            usage_id: 00000000-0000-4000-8000-00000000b004
            idempotency_key: 00000000-0000-4000-8000-00000000c401
            content_version:
              region: nanjing
              exam_year: 2027
              grade: 9
              textbook_version: bubian-2024
              subject: aya
              content_version: 0.1.0
          attempt:
            attempt_id: 00000000-0000-4000-8000-0000000000a1
            item_ref: 'aya:synthetic-0301-07'
            occurred_at: '2026-10-08T19:30:00+08:00'
            response: { text: '2(x-1)' }
            elapsed_sec: 95
            hint_level_used: 0
          rubric_version: aya-symbolic-ts@0.1.0
        ingest: { channel: keypad, purpose: practice }
    GradeSummaryLevelC:
      summary: 申诉中的作答：记 C 级，批改照常返回，不写入学习者模型
      value:
        method: grade
        subject: aya
        attempt_ids: [00000000-0000-4000-8000-0000000000a1]
        evidence_ids: [00000000-0000-4000-8000-00000000e401, 00000000-0000-4000-8000-00000000e402]
        semantics: practice
        human_review_required: true
        error_categories: []
        evidence_level: C
        learner_model_updated: false
        grade_result_id: 00000000-0000-4000-8000-00000000f401
        verdict: incorrect

    DiagnoseIngestCanvasC:
      summary: 画布作答未经回显确认：记 C 级，诊断照常返回，不写入学习者模型
      value:
        request:
          context:
            request_id: 00000000-0000-4000-8000-000000000402
            contract_version: 1.0.0
            subject: aya
            student_ref: 00000000-0000-4000-8000-00000000a002
            data_class: L2
            usage_id: 00000000-0000-4000-8000-00000000b005
            idempotency_key: 00000000-0000-4000-8000-00000000c402
          mode: intake
          attempts:
            - attempt_id: 00000000-0000-4000-8000-0000000000a2
              item_ref: 'aya:synthetic-0301-07'
              occurred_at: '2026-10-08T19:30:00+08:00'
              response: { text: '2(x-1)' }
              hint_level_used: 0
        ingest: { channel: canvas, evidence_level: C }
    DiagnoseSummaryLevelC:
      summary: C 级诊断：观察数为 0
      value:
        method: diagnose
        subject: aya
        attempt_ids: [00000000-0000-4000-8000-0000000000a2]
        evidence_ids: [00000000-0000-4000-8000-00000000e403]
        semantics: practice
        human_review_required: true
        error_categories: []
        evidence_level: C
        learner_model_updated: false
        observation_count: 0

  schemas:
    Uuid: { type: string, format: uuid }
    IngestContext:
      type: object
      description: |
        平台侧的作答上下文（specs/evidence-attributes-sprint1），学习服务据此补齐证据的作答情境、证据等级、输入通道：
        - `evidence_kind`：用过提示（`hint_level_used > 0`，或适配器证据里有 `hint_opened` 信号）→ `hinted`；
          作答没报 `hint_level_used` → 空（交给掌握计算按保守口径）；否则 `purpose = retest` → `delayed_retest`，
          `transfer_check` → `transfer`，其余 `independent`；
        - `evidence_level`：grade 取 `request.evidence_level`，diagnose 取本对象的 `evidence_level`（插件诊断请求没有这个字段）；都没给时
          `channel = keypad` 记 A，其余通道必须给出（否则 400）；拍照最高 B；画布、语音记 A 必须带
          `request.answer_evidence_ref`（确认记录在平台侧，否则 400）；`request.appeal = true` 一律记 C（ADR 15“申诉中”）；
        - C 级证据照常写入证据、作答与判分结果（批改要展示），但不写能力观察与错因（不进入学习者模型），
          摘要里 `error_categories` 为空、`observation_count` 为 0（没有落库的结论不出现在摘要里，规则 11），
          也不能作为之后请求的 `prior_evidence`（422）；键盘通道的结果里出现识别转写证据 → 502。
      required: [channel]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [keypad, canvas, voice, photo], description: 输入通道（ADR 15）。 }
        purpose:
          type: string
          enum: [practice, retest, transfer_check]
          default: practice
          description: 这次作答的用途，由编排层（复测调度、迁移检验）给出；客户端不能直接指定。
        evidence_level: { type: string, enum: [A, B, C] }
    GradeIngest:
      type: object
      required: [request, ingest]
      additionalProperties: false
      properties:
        request: { $ref: './plugin-api.v1.0.yaml#/components/schemas/GradeRequest' }
        ingest:
          description: grade 的证据等级只写在 `request.evidence_level`，不能在 ingest 里再给一次（同一事实只有一处，契约审查建议 7）。
          allOf:
            - $ref: '#/components/schemas/IngestContext'
            - not: { required: [evidence_level] }
    DiagnoseIngest:
      type: object
      required: [request, ingest]
      additionalProperties: false
      properties:
        request: { $ref: './plugin-api.v1.0.yaml#/components/schemas/DiagnoseRequest' }
        ingest: { $ref: '#/components/schemas/IngestContext' }
    SummaryBase:
      type: object
      description: 平台摘要：只有 ID 与编码，不含作答、答案、维度分（spec 待人确认 #6）。
      required: [method, subject, attempt_ids, evidence_ids, semantics, human_review_required, error_categories]
      properties:
        method: { type: string, enum: [grade, diagnose] }
        subject: { type: string, enum: [wenli, aya, zhixing, echo] }
        attempt_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } }
        evidence_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } }
        semantics:
          type: string
          enum: [formal, practice]
          description: 平台判定的效力（按平台登记的准入状态，只会比适配器声明的更严）。
        human_review_required: { type: boolean }
        error_categories:
          type: array
          description: 本次错因的跨科大类（去重）。
          items:
            type: string
            enum: [reading_the_question, locating_information, thinking_method, computation_or_grammar,
                   expression_convention, strategy_and_time, knowledge]
        evidence_level:
          type: string
          enum: [A, B, C]
          description: 本次证据的等级（平台补齐）。经 `/internal/v1` 写入的结果必带；重放 `/internal/v0` 写入的结果时没有这个字段与下一个字段。
        learner_model_updated:
          type: boolean
          description: 是否写入了能力观察与错因。C 级证据为 false：只展示批改，不进入学习者模型（ADR 15）。
    GradeSummary:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SummaryBase'
        - required: [grade_result_id, verdict]
          properties:
            method: { const: grade }
            grade_result_id: { $ref: '#/components/schemas/Uuid' }
            verdict: { type: string, enum: [correct, incorrect, partial, needs_review, not_applicable] }
    DiagnoseSummary:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SummaryBase'
        - required: [observation_count]
          properties:
            method: { const: diagnose }
            observation_count: { type: integer, minimum: 0 }
    ModelRouteRequest:
      type: object
      additionalProperties: false
      required: [task, data_class, subject, prompt_template, prompt_version, messages, usage_id, idempotency_key]
      properties:
        task: { type: string, enum: [T1, T2, T3, T4, T5, T6, T7, T8, T9], description: 九类任务（ADR 04 增补）；骨架只支持对话类 T1–T4、T8、T9 }
        data_class: { type: string, enum: [L0, L1, L2, L3], description: 数据级别（ADR 09）；学生作答原文是 L2 }
        subject: { type: string, enum: [wenli, aya, zhixing, echo] }
        prompt_template: { type: string, pattern: '^[a-z0-9][a-z0-9\-]{0,47}$' }
        prompt_version: { type: string, pattern: '^v?\d+(\.\d+){0,3}$' }
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string, maxLength: 20000 }
        usage_id: { type: string, format: uuid }
        idempotency_key: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        deadline_ms: { type: integer, minimum: 1, maximum: 60000 }
    ModelRouteResponse:
      type: object
      additionalProperties: false
      required: [output, model_version, source_version, model_mismatch]
      properties:
        output: { type: string, description: 模型原文；调用方必须按自己的 schema 校验，判分只能来自验证器或 Rubric（规则 3） }
        model_version: { type: string, pattern: '^model:[a-z0-9\-]+/[A-Za-z0-9._\-]+@[A-Za-z0-9._\-]+$' }
        source_version: { type: string, pattern: '^prompt:[a-z0-9][a-z0-9\-]{0,47}@[A-Za-z0-9][A-Za-z0-9._\-]{0,31}$' }
        model_mismatch: { type: boolean, description: 供应商报告的模型名与配置的快照名不一致；判分类调用方应转人工复核 }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      additionalProperties: false
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, maxLength: 120, description: 不得包含学生原文。 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          maxLength: 500
          description: 面向开发者的编码化说明。不得包含学生作答、答案或数据库报错原文。
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - SUBJECT_NOT_SUPPORTED
            - STUDENT_NOT_FOUND
            - CONTENT_NOT_REGISTERED
            - IDEMPOTENCY_CONFLICT
            - BUSY  # 同 key 的另一请求仍在执行；响应头 retry-after
            - ATTEMPT_ID_CONFLICT  # BFF 带来的 attempt_id 已被另一请求用过
            - UPSTREAM_REJECTED
            - UPSTREAM_UNAVAILABLE
            - UPSTREAM_TIMEOUT
            - ASYNC_NOT_SUPPORTED
            - ADAPTER_RESULT_REJECTED
            - REPLAY_NOT_FOUND  # 重放接口：没有记录或之前确定失败，同时封存该 key（评审 N17）
            - IDEMPOTENCY_KEY_SEALED  # 该 key 已被重放接口封存，原请求不再执行
            - SUBJECT_MISMATCH  # 模型路由接口：请求的学科与路由客户端令牌绑定的学科不一致
            - ROUTE_REJECTED  # 模型路由接口：任务、数据级别或计量字段不合要求（不重试）
            - ROUTE_UNAVAILABLE  # 模型路由接口：没有数据级别允许的可用供应商（可稍后重试）
            - INTERNAL
        upstream_code:
          type: string
          description: 适配器返回的 Problem.code（UPSTREAM_REJECTED 时），例如 ITEM_NOT_FOUND。
          pattern: '^[A-Z][A-Z0-9_]{0,47}$'
        retryable:
          type: boolean
          description: 为真时 BFF 可用同一个 idempotency_key 重试。只对 4xx 有意义：5xx 一律是结果未知（评审 N18）。
        request_id: { $ref: '#/components/schemas/Uuid' }
