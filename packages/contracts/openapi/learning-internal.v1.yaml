openapi: 3.1.0
info:
  title: StarBuddy 学习服务内部 API（BFF → 学习服务）
  version: 1.1.0
  summary: 冲刺 1-C 写入接口；1.1.0 加掌握读取与验证任务（KGE-04 第二步）。只供平台内部服务调用，学生与家长不能直接访问。
  description: |
    状态：**v1 候选版，待评审签字**（`specs/plugin-api-v1.0/spec.md`；评审清单 N17、N18）。v0 保留到迁移期结束。

    相对 v0：请求体改为信封（插件 API v1.0 的 `GradeRequest` / `DiagnoseRequest` 加平台侧的 `IngestContext`）；
    新增只查询、不执行的重放接口（N17）；写明 5xx 一律是结果未知（N18）；摘要带证据等级与是否写入学习者模型。
    冲刺 4-H 另加非消耗类的今日计划 `POST /internal/v1/plan`（specs/unified-shell-sprint4/spec.md 第 6 节；契约变更，待签字）。

    ## 1.1.0（KGE-04 第二步 PR 3，specs/kge-04-mastery-step2/spec.md 第 3 节；契约变更，待签字）
    非破坏性：只新增四个接口、两个令牌方案与 Problem 的三个错误码，已有接口与 schema 不变。
    - `POST /internal/v1/mastery/get`、`POST /internal/v1/mastery/explain`：请求与响应**直接引用** `knowledge-service.v0.9.yaml` 的
      `MasteryGetRequest / MasteryGetResponse`、`MasteryExplainRequest / MasteryExplainResponse`（形状逐字照搬，信封五字段齐全，
      `contract_version` 仍是知识服务形状的 0.9.0）。知识服务的 `/v0/mastery.*` 继续回 501（第二步待人确认 #2）。
      只给编排层（编排层专用令牌 `orchestratorServiceToken`；BFF 服务令牌与洞察服务令牌一律 401；`context.caller` 必须与令牌身份一致，
      即 `orchestrator`，否则 403 `CALLER_MISMATCH`）。结果是推断：
      对学生、家长的任何陈述仍须经洞察服务的判断（规则 11），本接口不对前端开放。
    - `POST /internal/v1/verification`：SIE-03“我其实会”建平台内验证任务（`retest_task.reason = verify_self_report`），
      只建任务、不改掌握；同一异议重复调用返回同一条任务。只接受洞察服务令牌（`insightServiceToken`），BFF 令牌一律 401。
      返回任务 ID 与 `item.similar` 选题入口所需的节点与层次，**不返回题目内容**（第二步待人确认 #3）。
    - `POST /internal/v1/verification/cancel`：洞察服务写异议的事务在建任务之后回滚时的补偿，按任务 ID + 学生撤销 open 的自述验证任务；
      幂等、不改掌握；只接受洞察服务令牌。
    - （KGE-04 第二步 PR 4，仍在未发布的 1.1.0 草稿内追加，非破坏性）`POST /internal/v1/profile-page/ensure` 与
      `POST /internal/v1/profile-page/read`：学情档案页的惰性编译与 Agent 版读取（第一步 spec 第 14 节）。ensure 接受编排层令牌
      （`trigger = session_start`）或洞察服务令牌（`trigger = weekly`，周报生成前），令牌与触发点不符 403 `CALLER_MISMATCH`；
      read 只接受编排层令牌。新增 Problem 码 `PROFILE_UNAVAILABLE`。不调模型；BFF 令牌一律 401。
    - （冲刺 4-H H5 星图 v1 PR 1，specs/star-map-v1-h5/spec.md 第 2 节；仍在未发布的 1.1.0 草稿内追加，非破坏性）
      `POST /internal/v1/star-map/nodes`：当前已发布地图里每颗星（知识节点）的星态，只认 BFF 服务令牌（`bffServiceToken`；
      编排层、洞察服务令牌一律 401）。只有 `node_id`、`state`、`star_lit`、`basis_id`，**不含** `p_mastery`、`confidence`、证据 ID
      与各层次明细（schema 用 `additionalProperties: false` 保证）。地图未发布为 200 `status = no_map`；`MASTERY_UNAVAILABLE` 的用途扩大到本接口。

    请求体是信封 `{ request, ingest }`：`request` 是学科插件 API v1.0 的 `GradeRequest` / `DiagnoseRequest`
    （`plugin-api.v1.0.yaml`），原样转发给适配器；`ingest` 是平台侧的作答上下文（输入通道、用途），只由学习服务使用，
    不转发给适配器（ADR 15；specs/evidence-attributes-sprint1）。
    BFF 在调用前已完成鉴权、家长授权、选科（subject_enrollment）与同意（consent）检查，以及计量预留
    （ADR 01 第 4 条、ADR 06）。学习服务不重复检查这些。学习服务调用对应学科的适配器，
    按平台规则核对结果，在一个事务里幂等地写入学习者模型，然后返回**平台摘要**，不原样转发适配器响应。

    ## 幂等
    - 同一个 `request.context.idempotency_key` 与同一请求体（含 `ingest`，不含 `request_id`）重试：返回同一摘要，
      响应头 `idempotent-replayed: true`，不再调用适配器、不写任何行。
    - 同一个 key 配不同请求体：409 `IDEMPOTENCY_CONFLICT`。
    - 并发到达的同 key 请求只执行一次，其余等它完成后拿到同一结果。

    ## 计量
    学习服务不预留、不结算（ADR 06）。BFF 按本接口的结果结算：
    - 200：结算。
    - 4xx 且 `retryable: false`：结果确定没有写入，回滚。
    - **5xx 一律是结果未知**，不论 `retryable` 取值（评审 N18）；`retryable: true` 的 4xx（`BUSY` 等）与 BFF 自己超时同样是结果未知。
      原来那次执行可能随后成功落库。BFF 不能直接回滚，必须用**同一个** `idempotency_key` 重试，按重试的结果结算或回滚
      （安全审查 S7；ADR 06）。
    - 计量预留过期后，BFF 先用重放接口（`GET /internal/v1/replay/{method}/{idempotency_key}`）查结果，只查不执行：
      已写入就拿回摘要且不扣费；没有记录或失败过，重放接口**同时封存这个 key**，之后以它到达的原请求一律返回
      409 `IDEMPOTENCY_KEY_SEALED`、不执行，BFF 再换新 key 重新预留。这样晚到的原请求不会在没有预留的情况下执行，
      同一次作答也不会写两遍（评审 N17；安全审查、契约审查必须改）。
  license:
    name: 内部，未授权对外
    identifier: LicenseRef-StarBuddy-Internal
servers:
  - url: http://127.0.0.1:8788
    description: 学习服务只监听本机，由平台侧网关转发。
security:
  - bffServiceToken: []

paths:
  /internal/v1/grade:
    post:
      operationId: ingestGrade
      summary: 判分并写入学习者模型
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeIngest' }
            examples:
              keypad: { $ref: '#/components/examples/GradeIngestKeypad' }
      responses:
        '200':
          description: 已写入（或重放已写入的结果）
          headers:
            idempotent-replayed: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeSummary' }
              examples:
                levelC: { $ref: '#/components/examples/GradeSummaryLevelC' }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/diagnose:
    post:
      operationId: ingestDiagnose
      summary: 诊断并写入学习者模型（冲刺 1 只支持带 attempts 的同步诊断）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnoseIngest' }
            examples:
              canvasC: { $ref: '#/components/examples/DiagnoseIngestCanvasC' }
      responses:
        '200':
          description: 已写入（或重放已写入的结果）
          headers:
            idempotent-replayed: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnoseSummary' }
              examples:
                levelC: { $ref: '#/components/examples/DiagnoseSummaryLevelC' }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/replay/{method}/{idempotency_key}:
    get:
      operationId: replayResult
      summary: 只查询、不执行：按方法与幂等键返回已有结果（评审 N17）
      description: |
        不调用适配器，不写任何行。已成功写入 → 200 与原摘要（响应头 `idempotent-replayed: true`）；
        没有记录，或之前的执行确定失败 → 404 `REPLAY_NOT_FOUND`，并封存这个 key（见“计量”）；
        同 key 的执行仍在进行 → 409 `BUSY`（结果未知，稍后再查）。
        必须带 `student_ref` 与 `usage_id`：与原请求不一致时和“没有记录”同样返回 404，不透露 key 是否存在，也不封存别人的 key。
        只供 BFF 以服务令牌调用，**禁止**经网关对客户端开放。
      parameters:
        - { name: method, in: path, required: true, schema: { type: string, enum: [grade, diagnose] } }
        - name: idempotency_key
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        - { name: student_ref, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: usage_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 已写入的结果
          headers:
            idempotent-replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GradeSummary'
                  - $ref: '#/components/schemas/DiagnoseSummary'
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/plan:
    post:
      operationId: planToday
      summary: 今日计划（按科并列；冲刺 4-H 统一壳，specs/unified-shell-sprint4/spec.md 第 6 节）
      description: |
        **契约变更，待评审签字（必停项）。** 非消耗类：不计量、不写任何表、计划不落库，每次现算。

        BFF 已按会话与档案授权确定学生，并从已选科目里给出要排的学科（`subjects`）。学习服务对每一科：
        读该生当前的掌握快照（平台掌握状态，规则 2；`next_retest_at` 按 KGE-04 的复测调度），组装插件 API v1.0 的
        `PlanRequest` 调该科适配器的 `/plan`，按契约校验结果，再把能力点（`skill_nodes`）经已发布地图版本的
        `kge.skill_link` 换算成知识节点 ID（BFF 读不到 `skill_link`）。

        响应只含学科、任务类型、目标知识节点、优先级、预计分钟与 `rationale_code`；**不含** `p_mastery`、`confidence`、
        `evidence_ids`、`learner_context` 的任何条目（schema 用 `additionalProperties: false` 保证）。推荐理由的文字由平台按判断生成
        （规则 11），不在本接口。

        某一科没有配置适配器、适配器 501、超时、结果不合契约（含 `estimated_minutes` 超过 600，不截断）时，这一科
        `status = unavailable` 且 `tasks` 为空，不影响其他科；整个请求仍是 200。
        `plan` 只按插件 API v1.0 候选版实现：候选版开关关闭（签字前，学习服务进程没有 `STARBUDDY_ALLOW_CANDIDATE_CONTRACT=1`）时，
        不调任何适配器，返回 200 且每一科都是 `unavailable`（不是 4xx / 5xx）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanQuery' }
            examples:
              today: { $ref: '#/components/examples/PlanQueryToday' }
      responses:
        '200':
          description: 各科的候选任务（按优先级从高到低）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanDigest' }
              examples:
                today: { $ref: '#/components/examples/PlanDigestToday' }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/model/route:
    post:
      operationId: routeModelCall
      summary: 各科适配器调用模型的唯一入口（平台模型路由；specs/adapter-zhixing-sprint2 设计要点 5）
      description: |
        适配器不持有任何模型供应商的地址或 Key（ADR 04 第 1 条），由这里交给平台模型路由：调用方声明任务类型与数据级别，
        路由按配置选主备、超时重试与熔断；生产与试点环境不出境。令牌按学科发放并绑定学科，`subject` 必须与令牌一致（否则 403）。
        响应里的 `output` 是模型原文，只回给调用它的适配器；学习服务的日志不记 `messages` 与 `output`。
        调用方负责把 `usage_id`、`idempotency_key` 与计量预留对应上；本接口不预留、不结算，也不按幂等键去重（lessons）。
      security:
        - routeClientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelRouteRequest' }
            examples:
              zhixingGrade: { $ref: '#/components/examples/ModelRouteRequestZhixing' }
      responses:
        '200':
          description: 模型输出与可追溯的版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouteResponse' }
              examples:
                zhixingGrade: { $ref: '#/components/examples/ModelRouteResponseZhixing' }
        default: { $ref: '#/components/responses/Problem' }

  /internal/v1/mastery/get:
    post:
      operationId: masteryGet
      summary: 节点 × 层次的掌握状态（形状照搬 knowledge-service v0.9 的 mastery.get；1.1.0）
      description: |
        **契约变更，待签字（必停项）。** 只读，不计量、不写任何表。只接受编排层令牌（`orchestratorServiceToken`），`context.caller`
        必须是 `orchestrator`。读 `platform.mastery_estimate` 的节点键当前记录，
        只认当前已发布地图里有效的节点与层次（改名、合并、拆分、撤下的旧单元不出现）。每个请求节点按其在当前地图里的
        全部认知层次各回一行：没有记录的层次 `gate = unseen`、不带 `p_mastery` 与 `next_review_at`；不在任何当前地图里的节点不回。
        `star_lit` 是节点的星亮，按该科掌握配置的 `star_level_rule` 计算（星亮层次的门槛到“迁移”及以上），同一节点各行取值相同；
        没有可用配置的学科一律 false。
        信封：`evidence_ids` = 各行引用证据的并集；`confidence` = 各行置信度的最小值（没有记录时为 0）；
        `source_version` 带算法版本与地图版本段；`model_version` 为 `algo:kge-mastery@<算法版本>`；`human_review_required = false`。
        不存在的学生与没有记录的学生回同样的结果（全部 unseen），不暴露存在性。
      security:
        - orchestratorServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/MasteryGetRequest' }
            examples:
              basic: { $ref: '#/components/examples/MasteryGetRequestOrchestrator' }
      responses:
        '200':
          description: 掌握状态、门槛与下次复测时间
          content:
            application/json:
              schema: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/MasteryGetResponse' }
              examples:
                basic: { $ref: '#/components/examples/MasteryGetResponseExecute' }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/mastery/explain:
    post:
      operationId: masteryExplain
      summary: 某节点掌握状态的证据链（形状照搬 knowledge-service v0.9 的 mastery.explain；1.1.0）
      description: |
        **契约变更，待签字（必停项）。** 只读。证据链 = 该节点各层次当前记录引用的证据（按服务器记录时间排序，去重），每条带
        `evidence_kind`（作答情境）、`evidence_level`（生效等级：旧证据与未准入内容上的证据按 B）、`weight`（这条证据对掌握的更新强度，
        ∈ [0, 1]；按读取时的配置与证据重放得出，当前已不计入的记 0）、`hint_level`（提示等级，契约上限 5，平台阶梯 6 级记 5）。
        门槛条件的编码与数值只在服务内（第一步 #17），不经本接口外露。
        信封同 `mastery/get`；节点没有记录时 `chain` 为空、`confidence` 为 0。只接受编排层令牌。
      security:
        - orchestratorServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/MasteryExplainRequest' }
            examples:
              basic: { $ref: '#/components/examples/MasteryExplainRequestOrchestrator' }
      responses:
        '200':
          description: 证据链
          content:
            application/json:
              schema: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/MasteryExplainResponse' }
              examples:
                basic: { $ref: '#/components/examples/MasteryExplainResponseExecute' }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/verification:
    post:
      operationId: scheduleVerification
      summary: “我其实会”的平台内验证任务（SIE-03 → KGE-04；1.1.0）
      description: |
        **契约变更，待签字（必停项）。** 建一条 `platform.retest_task`（`reason = verify_self_report`），不改掌握记录
        （只有之后做题产生的证据会改）。幂等：同一 `dispute_ref` 与单元重复调用返回同一条任务；该单元已有开着的自述验证任务时返回那一条
        （每单元每种原因最多一条 open）。
        **学生由谁定**：学习服务没有读 `insight.dispute` 的权限（迁移 0032 未授），不能由异议记录反查学生；
        改为只接受洞察服务令牌（`insightServiceToken`，与 BFF 服务令牌不同、不能互换），`student_ref` 由洞察服务从异议记录
        （`insight.dispute.student_id`）取出后附带——BFF 与客户端没有途径指定学生（第二步 lessons PR 3 待人确认）。
        `item_count` 是 `item.similar` 要选的验证题道数（不落库，原样回显）；题目由编排层经知识服务选，本接口不返回题目内容。
        学科没有可用掌握配置、单元不在当前已发布地图里：409 `MASTERY_UNAVAILABLE`（不重试）。
      security:
        - insightServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationRequest' }
            examples:
              iKnow: { $ref: '#/components/examples/VerificationRequestIKnow' }
      responses:
        '200':
          description: 验证任务（新建或已有的那一条）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationTask' }
              examples:
                created: { $ref: '#/components/examples/VerificationTaskCreated' }
        default: { $ref: '#/components/responses/Problem' }

  /internal/v1/verification/cancel:
    post:
      operationId: cancelVerification
      summary: 撤销一条自述验证任务（洞察服务事务回滚时的补偿；1.1.0）
      description: |
        **契约变更，待签字（必停项）。** 洞察服务在写异议的事务里调 `/internal/v1/verification` 建任务；该事务随后回滚时，任务会留在
        open、没有异议引用。洞察服务回滚后尽力调本接口撤销（失败只记计数，不影响异议的返回）。
        按 `task_id` + `student_ref` 撤销 `status = open` 且 `reason = verify_self_report` 的任务（置 cancelled），不改掌握记录。
        幂等：已撤销或已关闭的任务返回现状、`cancelled = false`。任务不存在、不属于该学生或不是自述验证任务：同一个 404 `TASK_NOT_FOUND`。
        只接受洞察服务令牌（`insightServiceToken`）。
      security:
        - insightServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCancelRequest' }
            examples:
              rollback: { $ref: '#/components/examples/VerificationCancelRequestRollback' }
      responses:
        '200':
          description: 撤销结果（本次撤销，或已有的现状）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCancelResult' }
              examples:
                cancelled: { $ref: '#/components/examples/VerificationCancelResultCancelled' }
        default: { $ref: '#/components/responses/Problem' }

  /internal/v1/profile-page/ensure:
    post:
      operationId: ensureProfilePage
      summary: 学情档案页的惰性编译（会话开始、周报；1.1.0 草稿内追加，KGE-04 第二步 PR 4）
      description: |
        **契约变更，待签字（必停项）。** 判断没变（`claims_digest` 与该生该科的全部候选判断一致）就不重编（`unchanged`）；变了就按判断模板渲染、
        加固定衔接短语、跑陈述—判断一致性检查，通过为 `compiled`，不通过降级为纯模板版本并记一条阻断记录（`blocked_fallback`）；
        没有候选判断也没有页时不写（`empty`）；超出时间预算或编译失败不写库、不报错（`template_only`：read 此时返回纯模板版本），不阻塞会话与周报。
        作答与掌握重算不触发编译。不调任何模型。
        鉴权：编排层令牌（`orchestratorServiceToken`）只能以 `trigger = session_start` 调用；洞察服务令牌（`insightServiceToken`）只能以
        `trigger = weekly` 调用；不符 403 `CALLER_MISMATCH`。学科没有档案页配置：409 `PROFILE_UNAVAILABLE`。
        响应没有判断、文字与学生 ID。不存在的学生与没有判断的学生同为 `empty`。
      security:
        - orchestratorServiceToken: []
        - insightServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePageEnsureRequest' }
            examples:
              session: { $ref: '#/components/examples/ProfilePageEnsureSessionStart' }
      responses:
        '200':
          description: 编译结果（只有编码、检查状态与时间）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilePageEnsureResult' }
              examples:
                compiled: { $ref: '#/components/examples/ProfilePageEnsureCompiled' }
        default: { $ref: '#/components/responses/Problem' }

  /internal/v1/profile-page/read:
    post:
      operationId: readProfilePage
      summary: 学情档案页 Agent 完整版（读取时按判断现状重核后渲染；1.1.0 草稿内追加，KGE-04 第二步 PR 4）
      description: |
        **契约变更，待签字（必停项）。** 只读，不编译、不写库。每次读取都按判断现状重核（Agent 可见、状态、模板键与版本、模板仍已审核）后
        按判断模板渲染：被推翻、撤回、过期、转待验证的陈述消失，消失了陈述的那一节不显示衔接语。页的摘要与现状不一致（判断变了还没重编）或没有页时，
        由现有判断直接渲染纯模板版本（`variant = template_only`，没有衔接语）。
        陈述只来自成立或假设的判断（规则 11），每条带 `claim_id`；待验证判断只作为待办引用（`todo`，没有文字）。
        结果是 Agent 版，只接受编排层令牌；学生与家长视图由 BFF 经 `platform.profile_page_statement_v` 读（不含待办）。
      security:
        - orchestratorServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePageReadRequest' }
            examples:
              basic: { $ref: '#/components/examples/ProfilePageReadBasic' }
      responses:
        '200':
          description: 档案页（六节）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilePage' }
              examples:
                compiled: { $ref: '#/components/examples/ProfilePageCompiled' }
        default: { $ref: '#/components/responses/Problem' }

  /internal/v1/star-map/nodes:
    post:
      operationId: starMapNodes
      summary: 星图 v1 的节点星态（BFF 读；1.1.0 草稿内追加，冲刺 4-H H5 PR 1）
      description: |
        **契约变更，待签字（必停项）。** 只读，不计量、不写任何表。只接受 BFF 服务令牌（`bffServiceToken`），编排层与洞察服务令牌一律 401；
        请求体 `caller` 必须是 `bff`（与令牌身份一致），否则 403 `CALLER_MISMATCH`。BFF 已按会话与档案授权确定学生（规则 5）。
        **星** = 该科当前已发布地图版本中**全部** `status = active`、`level = node` 的知识节点（统一壳 spec 待人确认 #9 默认；
        领域、主题、细目不成星，撤下的节点与旧版本节点不出现）。按 `node_id` 排序。
        其中只有 `kind` 参与掌握计算（`kp`、`ability_kp`、`viewpoint`）且带认知层次的节点有星态；其余节点（`material`、`method`、`pitfall`、
        `exam_point` 等，或没有认知层次）一律 `state = unseen`、`star_lit = false`、`basis_id = null`。每颗星：
        - `state`：决定星亮的那个认知层次上的门槛（platform.mastery_state）。层次按该科掌握配置的 `star_level_rule`：
          `star_level` 取配置给该节点的层次，未配置取节点最高层次（配置的层次不在节点层次里则没有决定层次，记 `unseen`）；
          `all_levels` 取门槛最低的层次（同级取低层次）。该层次没有当前记录为 `unseen`；
        - `star_lit`：与 `mastery/get` 的同名字段同一实现（星亮层次的门槛到“迁移”及以上），与 `state ∈ {transfer, retain}` 恒等；
        - `basis_id`：决定 `state` 的那条当前掌握记录（`platform.mastery_estimate.id`，`is_current`）；没有记录为 null。
          BFF 用它核对判断的 `basis_id`（统一壳 spec 7.2 节条件 3），不一致即画中性底星。
        **不返回** `p_mastery`、`confidence`、证据 ID、各层次明细与下次复测时间（关于学生的陈述须经判断，规则 11）。
        该科没有已发布地图：200、`status = no_map`、`map_version = null`、`nodes` 为空（BFF 显示“地图建设中”）。
        地图已发布但该科没有可用（已加载）的掌握配置：409 `MASTERY_UNAVAILABLE`（不重试；同验证任务的惯例）。
        不存在的学生与没有记录的学生回同样的结果（全部 unseen），不暴露存在性。
      security:
        - bffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StarMapNodesRequest' }
            examples:
              basic: { $ref: '#/components/examples/StarMapNodesRequestBff' }
      responses:
        '200':
          description: 节点星态（或“无地图”）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarMapNodes' }
              examples:
                ok: { $ref: '#/components/examples/StarMapNodesOk' }
                noMap: { $ref: '#/components/examples/StarMapNodesNoMap' }
        default: { $ref: '#/components/responses/Problem' }

