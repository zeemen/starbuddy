    IngestContext:
      type: object
      description: |
        平台侧的作答上下文（specs/evidence-attributes-sprint1），学习服务据此补齐证据的作答情境、证据等级、输入通道：
        - `evidence_kind`：用过提示（`hint_level_used > 0`，或适配器证据里有 `hint_opened` 信号）→ `hinted`；
          作答没报 `hint_level_used` → 空（交给掌握计算按保守口径）；否则 `purpose = retest` → `delayed_retest`，
          `transfer_check` → `transfer`，其余 `independent`；
        - `evidence_level`：grade 取 `request.evidence_level`，diagnose 取本对象的 `evidence_level`（插件诊断请求没有这个字段）；都没给时
          `channel = keypad` 记 A，其余通道必须给出（否则 400）；拍照最高 B；画布、语音记 A 必须带
          `request.answer_evidence_ref`（确认记录在平台侧，否则 400）；`request.appeal = true` 一律记 C（ADR 15“申诉中”）；
        - C 级证据照常写入证据、作答与判分结果（批改要展示），但不写能力观察与错因（不进入学习者模型），
          摘要里 `error_categories` 为空、`observation_count` 为 0（没有落库的结论不出现在摘要里，规则 11），
          也不能作为之后请求的 `prior_evidence`（422）；键盘通道的结果里出现识别转写证据 → 502。
      required: [channel]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [keypad, canvas, voice, photo], description: 输入通道（ADR 15）。 }
        purpose:
          type: string
          enum: [practice, retest, transfer_check]
          default: practice
          description: 这次作答的用途，由编排层（复测调度、迁移检验）给出；客户端不能直接指定。
        evidence_level: { type: string, enum: [A, B, C] }
    GradeIngest:
      type: object
      required: [request, ingest]
      additionalProperties: false
      properties:
        request: { $ref: './plugin-api.v1.0.yaml#/components/schemas/GradeRequest' }
        ingest:
          description: grade 的证据等级只写在 `request.evidence_level`，不能在 ingest 里再给一次（同一事实只有一处，契约审查建议 7）。
          allOf:
            - $ref: '#/components/schemas/IngestContext'
            - not: { required: [evidence_level] }
    DiagnoseIngest:
      type: object
      required: [request, ingest]
      additionalProperties: false
      properties:
        request: { $ref: './plugin-api.v1.0.yaml#/components/schemas/DiagnoseRequest' }
        ingest: { $ref: '#/components/schemas/IngestContext' }
    SummaryBase:
      type: object
      description: 平台摘要：只有 ID 与编码，不含作答、答案、维度分（spec 待人确认 #6）。
      required: [method, subject, attempt_ids, evidence_ids, semantics, human_review_required, error_categories]
      properties:
        method: { type: string, enum: [grade, diagnose] }
        subject: { type: string, enum: [wenli, aya, zhixing, echo] }
        attempt_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } }
        evidence_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } }
        semantics:
          type: string
          enum: [formal, practice]
          description: 平台判定的效力（按平台登记的准入状态，只会比适配器声明的更严）。
        human_review_required: { type: boolean }
        error_categories:
          type: array
          description: 本次错因的跨科大类（去重）。
          items:
            type: string
            enum: [reading_the_question, locating_information, thinking_method, computation_or_grammar,
                   expression_convention, strategy_and_time, knowledge]
        evidence_level:
          type: string
          enum: [A, B, C]
          description: 本次证据的等级（平台补齐）。经 `/internal/v1` 写入的结果必带；重放 `/internal/v0` 写入的结果时没有这个字段与下一个字段。
        learner_model_updated:
          type: boolean
          description: 是否写入了能力观察与错因。C 级证据为 false：只展示批改，不进入学习者模型（ADR 15）。
    GradeSummary:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SummaryBase'
        - required: [grade_result_id, verdict]
          properties:
            method: { const: grade }
            grade_result_id: { $ref: '#/components/schemas/Uuid' }
            verdict: { type: string, enum: [correct, incorrect, partial, needs_review, not_applicable] }
    DiagnoseSummary:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SummaryBase'
        - required: [observation_count]
          properties:
            method: { const: diagnose }
            observation_count: { type: integer, minimum: 0 }
    PlanQuery:
      type: object
      description: BFF → 学习服务：今日计划要排的学生与学科。只有平台学生 ID，不带任何个人信息，也不带掌握快照（由学习服务自己读）。
      required: [request_id, student_ref, subjects]
      additionalProperties: false
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        student_ref:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        subjects:
          type: array
          description: 已选且在读的学科（产品命名空间）。英语搁置，不在枚举里（对照文档决定 #1）。
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [wenli, aya, zhixing] }
        time_budget_minutes: { type: integer, minimum: 1, maximum: 600 }
    PlanDigestTask:
      type: object
      description: 平台摘要里的一条任务。没有掌握概率、置信度、证据 ID、画像上下文（规则 11：关于学生的推断不经本接口外露）。
      required: [kind, target_node_ids, priority, estimated_minutes, rationale_code]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [diagnose, practice, review, lesson, retest, mock_exam] }
        target_node_ids:
          type: array
          description: 目标知识节点（已发布地图版本）；能力点在地图里没有对应时为空，由前端显示中性标题。
          maxItems: 16
          uniqueItems: true
          items: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/NodeId' }
        priority: { type: number, minimum: 0, maximum: 1 }
        estimated_minutes: { type: integer, minimum: 1, maximum: 600 }
        rationale_code: { type: string, pattern: '^[a-z0-9_]{1,48}$' }
    PlanDigestSubject:
      type: object
      required: [subject, status, tasks]
      additionalProperties: false
      properties:
        subject: { type: string, enum: [wenli, aya, zhixing] }
        status:
          type: string
          enum: [ok, unavailable]
          description: unavailable：没有配置适配器、适配器 501、超时或结果不合契约（这一科显示“今天暂无安排”）。
        tasks:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PlanDigestTask' }
      allOf:
        - description: 不可用的学科没有任务
          if: { properties: { status: { const: unavailable } }, required: [status] }
          then: { properties: { tasks: { maxItems: 0 } } }
    PlanDigest:
      type: object
      required: [subjects]
      additionalProperties: false
      properties:
        subjects:
          type: array
          description: 与请求的 subjects 同序，每科一项。
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/PlanDigestSubject' }
    ModelRouteRequest:
      type: object
      additionalProperties: false
      required: [task, data_class, subject, prompt_template, prompt_version, messages, usage_id, idempotency_key]
      properties:
        task: { type: string, enum: [T1, T2, T3, T4, T5, T6, T7, T8, T9], description: 九类任务（ADR 04 增补）；骨架只支持对话类 T1–T4、T8、T9 }
        data_class: { type: string, enum: [L0, L1, L2, L3], description: 数据级别（ADR 09）；学生作答原文是 L2 }
        subject: { type: string, enum: [wenli, aya, zhixing, echo] }
        prompt_template: { type: string, pattern: '^[a-z0-9][a-z0-9\-]{0,47}$' }
        prompt_version: { type: string, pattern: '^v?\d+(\.\d+){0,3}$' }
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string, maxLength: 20000 }
        usage_id: { type: string, format: uuid }
        idempotency_key: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        deadline_ms: { type: integer, minimum: 1, maximum: 60000 }
    ModelRouteResponse:
      type: object
      additionalProperties: false
      required: [output, model_version, source_version, model_mismatch]
      properties:
        output: { type: string, description: 模型原文；调用方必须按自己的 schema 校验，判分只能来自验证器或 Rubric（规则 3） }
        model_version: { type: string, pattern: '^model:[a-z0-9\-]+/[A-Za-z0-9._\-]+@[A-Za-z0-9._\-]+$' }
        source_version: { type: string, pattern: '^prompt:[a-z0-9][a-z0-9\-]{0,47}@[A-Za-z0-9][A-Za-z0-9._\-]{0,31}$' }
        model_mismatch: { type: boolean, description: 供应商报告的模型名与配置的快照名不一致；判分类调用方应转人工复核 }
    VerificationRequest:
      type: object
      description: |
        洞察服务 → 学习服务：为一条“我其实会”异议建验证任务。`student_ref` 由洞察服务从异议记录取出（见路径说明），
        只经洞察服务令牌接受。不带题目、作答或任何个人信息。
      required: [request_id, dispute_ref, student_ref, subject, node_id, cognitive_level, reason, item_count]
      additionalProperties: false
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        dispute_ref:
          description: insight.dispute.id（迁移 0032）；幂等键的一部分。
          type: string
          format: uuid
        student_ref:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        subject:
          type: string
          description: 有掌握计算的学科（英语搁置，不在枚举里）。
          enum: [wenli, aya, zhixing]
        node_id: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/NodeId' }
        cognitive_level: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/CognitiveLevel' }
        reason:
          type: string
          const: verify_self_report
          description: 只建自述验证任务；复测轮等其他原因只由掌握重算产生。
        item_count: { type: integer, minimum: 1, maximum: 5, description: 要选的验证题道数（0032 与 SIE 第八章：1–5 道）。 }
    VerificationTask:
      type: object
      description: 验证任务（platform.retest_task 的一条）。没有题目、答案或任何作答内容。
      required: [task_id, node_id, cognitive_level, status, due_at, item_count, created]
      additionalProperties: false
      properties:
        task_id: { $ref: '#/components/schemas/Uuid' }
        node_id: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/NodeId' }
        cognitive_level: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/CognitiveLevel' }
        status: { type: string, enum: [open, passed, failed, cancelled] }
        due_at: { type: string, format: date-time }
        item_count: { type: integer, minimum: 1, maximum: 5 }
        created: { type: boolean, description: 本次新建为 true；返回已有任务为 false。 }
    VerificationCancelRequest:
      type: object
      description: 洞察服务 → 学习服务：撤销一条自述验证任务。学生与建任务时附带的一致（取自异议记录）。
      required: [request_id, task_id, student_ref]
      additionalProperties: false
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        task_id: { $ref: '#/components/schemas/Uuid' }
        student_ref:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    VerificationCancelResult:
      type: object
      required: [task_id, status, cancelled]
      additionalProperties: false
      properties:
        task_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [open, passed, failed, cancelled] }
        cancelled: { type: boolean, description: 本次撤销为 true；已撤销或已关闭的任务为 false（幂等）。 }
    ProfileSubject:
      type: string
      description: 有档案页的学科（英语搁置，不在枚举里）。
      enum: [wenli, aya, zhixing]
    ProfileSectionKey:
      type: string
      description: 档案页固定六节（迁移 0037 的编码）：当前阶段、已稳定掌握、正在攻克、根因线索、最近进步、下一步。
      enum: [current_stage, mastered, working_on, root_cause, recent_progress, next_step]
    ClaimRef:
      type: object
      description: 判断引用（判断再引用证据）；没有文字。
      required: [claim_id, template_key, template_version]
      additionalProperties: false
      properties:
        claim_id: { $ref: '#/components/schemas/Uuid' }
        template_key: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z0-9_]+){1,4}$', maxLength: 64 }
        template_version: { type: integer, minimum: 1, maximum: 999999 }
    ProfileStatement:
      type: object
      description: 一条陈述：由成立或假设的判断按其模板渲染（与洞察服务 RenderedStatement 同一套规则），必须带 claim_id（规则 11）。
      required: [claim_id, template_key, template_version, status, text]
      additionalProperties: false
      properties:
        claim_id: { $ref: '#/components/schemas/Uuid' }
        template_key: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z0-9_]+){1,4}$', maxLength: 64 }
        template_version: { type: integer, minimum: 1, maximum: 999999 }
        status: { type: string, enum: [hypothesis, established], description: 待验证的判断不作陈述，只进 todo。 }
        text: { type: string, minLength: 1, maxLength: 300 }
    ProfileSection:
      type: object
      required: [key, connective, statements, todo]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/ProfileSectionKey' }
        connective:
          type: string
          maxLength: 60
          pattern: '^[^0-9０-９]*$'
          description: 固定衔接短语表里的一条（人审）；没有陈述、有陈述消失、降级或纯模板版本时为空串。不含数字。
        statements: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/ProfileStatement' } }
        todo:
          type: array
          maxItems: 30
          description: Agent 版待办：待验证的判断（只有引用，不作陈述）。
          items: { $ref: '#/components/schemas/ClaimRef' }
    ProfilePageEnsureRequest:
      type: object
      required: [request_id, student_ref, subject, trigger]
      additionalProperties: false
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        student_ref:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        subject: { $ref: '#/components/schemas/ProfileSubject' }
        trigger:
          type: string
          enum: [session_start, weekly]
          description: 只有两个触发点（第一步 spec 第 14 节）；必须与令牌身份一致（编排层 = session_start，洞察服务 = weekly）。
    ProfilePageEnsureResult:
      type: object
      description: 编译结果。没有判断、文字与学生 ID。
      required: [subject, outcome, check_status, compiled_at, compiler_version]
      additionalProperties: false
      properties:
        subject: { $ref: '#/components/schemas/ProfileSubject' }
        outcome:
          type: string
          enum: [unchanged, compiled, blocked_fallback, empty, template_only]
          description: unchanged 判断没变不重编；compiled 重编并通过检查；blocked_fallback 检查不过、降级为纯模板版本并记阻断；
            empty 没有可用判断、不写；template_only 超出时间预算或失败、不写库（read 返回纯模板版本）。
        check_status: { type: [string, 'null'], enum: [passed, blocked_fallback, null] }
        compiled_at: { type: [string, 'null'], format: date-time }
        compiler_version: { type: string, pattern: '^[a-z0-9][a-z0-9\-]{0,47}@[A-Za-z0-9][A-Za-z0-9._\-]{0,31}$' }
    ProfilePageReadRequest:
      type: object
      required: [request_id, student_ref, subject]
      additionalProperties: false
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        student_ref:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        subject: { $ref: '#/components/schemas/ProfileSubject' }
    ProfilePage:
      type: object
      description: 学情档案页 Agent 完整版（固定六节，按 key 顺序）。除陈述的 text（判断模板渲染）与衔接短语外没有自由文本；没有模型版本（不调模型）。
      required: [subject, variant, profile_page_id, check_status, compiled_at, compiler_version, sections]
      additionalProperties: false
      properties:
        subject: { $ref: '#/components/schemas/ProfileSubject' }
        variant:
          type: string
          enum: [compiled, template_only]
          description: compiled = 已编译版本（读取时已重核）；template_only = 没有页或页已过时，由现有判断直接渲染（没有衔接语）。
        profile_page_id: { type: [string, 'null'], format: uuid }
        check_status: { type: [string, 'null'], enum: [passed, blocked_fallback, null] }
        compiled_at: { type: [string, 'null'], format: date-time }
        compiler_version: { type: string, pattern: '^[a-z0-9][a-z0-9\-]{0,47}@[A-Za-z0-9][A-Za-z0-9._\-]{0,31}$' }
        sections:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/ProfileSection' }
      allOf:
        - description: 纯模板版本没有页 ID、检查状态与编译时间
          if: { properties: { variant: { const: template_only } }, required: [variant] }
          then: { properties: { profile_page_id: { type: 'null' }, check_status: { type: 'null' }, compiled_at: { type: 'null' } } }
        - description: 已编译版本必须有页 ID、检查状态与编译时间
          if: { properties: { variant: { const: compiled } }, required: [variant] }
          then: { properties: { profile_page_id: { type: string }, check_status: { type: string }, compiled_at: { type: string } } }
    StarMapSubject:
      type: string
      description: 有星图的学科（英语搁置，不在枚举里）。
      enum: [wenli, aya, zhixing]
    StarMapNodesRequest:
      type: object
      description: BFF → 学习服务：某学生某科的星态。只有平台学生 ID，不带任何个人信息与掌握快照。
      required: [request_id, caller, student_ref, subject]
      additionalProperties: false
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        caller:
          type: string
          enum: [bff, orchestrator, insight]
          description: 服务身份；必须与令牌一致（本接口只认 bff，不符 403 `CALLER_MISMATCH`）。
        student_ref:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        subject: { $ref: '#/components/schemas/StarMapSubject' }
    StarMapNode:
      type: object
      description: 一颗星的星态。没有掌握概率、置信度、证据 ID 与各层次明细（规则 11）。
      required: [node_id, state, star_lit, basis_id]
      additionalProperties: false
      properties:
        node_id: { $ref: './knowledge-service.v0.9.yaml#/components/schemas/NodeId' }
        state:
          type: string
          description: 决定星亮的那个认知层次上的门槛（platform.mastery_state）；没有当前记录为 unseen。
          enum: [unseen, understand, execute, stable, transfer, retain]
        star_lit: { type: boolean, description: 星亮（与 mastery/get 同一实现）；当且仅当 state 是 transfer 或 retain。 }
        basis_id:
          type: [string, 'null']
          format: uuid
          description: 决定 state 的当前掌握记录（platform.mastery_estimate.id）；没有记录为 null。
      allOf:
        - description: 没有掌握记录的星是 unseen
          if: { properties: { basis_id: { type: 'null' } }, required: [basis_id] }
          then: { properties: { state: { const: unseen } } }
        - description: 星亮当且仅当星态到迁移及以上
          if: { properties: { state: { enum: [transfer, retain] } }, required: [state] }
          then: { properties: { star_lit: { const: true } } }
          else: { properties: { star_lit: { const: false } } }
    StarMapNodes:
      type: object
      description: 当前已发布地图版本里每颗星的星态（按 node_id 排序）；没有已发布地图时 status = no_map。
      required: [subject, status, map_version, nodes]
      additionalProperties: false
      properties:
        subject: { $ref: '#/components/schemas/StarMapSubject' }
        status:
          type: string
          enum: [ok, no_map]
          description: ok = 有已发布地图；no_map = 该科没有已发布地图（BFF 显示“地图建设中”）。
        map_version:
          description: 当前已发布地图版本号（kge.map_version.version）；no_map 时为 null。
          oneOf:
            - $ref: './knowledge-service.v0.9.yaml#/components/schemas/MapVersion'
            - type: 'null'
        nodes:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/StarMapNode' }
      allOf:
        - description: 没有地图就没有版本号与星
          if: { properties: { status: { const: no_map } }, required: [status] }
          then: { properties: { map_version: { type: 'null' }, nodes: { maxItems: 0 } } }
        - description: 有地图必须给版本号
          if: { properties: { status: { const: ok } }, required: [status] }
          then: { properties: { map_version: { type: string } } }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      additionalProperties: false
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, maxLength: 120, description: 不得包含学生原文。 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          maxLength: 500
          description: 面向开发者的编码化说明。不得包含学生作答、答案或数据库报错原文。
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - SUBJECT_NOT_SUPPORTED
            - STUDENT_NOT_FOUND
            - CONTENT_NOT_REGISTERED
            - IDEMPOTENCY_CONFLICT
            - BUSY  # 同 key 的另一请求仍在执行；响应头 retry-after
            - ATTEMPT_ID_CONFLICT  # BFF 带来的 attempt_id 已被另一请求用过
            - UPSTREAM_REJECTED
            - UPSTREAM_UNAVAILABLE
            - UPSTREAM_TIMEOUT
            - ASYNC_NOT_SUPPORTED
            - ADAPTER_RESULT_REJECTED
            - REPLAY_NOT_FOUND  # 重放接口：没有记录或之前确定失败，同时封存该 key（评审 N17）
            - IDEMPOTENCY_KEY_SEALED  # 该 key 已被重放接口封存，原请求不再执行
            - SUBJECT_MISMATCH  # 模型路由接口：请求的学科与路由客户端令牌绑定的学科不一致
            - ROUTE_REJECTED  # 模型路由接口：任务、数据级别或计量字段不合要求（不重试）
            - ROUTE_UNAVAILABLE  # 模型路由接口：没有数据级别允许的可用供应商（可稍后重试）
            - CALLER_MISMATCH  # 1.1.0 掌握读取：请求体 context.caller 与令牌不一致（403）
            - MASTERY_UNAVAILABLE  # 1.1.0 验证任务：学科没有可用掌握配置或单元不在当前已发布地图里；星图节点：地图已发布但没有可用掌握配置（409，不重试）
            - TASK_NOT_FOUND  # 1.1.0 撤销验证任务：任务不存在、不属于该学生或不是自述验证任务（404）
            - PROFILE_UNAVAILABLE  # 1.1.0（PR 4）档案页：没有档案页配置、该科不在配置里或没有已发布地图（409，不重试）
            - INTERNAL
        upstream_code:
          type: string
          description: 适配器返回的 Problem.code（UPSTREAM_REJECTED 时），例如 ITEM_NOT_FOUND。
          pattern: '^[A-Z][A-Z0-9_]{0,47}$'
        retryable:
          type: boolean
          description: 为真时 BFF 可用同一个 idempotency_key 重试。只对 4xx 有意义：5xx 一律是结果未知（评审 N18）。
        request_id: { $ref: '#/components/schemas/Uuid' }
