openapi: 3.1.0
info:
  title: StarBuddy 学科插件 API
  version: 0.9.0
  summary: 四科适配器（及后续三科）实现的唯一硬接口。
  description: |
    状态：**草稿 v0.9，待评审**（W2 评审进入 v0.9，W4 冻结为 v1.0）。
    起草依据：`specs/contracts-plugin-api-v0.9/spec.md`、完整方案 v1.0 第 5.4/5.5/5.8 节、
    ADR 01/03/04/06/09、四科盘点 decisions。

    ## 调用方向
    平台学习服务（`services/learning`）调用适配器。适配器**不得**直接读写 `platform.*` 表
    （CLAUDE.md 规则 1；ADR 01 第 1 条）。适配器需要的学习者状态由平台在请求里传入；
    适配器产生的证据与推断放在响应里，由学习服务落库。

    ## 证据 ID 的来源
    适配器在响应的 `evidence` 数组里给出证据草稿，每条带适配器生成的 UUID `evidence_id`。
    学习服务按这个 ID 落库为 `evidence_event`。因此响应里 `evidence_ids`（信封级）以及
    `result` 内各处引用的 evidence_id，必须指向：本响应 `evidence` 数组里的条目，或者
    请求里传入的既有证据 ID。其他 ID 一律视为契约违规。

    ## 判分溯源（CLAUDE.md 规则 3）
    判分只能来自验证器或 Rubric。`grade` 的结果里**没有任何自由文本字段**；评语、讲解、
    人设话术由人设层另行生成，不得覆盖或改写分数。

    ## 计量（CLAUDE.md 规则 4；ADR 06）
    消耗类方法（`diagnose`、`grade`、`teach`）的 `context.usage_id` 与 `context.idempotency_key`
    必填。平台在调用适配器之前已完成预留；适配器只需要把这两个值原样用于幂等与日志，
    不自行扣费。非消耗类方法（`plan`、`generate_variation`、`report`）的 `usage_id` 可省略，
    但 `idempotency_key` 仍然必填，保证重试安全。

    ## 数据级别（ADR 04 / 09）
    每个请求都声明 `context.data_class`。适配器内部如需调用模型，必须经平台模型路由，
    并原样传递 `data_class`；不得自行持有模型供应商的 Key 或 BaseURL（ADR 04 第 1 条）。
  license:
    name: 内部，未授权对外
    identifier: LicenseRef-StarBuddy-Internal
servers:
  - url: https://{adapter_host}/plugin/v0
    description: 各科适配器服务。平台按 subject 路由到对应的适配器。
    variables:
      adapter_host:
        default: adapter.dev.invalid
security:
  - platformServiceToken: []
tags:
  - name: methods
    description: 六个学科方法。
  - name: jobs
    description: 异步任务查询（diagnose、grade 可以异步）。
  - name: meta
    description: 适配器能力声明，用于契约覆盖率统计（Gate 0 软条件）。

paths:
  /capabilities:
    get:
      tags: [meta]
      operationId: getCapabilities
      summary: 声明本适配器实现了哪些方法、契约版本与算法版本
      responses:
        '200':
          description: 能力声明
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
              examples:
                aya:
                  $ref: '#/components/examples/CapabilitiesAya'
        default: { $ref: '#/components/responses/Error' }

  /diagnose:
    post:
      tags: [methods]
      operationId: diagnose
      summary: 诊断：把作答证据映射为能力点观测与错因归因（消耗类，可异步）
      description: |
        输出的是**观测与推断**，不是掌握度。掌握度只由平台 `mastery_estimate` 计算
        （CLAUDE.md 规则 2）。“全市位次区间”“预计提分”不得出现在诊断结果里，只能出现在
        `report` 的预测字段中（wenli adapter-design §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnoseRequest' }
            examples:
              wenli_paper:
                $ref: '#/components/examples/DiagnoseRequestWenliPaper'
      responses:
        '200':
          description: 同步完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnoseResponse' }
              examples:
                wenli_paper:
                  $ref: '#/components/examples/DiagnoseResponseWenliPaper'
        '202': { $ref: '#/components/responses/JobAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /plan:
    post:
      tags: [methods]
      operationId: plan
      summary: 计划：输出学科内的候选任务与优先级（非消耗类）
      description: |
        只输出**学科处方**（候选任务、目标能力点、优先级、前置关系）。跨科日程编排归平台与点点
        （aya、wenli、zhixing adapter-design §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
            examples:
              aya:
                $ref: '#/components/examples/PlanRequestAya'
      responses:
        '200':
          description: 计划结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanResponse' }
              examples:
                aya:
                  $ref: '#/components/examples/PlanResponseAya'
        default: { $ref: '#/components/responses/Error' }

  /teach:
    post:
      tags: [methods]
      operationId: teach
      summary: 教学：按平台给定的提示等级输出结构化教学片段（消耗类）
      description: |
        提示等级上限由平台决定（`allowed_hint_level`），适配器不得超过；客户端不能直接指定
        （aya inventory §4：原产品由客户端决定提示等级）。对话历史由平台从自己的存储中提供，
        不接受客户端拼接的历史（echo inventory §4：可伪造 assistant 轮次）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeachRequest' }
            examples:
              aya_hint:
                $ref: '#/components/examples/TeachRequestAya'
      responses:
        '200':
          description: 教学片段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeachResponse' }
              examples:
                aya_hint:
                  $ref: '#/components/examples/TeachResponseAya'
        default: { $ref: '#/components/responses/Error' }

  /grade:
    post:
      tags: [methods]
      operationId: grade
      summary: 判分：由验证器或 Rubric 给出结构化判分（消耗类，可异步）
      description: |
        - 主观维度（作文、阅读、道法 M3 主观题、英语 LLM 判分）：confidence 取低值，
          并置 `human_review_required = true`（wenli A2、zhixing A2、echo adapter-design §1）。
        - 确定性验证器（选择题 key 比对、道法 M2 定位、阿鸦验证器 v0）：给出高置信；
          验证器遇到边界情况时不下对错结论，返回 `verdict = needs_review`（aya adapter-design §2）。
        - 契约 v0.9 / v1 的 zhixing 只接道法判分，不含历史（zhixing #13/A5）。
        - 维度分可以为 `null`（英语 D 维发音，评测供应商到位前；echo A3），此时总分必须在
          `score.excluded_dimensions` 里列出被排除的维度。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeRequest' }
            examples:
              aya_objective:
                $ref: '#/components/examples/GradeRequestAyaObjective'
              echo_async:
                $ref: '#/components/examples/GradeRequestEchoTranscript'
              wenli_essay:
                $ref: '#/components/examples/GradeRequestWenliEssay'
      responses:
        '200':
          description: 同步判分完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeResponse' }
              examples:
                aya_objective:
                  $ref: '#/components/examples/GradeResponseAyaObjective'
                wenli_essay_subjective:
                  $ref: '#/components/examples/GradeResponseWenliEssay'
        '202': { $ref: '#/components/responses/JobAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /generate_variation:
    post:
      tags: [methods]
      operationId: generateVariation
      summary: 变式：从已审题库中选出同能力点、同错因的候选题（非消耗类）
      description: |
        契约 v1 语义是**选题，不是生成**（aya #9、wenli #6/A5、zhixing、echo 一致）。
        候选必须已准入（`admission = admitted`）。没有合格候选时返回空数组并给出 `empty_reason`，
        **不得生成新题**。生成器另立项，其产出只能进入平台 content_review。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateVariationRequest' }
            examples:
              zhixing:
                $ref: '#/components/examples/GenerateVariationRequestZhixing'
      responses:
        '200':
          description: 选题结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateVariationResponse' }
              examples:
                zhixing_empty:
                  $ref: '#/components/examples/GenerateVariationResponseZhixingEmpty'
        default: { $ref: '#/components/responses/Error' }

  /report:
    post:
      tags: [methods]
      operationId: report
      summary: 报告：按时间窗提供学科字段，由平台报告引擎合成（非消耗类）
      description: |
        适配器只提供结构化字段，不输出叙事文本。字段中不得出现排名、同伴比较或逐句对话
        （开发计划 冲刺 5-H：家长版不含逐句对话与同伴比较）。预测类字段只能基于已准入内容，
        准入内容不够时必须省略（aya、wenli adapter-design §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
            examples:
              wenli_parent:
                $ref: '#/components/examples/ReportRequestWenliParent'
      responses:
        '200':
          description: 报告字段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
              examples:
                wenli_parent:
                  $ref: '#/components/examples/ReportResponseWenliParent'
        default: { $ref: '#/components/responses/Error' }

  /jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: 查询异步任务状态与结果（轮询）
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    platformServiceToken:
      type: http
      scheme: bearer
      description: 平台学习服务到适配器的服务间令牌。学生与家长的身份不经过适配器。

  responses:
    JobAccepted:
      description: 已受理为异步任务。平台用 `GET /jobs/{job_id}` 轮询。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobAccepted' }
          examples:
            echo_grade:
              $ref: '#/components/examples/JobAcceptedEcho'
    Error:
      description: 统一错误体（RFC 9457 Problem Details 扩展）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------- 公共类型 ----------
    Subject:
      type: string
      description: 学科命名空间。v0.9 只列四科，新增学科是非破坏性变更（spec 待人确认 #4）。
      enum: [wenli, aya, zhixing, echo]

    DataClass:
      type: string
      description: 数据级别，定义见 ADR 09 §2。L2 及以上只能路由到境内模型（ADR 04）。
      enum: [L0, L1, L2, L3]

    Method:
      type: string
      enum: [diagnose, plan, teach, grade, generate_variation, report]

    SkillNodeRef:
      type: string
      description: 能力点引用，格式 `subject:local_id`。各科保留自己的坐标系（完整方案 5.5）。
      pattern: '^(wenli|aya|zhixing|echo):[A-Za-z0-9][A-Za-z0-9_.\-]{0,63}$'
      examples: ['aya:K-QF-0301', 'wenli:R3-L2']

    ItemRef:
      type: string
      description: 题目引用，格式 `subject:item_id`。
      pattern: '^(wenli|aya|zhixing|echo):[A-Za-z0-9][A-Za-z0-9_.\-]{0,63}$'

    EvidenceId:
      type: string
      format: uuid

    ContentVersion:
      type: object
      description: 内容六段标识（完整方案 5.5；开发计划 冲刺 4-G）。
      required: [region, exam_year, grade, textbook_version, subject, content_version]
      additionalProperties: false
      properties:
        region: { type: string, pattern: '^[a-z][a-z0-9\-]{1,31}$', examples: ['nanjing'] }
        exam_year: { type: integer, minimum: 2026, maximum: 2100 }
        grade: { type: integer, minimum: 7, maximum: 9, description: 年级（初一 = 7）。 }
        textbook_version: { type: string, pattern: '^[a-z0-9][a-z0-9\-]{1,31}$', examples: ['bubian-2024'] }
        subject: { $ref: '#/components/schemas/Subject' }
        content_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }

    Admission:
      type: string
      description: |
        内容准入状态。只有 `admitted` 的内容产生的证据可以推动星亮门槛；其他状态的证据
        可以记录，但必须带这个标记（aya adapter-design §1、§3.1）。
      enum: [admitted, pending_review, source_unverified, rejected]

    Semantics:
      type: string
      description: |
        结果的效力。`formal` 可以计入正式测评与掌握门槛；`practice` 只作练习与演示，
        不产生正式测评结果（aya adapter-design §1：Q1 题在教研过审前只能 practice）。
      enum: [formal, practice]

    CrossSubjectErrorCategory:
      type: string
      description: |
        错因跨科七大类（开发计划 冲刺 0 W2：审题 / 定位信息 / 思维方法 / 运算语法 / 表达规范 /
        策略时间 / 知识）。映射表 v0.9 待教研签字，签字前枚举值可能调整。
      enum:
        - reading_the_question
        - locating_information
        - thinking_method
        - computation_or_grammar
        - expression_convention
        - strategy_and_time
        - knowledge

    ReviewReason:
      type: string
      description: 进入统一复核队列的原因（完整方案 5.4 返回字段行；spec 范围第 6 条）。
      enum:
        - subjective_dimension
        - low_confidence
        - verifier_boundary_case
        - content_not_admitted
        - ocr_low_confidence
        - dimension_unavailable
        - student_appeal
        - spot_check
        - double_grading_disagreement
        - full_score_second_review

    ModelVersion:
      type: string
      description: |
        产生本结果的模型或算法。模型调用写 `model:<供应商>/<模型>@<版本>`，由平台模型路由回传；
        确定性算法写 `algo:<名称>@<版本>`；两者都用到时写模型的那一个，算法版本写进
        `source_version`。禁止写 `routed` 之类不可追溯的值（wenli KD-04、zhixing KD-07）。
      pattern: '^(model:[a-z0-9\-]+/[A-Za-z0-9._\-]+@[A-Za-z0-9._\-]+|algo:[A-Za-z0-9._\-]+@[A-Za-z0-9._\-]+)$'
      examples: ['algo:aya-symbolic-ts@0.1.0', 'model:dashscope/qwen-plus@2026-09']

    VersionedName:
      type: string
      description: 带版本的名称，`名称@版本`。只允许编码字符，不能写自然语言。
      pattern: '^[a-z0-9][a-z0-9\-]{0,47}@[A-Za-z0-9][A-Za-z0-9._\-]{0,31}$'
      examples: ['wenli-attr@0.1.0']

    SourceVersion:
      type: string
      description: |
        产生本结果所用的内容与规则版本，用 `;` 分隔多个 `类别:名称@版本`，例如
        `rubric:wenli-essay-5d@1.2.0;prompt:wenli-grade@0.4.1;items:nanjing-2027-9@1.0.0`。
        类别限定为 rubric / verifier / prompt / items / algo / graph。只允许编码字符。
      pattern: '^(rubric|verifier|prompt|items|algo|graph):[a-z0-9][a-z0-9\-]{0,47}@[A-Za-z0-9][A-Za-z0-9._\-]{0,31}(;(rubric|verifier|prompt|items|algo|graph):[a-z0-9][a-z0-9\-]{0,47}@[A-Za-z0-9][A-Za-z0-9._\-]{0,31}){0,7}$'

    Uncertainty:
      type: object
      description: 可选的不确定区间，承接文砺 `uncertainty_note`（spec 待人确认 #1）。
      required: [low, high]
      additionalProperties: false
      properties:
        low: { type: number }
        high: { type: number }

    # ---------- 请求上下文 ----------
    RequestContext:
      type: object
      description: 每个方法请求都带的上下文。
      required: [request_id, subject, student_ref, data_class, idempotency_key, contract_version]
      additionalProperties: false
      properties:
        request_id: { type: string, format: uuid }
        contract_version:
          type: string
          description: 调用方按照哪个契约版本组装请求。
          const: 0.9.0
        subject: { $ref: '#/components/schemas/Subject' }
        student_ref:
          type: string
          format: uuid
          description: 平台学生 ID。**不得**携带手机号、姓名、学校等个人信息。
        data_class:
          description: |
            插件请求都带 `student_ref`，能关联到具体学生，所以最低是 L2（ADR 09 §2）。
            照片、语音、心理相关内容为 L3。声明低于实际级别时平台拒绝（ADR 04 第 2 条）。
          allOf:
            - $ref: '#/components/schemas/DataClass'
            - enum: [L2, L3]
        usage_id:
          type: string
          format: uuid
          description: 计量预留 ID。消耗类方法必填（ADR 06）。
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 128
          description: 重试时保持不变。同一个 key 配不同的请求体，返回 `IDEMPOTENCY_CONFLICT`。
        content_version: { $ref: '#/components/schemas/ContentVersion' }

    MeteredContext:
      description: 消耗类方法的上下文：`usage_id` 必填。
      allOf:
        - $ref: '#/components/schemas/RequestContext'
        - required: [usage_id]

    # ---------- 证据 ----------
    EvidenceDraft:
      type: object
      description: |
        适配器产生的证据草稿，由学习服务落库为 `evidence_event`（ADR 01）。原始证据与推断分开：
        这里只放**观察到的事实**（作答、转写、命中的采分点片段），推断放在各方法的 result 里。
        语音只存评测结果与特征，不存原始音频（完整方案 5.5）。
      required: [evidence_id, kind, occurred_at, admission]
      additionalProperties: false
      properties:
        evidence_id: { $ref: '#/components/schemas/EvidenceId' }
        kind:
          type: string
          description: |
            `speech_features` 是语音评测结果与特征（不含原始音频，完整方案 5.5；对应 5.4 英语“语音表现信号”）。
          enum:
            - response_text
            - response_choice
            - ocr_transcription
            - asr_transcription
            - scoring_point_span
            - verifier_trace
            - interaction_signal
            - speech_features
        occurred_at:
          type: string
          format: date-time
          description: 事件自身的发生时间，重试时保持不变（ADR 05 第 2 条）。
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
        admission: { $ref: '#/components/schemas/Admission' }
        payload:
          description: |
            按 kind 区分的结构化内容，**不允许任意字段**。`text` 只能是学生作答或转写的原文
            （作答证据），不能是评语；平台的人设与评测回归会抽检这一点。游戏化数值（XP、成就）
            和掌握度不能写进证据（echo #12/A6；CLAUDE.md 规则 2）。
          oneOf:
            - $ref: '#/components/schemas/EvidencePayloadText'
            - $ref: '#/components/schemas/EvidencePayloadChoice'
            - $ref: '#/components/schemas/EvidencePayloadVerifierTrace'
            - $ref: '#/components/schemas/EvidencePayloadSignal'
        media_ref:
          type: string
          description: 对象存储中的引用（照片、转写来源）。不得是公网可直接访问的 URL。
          pattern: '^objstore://'
      allOf:
        - if: { properties: { kind: { enum: [response_text, ocr_transcription, asr_transcription, scoring_point_span] } }, required: [kind] }
          then: { properties: { payload: { $ref: '#/components/schemas/EvidencePayloadText' } } }
        - if: { properties: { kind: { const: response_choice } }, required: [kind] }
          then: { properties: { payload: { $ref: '#/components/schemas/EvidencePayloadChoice' } } }
        - if: { properties: { kind: { const: verifier_trace } }, required: [kind] }
          then: { properties: { payload: { $ref: '#/components/schemas/EvidencePayloadVerifierTrace' } } }
        - if: { properties: { kind: { enum: [interaction_signal, speech_features] } }, required: [kind] }
          then: { properties: { payload: { $ref: '#/components/schemas/EvidencePayloadSignal' } } }

    EvidenceRecord:
      description: |
        平台在请求里传给适配器的既有证据（内容来自 `platform.evidence_event`）。适配器只在本次请求内使用，
        **不得**在学科私有表里保存副本（CLAUDE.md 规则 2）。结构与 EvidenceDraft 相同。
      $ref: '#/components/schemas/EvidenceDraft'

    EvidencePayloadText:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 20000, description: 学生作答或转写原文。 }
        span_start: { type: integer, minimum: 0 }
        span_end: { type: integer, minimum: 0 }

    EvidencePayloadChoice:
      type: object
      required: [choice]
      additionalProperties: false
      properties:
        choice: { type: array, minItems: 1, items: { type: string, pattern: '^[A-Za-z0-9]{1,8}$' } }

    EvidencePayloadVerifierTrace:
      type: object
      required: [sampled_points, agreeing_points]
      additionalProperties: false
      properties:
        sampled_points: { type: integer, minimum: 0 }
        agreeing_points: { type: integer, minimum: 0 }
        reason_codes: { type: array, items: { $ref: '#/components/schemas/VerifierReasonCode' } }

    EvidencePayloadSignal:
      type: object
      required: [signal_code]
      additionalProperties: false
      properties:
        signal_code: { type: string, pattern: '^[a-z0-9_]{1,48}$' }
        value: { type: number }

    VerifierReasonCode:
      type: string
      description: 验证器边界情况原因码（aya adapter-design §2；是否冻结为枚举见 spec 待人确认 #6）。
      enum:
        - trig_or_multiletter_function
        - equation_or_inequality_solving
        - proof_or_multi_answer
        - parse_failure
        - sampling_insufficient
        - no_reference_answer

    # ---------- 统一返回信封 ----------
    PluginResultBase:
      type: object
      description: |
        所有方法统一返回的信封（完整方案 5.4“返回字段”）。六个字段必填；
        `human_review_required = true` 时 `review_reasons` 必须非空。
      required:
        - result
        - evidence_ids
        - confidence
        - source_version
        - model_version
        - human_review_required
        - contract_version
        - semantics
      properties:
        contract_version: { type: string, const: 0.9.0 }
        result: {}
        evidence_ids:
          type: array
          items: { $ref: '#/components/schemas/EvidenceId' }
          uniqueItems: true
        evidence:
          type: array
          description: 本次新产生的证据草稿。
          items: { $ref: '#/components/schemas/EvidenceDraft' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            结果整体的置信度。口径：确定性验证器且无边界情况 = 1.0；主观维度 ≤ 0.5
            （具体上限待评审，spec 待人确认 #1）。
        uncertainty: { $ref: '#/components/schemas/Uncertainty' }
        source_version: { $ref: '#/components/schemas/SourceVersion' }
        model_version: { $ref: '#/components/schemas/ModelVersion' }
        human_review_required: { type: boolean }
        review_reasons:
          type: array
          items: { $ref: '#/components/schemas/ReviewReason' }
          uniqueItems: true
        semantics: { $ref: '#/components/schemas/Semantics' }
      allOf:
        - description: human_review_required 为真时必须给出原因。
          if: { properties: { human_review_required: { const: true } }, required: [human_review_required] }
          then:
            required: [review_reasons]
            properties: { review_reasons: { minItems: 1 } }
        - description: |
            任何一条证据未准入 → 结果只能是 practice，并进复核（aya #3/#11、wenli 3.1）。
          if:
            required: [evidence]
            properties:
              evidence:
                contains:
                  required: [admission]
                  properties: { admission: { not: { const: admitted } } }
          then:
            properties:
              semantics: { const: practice }
              human_review_required: { const: true }
              review_reasons: { contains: { const: content_not_admitted } }

    ErrorAttribution:
      type: object
      description: 错因归因：同时带学科分类与跨科大类（完整方案 5.5；CLAUDE.md 规则 6）。
      required: [subject_category, cross_subject_category, confidence, evidence_ids, algorithm_version]
      additionalProperties: false
      properties:
        skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
        subject_category:
          type: string
          description: 学科内错因编码（文砺六类、阿鸦十二类、知行四类、英语三维）。
          pattern: '^[a-z0-9_\-]{1,48}$'
        cross_subject_category: { $ref: '#/components/schemas/CrossSubjectErrorCategory' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EvidenceId' }
        algorithm_version: { $ref: '#/components/schemas/VersionedName' }

    # ---------- diagnose ----------
    AttemptInput:
      type: object
      description: 一次作答。`response` 按题型四选一。
      required: [item_ref, occurred_at, response]
      additionalProperties: false
      properties:
        attempt_id: { type: string, format: uuid }
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        occurred_at: { type: string, format: date-time }
        response:
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            text: { type: string, maxLength: 20000 }
            choice: { type: array, items: { type: string }, minItems: 1 }
            image_ref: { type: string, pattern: '^objstore://' }
            transcript_ref: { type: string, pattern: '^objstore://' }
        elapsed_sec: { type: integer, minimum: 0 }
        hint_level_used: { type: integer, minimum: 0, maximum: 6 }
        self_report:
          type: string
          description: 学生自评。“猜的”会降权（aya adapter-design §1）。
          enum: [confident, unsure, guessed]

    DiagnoseRequest:
      type: object
      required: [context, mode]
      additionalProperties: false
      properties:
        context: { $ref: '#/components/schemas/MeteredContext' }
        mode:
          type: string
          description: |
            `intake` 入口诊断；`paper` 整卷诊断（如文砺 M1 试卷 OCR）；`gap_test` 查缺；
            `process` 过程诊断（如知行 F1 + F3 反推过程四步）。
          enum: [intake, paper, gap_test, process]
        attempts:
          type: array
          items: { $ref: '#/components/schemas/AttemptInput' }
          maxItems: 200
        paper_image_refs:
          type: array
          description: 整卷照片（mode = paper）。OCR 低置信时先请学生确认题目再判分（完整方案第六章）。
          items: { type: string, pattern: '^objstore://' }
          maxItems: 20
        prior_evidence:
          type: array
          description: 平台提供的既有证据内容。适配器不自行查库（CLAUDE.md 规则 1）。
          maxItems: 500
          items: { $ref: '#/components/schemas/EvidenceRecord' }
      anyOf:
        - required: [attempts]
        - required: [paper_image_refs]

    SkillObservation:
      type: object
      description: 对某个能力点的一次观测（不是掌握度）。
      required: [skill_node, outcome, confidence, evidence_ids, algorithm_version]
      additionalProperties: false
      properties:
        skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
        outcome: { type: string, enum: [demonstrated, not_demonstrated, partial, inconclusive] }
        local_level:
          type: string
          description: 学科内等级编码（例如文砺 28 点里的“级”），由学科自己解释。只作观测，不是掌握度。
          pattern: '^[A-Za-z0-9_\-]{1,16}$'
        algorithm_version: { $ref: '#/components/schemas/VersionedName' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EvidenceId' }

    DiagnoseResult:
      type: object
      required: [observations, error_attributions]
      additionalProperties: false
      properties:
        observations:
          type: array
          items: { $ref: '#/components/schemas/SkillObservation' }
        error_attributions:
          type: array
          items: { $ref: '#/components/schemas/ErrorAttribution' }
        ocr_confirmation_required:
          type: array
          description: 需要学生先确认题面的题目（OCR 低置信）。非空时整体 human_review_required 可以为假，但这些题不得判分。
          items: { $ref: '#/components/schemas/ItemRef' }

    DiagnoseResponse:
      description: 信封之外不允许任何字段（防止在顶层夹带讲解或评语文本）。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/PluginResultBase'
        - properties:
            result: { $ref: '#/components/schemas/DiagnoseResult' }

    # ---------- plan ----------
    MasterySnapshot:
      type: object
      description: 平台提供的只读掌握状态（门槛映射见完整方案 5.5）。
      required: [skill_node, state]
      additionalProperties: false
      properties:
        skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
        state: { type: string, enum: [unseen, understand, execute, stable, transfer, retain] }
        p_mastery: { type: number, minimum: 0, maximum: 1 }
        next_retest_at: { type: string, format: date-time }

    PlanRequest:
      type: object
      required: [context, mastery]
      additionalProperties: false
      properties:
        context: { $ref: '#/components/schemas/RequestContext' }
        mastery:
          type: array
          items: { $ref: '#/components/schemas/MasterySnapshot' }
        constraints:
          type: object
          additionalProperties: false
          properties:
            time_budget_minutes: { type: integer, minimum: 1, maximum: 600 }
            exam_date: { type: string, format: date }
            focus_skill_nodes:
              type: array
              items: { $ref: '#/components/schemas/SkillNodeRef' }

    PlanTask:
      type: object
      required: [task_id, kind, skill_nodes, priority, estimated_minutes, rationale_code]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        kind: { type: string, enum: [diagnose, practice, review, lesson, retest, mock_exam] }
        skill_nodes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SkillNodeRef' }
        item_refs:
          type: array
          items: { $ref: '#/components/schemas/ItemRef' }
        priority: { type: number, minimum: 0, maximum: 1 }
        estimated_minutes: { type: integer, minimum: 1 }
        prerequisite_task_ids:
          type: array
          items: { type: string, format: uuid }
        rationale_code:
          type: string
          description: 选择理由的编码（例如 `high_exam_weight`、`retest_due`），叙述文字由平台生成。
          pattern: '^[a-z0-9_]{1,48}$'

    PlanResult:
      type: object
      required: [tasks]
      additionalProperties: false
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/PlanTask' }

    PlanResponse:
      description: 信封之外不允许任何字段（防止在顶层夹带讲解或评语文本）。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/PluginResultBase'
        - properties:
            result: { $ref: '#/components/schemas/PlanResult' }

    # ---------- teach ----------
    ConversationTurn:
      type: object
      required: [role, content, turn_id]
      additionalProperties: false
      properties:
        turn_id: { type: string, format: uuid }
        role: { type: string, enum: [student, tutor] }
        content: { type: string, maxLength: 4000 }

    TeachRequest:
      type: object
      required: [context, mode, skill_node, allowed_hint_level, persona]
      additionalProperties: false
      properties:
        context: { $ref: '#/components/schemas/MeteredContext' }
        mode:
          type: string
          description: |
            `hint` 练习中的提示；`lesson` 讲评课 / 白板（按节计量，完整方案 5.8）。
            是否拆成两个操作待评审（spec 待人确认 #2）。
          enum: [hint, lesson]
        skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        allowed_hint_level:
          type: integer
          minimum: 0
          maximum: 6
          description: 平台决定的提示等级上限，适配器输出不得超过。
        persona:
          type: object
          description: 由平台指定的人设与其 Prompt 版本。人设变更属于必停项（CLAUDE.md）。
          required: [persona_id, prompt_version]
          additionalProperties: false
          properties:
            persona_id:
              type: string
              description: teach 只由常驻型老师或点点主持；考官型（方圆、雅典娜）不在 teach 内（完整方案 5.4）。
              enum: [aya, miaobi, diandian]
            prompt_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        conversation:
          type: array
          description: 平台从自己的存储中取出的对话历史，不接受客户端拼接。
          maxItems: 40
          items: { $ref: '#/components/schemas/ConversationTurn' }
        recent_evidence:
          type: array
          description: 平台提供的近期证据内容。
          maxItems: 100
          items: { $ref: '#/components/schemas/EvidenceRecord' }

    TeachSegment:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [text, formula, whiteboard_dsl, item_ref] }
        text: { type: string, maxLength: 4000 }
        latex: { type: string, maxLength: 2000 }
        dsl: { type: object, description: 讲解 DSL（ADR 07；内容需经发布闸门）。, additionalProperties: true }
        dsl_version: { type: string }
        item_ref: { $ref: '#/components/schemas/ItemRef' }

    TeachResult:
      type: object
      required: [segments, hint_level_used, ai_disclosure_shown]
      additionalProperties: false
      properties:
        segments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TeachSegment' }
        hint_level_used: { type: integer, minimum: 0, maximum: 6 }
        ai_disclosure_shown:
          type: boolean
          description: 本轮是否包含 AI 身份披露（完整方案第十一章：首次对话必须声明 AI 扮演）。
        referral_triggered:
          type: boolean
          description: 是否触发了转介话术（超出学习范畴的情绪困扰）。触发时平台记录并通知。
        verified_claims:
          type: array
          description: 讲解中的数值结论经验证器核验的结果（如阿鸦教练数值核验）。
          items:
            type: object
            required: [claim, verdict]
            additionalProperties: false
            properties:
              claim: { type: string, maxLength: 500 }
              verdict: { type: string, enum: [verified, refuted, not_checked] }

    TeachResponse:
      description: 信封之外不允许任何字段（防止在顶层夹带讲解或评语文本）。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/PluginResultBase'
        - properties:
            result: { $ref: '#/components/schemas/TeachResult' }

    # ---------- grade ----------
    GradeRequest:
      type: object
      required: [context, attempt, rubric_version]
      additionalProperties: false
      properties:
        context:
          description: 消耗类上下文；grade 还要求 `content_version` 必填（题目与 Rubric 版本可追溯）。
          allOf:
            - $ref: '#/components/schemas/MeteredContext'
            - required: [content_version]
        attempt: { $ref: '#/components/schemas/AttemptInput' }
        rubric_version:
          description: 使用的 Rubric 或验证器规则版本。结果里的 `result.rubric_version` 必须与它相同（平台侧校验）。
          $ref: '#/components/schemas/VersionedName'
        appeal:
          type: boolean
          description: 是否由学生申诉触发的重判。为真时结果必须进入复核（review_reasons 含 student_appeal）。
          default: false

    DimensionScore:
      type: object
      required: [dimension_id, score, max_score, judged_by, subjective, confidence, evidence_ids]
      additionalProperties: false
      properties:
        dimension_id: { type: string, pattern: '^[a-z0-9_\-]{1,48}$' }
        score:
          type: [number, 'null']
          minimum: 0
          description: 为 null 表示该维不可用（例如英语 D 维发音），不得计入总分。不得超过 max_score（平台侧校验）。
        max_score: { type: number, exclusiveMinimum: 0 }
        judged_by:
          type: string
          description: |
            `verifier` 确定性验证器；`rubric_rule` 规则判分（如 key 比对、M2 定位）；
            `rubric_model` 模型按 Rubric 判分——模型判分一律视为主观维度。
          enum: [verifier, rubric_rule, rubric_model]
        subjective: { type: boolean, description: 是否主观维度。 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        uncertainty: { $ref: '#/components/schemas/Uncertainty' }
        evidence_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EvidenceId' }
      allOf:
        - description: 模型判分一律是主观维度（wenli A2、zhixing A2、echo adapter-design §1）。
          if: { properties: { judged_by: { const: rubric_model } }, required: [judged_by] }
          then: { properties: { subjective: { const: true } } }
        - description: 主观维度一律低置信，上限 0.5（spec 待人确认 #1 的默认值）。
          if: { properties: { subjective: { const: true } }, required: [subjective] }
          then: { properties: { confidence: { maximum: 0.5 } } }

    ScoringPoint:
      type: object
      description: 采分点逐点判定（知行 F3、阿鸦过程题）。
      required: [point_id, achieved, evidence_ids]
      additionalProperties: false
      properties:
        point_id: { type: string, pattern: '^[A-Za-z0-9_\-]{1,48}$' }
        achieved: { type: [boolean, 'null'], description: null 表示无法判定、待复核。 }
        points_awarded: { type: number, minimum: 0 }
        evidence_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EvidenceId' }

    GradeResult:
      type: object
      description: 结构化判分。**没有任何自由文本字段**（CLAUDE.md 规则 3）。
      required: [verdict, score, dimensions, rubric_version]
      additionalProperties: false
      properties:
        verdict:
          type: string
          description: 验证器遇到边界情况时返回 `needs_review`，不下对错结论（aya adapter-design §2）。
          enum: [correct, incorrect, partial, needs_review, not_applicable]
        rubric_version:
          description: 实际使用的 Rubric 或验证器版本，必须等于请求里的 `rubric_version`。
          $ref: '#/components/schemas/VersionedName'
        score:
          type: object
          required: [total, max_total, calibrated]
          additionalProperties: false
          properties:
            total: { type: [number, 'null'], minimum: 0 }
            max_total: { type: number, exclusiveMinimum: 0 }
            excluded_dimensions:
              type: array
              description: 因分数为 null 而未计入总分的维度（echo A3）。
              items: { type: string, pattern: '^[a-z0-9_\-]{1,48}$' }
              uniqueItems: true
            calibrated:
              type: boolean
              description: 权重是否已经过金标准校准。未校准时为 false，由平台标注“未校准”（echo adapter-design §1）。
        dimensions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DimensionScore' }
        scoring_points:
          type: array
          items: { $ref: '#/components/schemas/ScoringPoint' }
        error_attributions:
          type: array
          items: { $ref: '#/components/schemas/ErrorAttribution' }
        verifier:
          type: object
          required: [verifier_id, version, reason_codes]
          additionalProperties: false
          properties:
            verifier_id: { type: string, pattern: '^[a-z0-9][a-z0-9\-]{0,47}$', examples: ['aya-symbolic-ts'] }
            version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
            reason_codes:
              type: array
              items: { $ref: '#/components/schemas/VerifierReasonCode' }
      allOf:
        - description: 有维度由验证器判定时，必须给出验证器对象。
          if:
            required: [dimensions]
            properties: { dimensions: { contains: { required: [judged_by], properties: { judged_by: { const: verifier } } } } }
          then: { required: [verifier] }
        - description: 有维度分为 null 时，总分必须列出被排除的维度（echo A3）。
          if:
            required: [dimensions]
            properties: { dimensions: { contains: { required: [score], properties: { score: { type: 'null' } } } } }
          then:
            properties: { score: { required: [excluded_dimensions], properties: { excluded_dimensions: { minItems: 1 } } } }

    GradeResponse:
      description: |
        信封之外不允许任何字段（防止在顶层夹带讲解或评语文本）。另外在结构上强制四科已定的复核规则：
        主观维度、验证器边界情况、维度不可用、申诉，都必须 `human_review_required = true`。
        grade 必须带新证据（至少是这次作答本身），溯源才能闭环。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/PluginResultBase'
        - required: [evidence]
          properties:
            result: { $ref: '#/components/schemas/GradeResult' }
            evidence_ids: { minItems: 1 }
            evidence: { minItems: 1 }
        - description: 含主观维度 → 复核，原因含 subjective_dimension，整体置信度 ≤ 0.5。
          if:
            properties:
              result:
                required: [dimensions]
                properties: { dimensions: { contains: { required: [subjective], properties: { subjective: { const: true } } } } }
          then:
            properties:
              human_review_required: { const: true }
              review_reasons: { contains: { const: subjective_dimension } }
              confidence: { maximum: 0.5 }
        - description: verdict = needs_review → 复核，原因含 verifier_boundary_case。
          if:
            properties: { result: { required: [verdict], properties: { verdict: { const: needs_review } } } }
          then:
            properties:
              human_review_required: { const: true }
              review_reasons: { contains: { const: verifier_boundary_case } }
        - description: 有维度分为 null → 复核，原因含 dimension_unavailable。
          if:
            properties:
              result:
                required: [dimensions]
                properties: { dimensions: { contains: { required: [score], properties: { score: { type: 'null' } } } } }
          then:
            properties:
              human_review_required: { const: true }
              review_reasons: { contains: { const: dimension_unavailable } }

    # ---------- generate_variation ----------
    GenerateVariationRequest:
      type: object
      required: [context, count]
      additionalProperties: false
      properties:
        context: { $ref: '#/components/schemas/RequestContext' }
        source_item_ref: { $ref: '#/components/schemas/ItemRef' }
        skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
        subject_error_category: { type: string, pattern: '^[a-z0-9_\-]{1,48}$' }
        count: { type: integer, minimum: 1, maximum: 20 }
        exclude_item_refs:
          type: array
          description: 已做过的题（错题重练不重推原题，aya README 设计红线）。
          items: { $ref: '#/components/schemas/ItemRef' }
      anyOf:
        - required: [source_item_ref]
        - required: [skill_node]

    VariationCandidate:
      type: object
      required: [item_ref, admission, content_version, match]
      additionalProperties: false
      properties:
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        admission:
          description: 契约 v1 只允许返回已准入的题。
          const: admitted
        content_version: { $ref: '#/components/schemas/ContentVersion' }
        match:
          type: object
          description: 至少同能力点或同错因之一（四科 decisions：同节点、同错因选题）。
          required: [same_skill_node, same_error_category]
          additionalProperties: false
          properties:
            same_skill_node: { type: boolean }
            same_error_category: { type: boolean }
          anyOf:
            - properties: { same_skill_node: { const: true } }
            - properties: { same_error_category: { const: true } }
        difficulty: { type: number, minimum: 0, maximum: 1 }

    GenerateVariationResult:
      type: object
      required: [candidates]
      additionalProperties: false
      properties:
        candidates:
          type: array
          items: { $ref: '#/components/schemas/VariationCandidate' }
        empty_reason:
          type: string
          description: candidates 为空时必填。
          enum: [no_admitted_candidate, all_excluded, skill_node_unknown, subject_not_supported]
      if:
        properties:
          candidates: { maxItems: 0 }
      then:
        required: [empty_reason]

    GenerateVariationResponse:
      description: 信封之外不允许任何字段（防止在顶层夹带讲解或评语文本）。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/PluginResultBase'
        - properties:
            result: { $ref: '#/components/schemas/GenerateVariationResult' }

    # ---------- report ----------
    ReportRequest:
      type: object
      required: [context, window, audience]
      additionalProperties: false
      properties:
        context: { $ref: '#/components/schemas/RequestContext' }
        window:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        audience: { type: string, enum: [student, parent, teacher] }
        evidence:
          type: array
          description: 平台在时间窗内选出的证据内容。适配器不自行查库，也不保存副本（CLAUDE.md 规则 1、2）。
          maxItems: 2000
          items: { $ref: '#/components/schemas/EvidenceRecord' }
        error_attributions:
          type: array
          description: 平台在时间窗内的错因记录。
          items: { $ref: '#/components/schemas/ErrorAttribution' }
        mastery_history:
          type: array
          description: 平台掌握度时间序列（用于计算 trend）。
          items:
            type: object
            required: [skill_node, state, at]
            additionalProperties: false
            properties:
              skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
              state: { type: string, enum: [unseen, understand, execute, stable, transfer, retain] }
              p_mastery: { type: number, minimum: 0, maximum: 1 }
              at: { type: string, format: date-time }

    ReportFields:
      type: object
      description: |
        学科字段，平台报告引擎据此合成周报。**不得**包含排名、百分位、同伴比较、逐句对话；
        本 schema 用 `additionalProperties: false` 在结构上禁止这类字段。
      required: [skill_summary, error_distribution]
      additionalProperties: false
      properties:
        skill_summary:
          type: array
          items:
            type: object
            required: [skill_node, trend]
            additionalProperties: false
            properties:
              skill_node: { $ref: '#/components/schemas/SkillNodeRef' }
              trend: { type: string, enum: [up, flat, down, new] }
              attempts: { type: integer, minimum: 0 }
        error_distribution:
          type: array
          items:
            type: object
            required: [cross_subject_category, count]
            additionalProperties: false
            properties:
              cross_subject_category: { $ref: '#/components/schemas/CrossSubjectErrorCategory' }
              subject_category: { type: string, pattern: '^[a-z0-9_\-]{1,48}$' }
              count: { type: integer, minimum: 0 }
        highlight_codes:
          type: array
          description: 亮点与关注点编码，叙述由平台按受众口吻生成。
          items: { type: string, pattern: '^[a-z0-9_]{1,48}$' }
        forecast:
          type: object
          description: |
            预测区间（例如中考分数段）。只能基于已准入内容；准入内容不够时**省略整个字段**。
            只给区间，不给点估计（aya README：预测给区间不给假精确分）。标注为“预测、非承诺”由平台负责。
          required: [low, high, basis_admitted_items]
          additionalProperties: false
          properties:
            low: { type: number }
            high: { type: number }
            basis_admitted_items: { type: integer, minimum: 1 }

    ReportResponse:
      description: 信封之外不允许任何字段（防止在顶层夹带讲解或评语文本）。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/PluginResultBase'
        - properties:
            result: { $ref: '#/components/schemas/ReportFields' }

    # ---------- 异步任务 ----------
    JobAccepted:
      type: object
      description: |
        同一个 `idempotency_key` 重试时，必须返回同一个 `job_id`；任务完成后结果里的 evidence_id
        也必须相同（ADR 05 第 2 条）。计量在任务成功时结算、失败时回滚，平台凭 `usage_id` 对账（ADR 06）。
      required: [job_id, method, status, poll_after_ms, usage_id, idempotency_key]
      additionalProperties: false
      properties:
        job_id: { type: string, format: uuid }
        method: { type: string, enum: [diagnose, grade] }
        status: { const: queued }
        poll_after_ms: { type: integer, minimum: 200, maximum: 60000 }
        usage_id: { type: string, format: uuid }
        idempotency_key: { type: string, minLength: 16, maxLength: 128 }

    JobStatus:
      type: object
      required: [job_id, method, status, usage_id]
      additionalProperties: false
      properties:
        job_id: { type: string, format: uuid }
        method: { type: string, enum: [diagnose, grade] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        usage_id: { type: string, format: uuid }
        poll_after_ms: { type: integer, minimum: 200, maximum: 60000 }
        response:
          description: 只有 status = succeeded 时出现；类型与 method 绑定。
        error: { $ref: '#/components/schemas/Problem' }
      allOf:
        - if: { properties: { status: { const: succeeded } }, required: [status] }
          then: { required: [response] }
          else: { not: { required: [response] } }
        - if: { properties: { status: { const: failed } }, required: [status] }
          then: { required: [error] }
          else: { not: { required: [error] } }
        - if: { properties: { method: { const: grade } }, required: [method] }
          then: { properties: { response: { $ref: '#/components/schemas/GradeResponse' } } }
        - if: { properties: { method: { const: diagnose } }, required: [method] }
          then: { properties: { response: { $ref: '#/components/schemas/DiagnoseResponse' } } }

    # ---------- 能力声明 ----------
    Capabilities:
      type: object
      required: [subject, adapter_version, contract_version, methods]
      additionalProperties: false
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        adapter_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        contract_version: { type: string, const: 0.9.0 }
        methods:
          type: object
          description: 六个方法逐一声明。Gate 0 契约覆盖率按这里统计（阿鸦 6/6、知行与文砺 ≥ 5/6、开口成章 ≥ 4/6）。
          required: [diagnose, plan, teach, grade, generate_variation, report]
          additionalProperties: false
          properties:
            diagnose: { $ref: '#/components/schemas/MethodCapability' }
            plan: { $ref: '#/components/schemas/MethodCapability' }
            teach: { $ref: '#/components/schemas/MethodCapability' }
            grade: { $ref: '#/components/schemas/MethodCapability' }
            generate_variation: { $ref: '#/components/schemas/MethodCapability' }
            report: { $ref: '#/components/schemas/MethodCapability' }
        verifiers:
          type: array
          items:
            type: object
            required: [verifier_id, version]
            additionalProperties: false
            properties:
              verifier_id: { type: string, pattern: '^[a-z0-9][a-z0-9\-]{0,47}$' }
              version: { type: string, pattern: '^\d+\.\d+\.\d+$' }

    MethodCapability:
      type: object
      required: [implemented]
      additionalProperties: false
      properties:
        implemented: { type: boolean }
        async: { type: boolean, default: false }
        notes_code:
          type: string
          description: 例如 `history_grading_excluded`（zhixing）、`pronunciation_dimension_null`（echo）。
          pattern: '^[a-z0-9_]{1,48}$'

    # ---------- 错误 ----------
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      additionalProperties: false
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          description: 面向开发者的说明。**不得**包含上游模型响应原文、学生作答原文或堆栈（zhixing inventory §1.6）。
          maxLength: 500
        code:
          type: string
          description: |
            `DISCIPLINE_NOT_SUPPORTED`：学科内的分支不在本版本范围内，例如 zhixing 的历史判分
            （契约 v1 只接道法，zhixing #13/A5）。
          enum:
            - INVALID_REQUEST
            - CONTRACT_VERSION_UNSUPPORTED
            - SUBJECT_MISMATCH
            - METHOD_NOT_IMPLEMENTED
            - CONTENT_VERSION_NOT_FOUND
            - ITEM_NOT_FOUND
            - DATA_CLASS_VIOLATION
            - IDEMPOTENCY_CONFLICT
            - USAGE_MISSING
            - UPSTREAM_TIMEOUT
            - UPSTREAM_UNAVAILABLE
            - RATE_LIMITED
            - JOB_NOT_FOUND
            - DISCIPLINE_NOT_SUPPORTED
            - INTERNAL
        retryable:
          type: boolean
          description: 为真时平台可用**同一个** idempotency_key 重试；不扣第二次（完整方案 5.8）。
        request_id: { type: string, format: uuid }

