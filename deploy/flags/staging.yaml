# 上线测试 staging 功能开关矩阵（LT-01 范围第 5 条；specs/launch-test-2026/spec.md 第七节 2026-10-19 决定记录；
# specs/launch-lt01-deploy-packaging 决定记录第 1、5、7 条）。
#
# 只写开关的名字与取值，不写任何地址、令牌或密钥（那些在 deploy/config/env-inventory.yaml 里登记名字，值由运行环境注入）。
# 口径：
#   state: "on"   上线测试打开；"off"：保持关（加引号：YAML 1.1 会把裸的 on / off 读成布尔）（变量不设，或设为关的取值）
#   pending（列表，可多项）：
#     signed_content   开关开，但对应模块在教研签字配置到位前回 501（决定记录第 7 条）
#     （原 internal_v1：learning-internal v1 于 2026-10-20 签字，LT-04 删除了开关 LEARNING_INTERNAL_V1，这一项随之取消；
#      /internal/v1 写入改由 BFF 服务身份 + 计量核对把关）
#     migration_0058   待人执行 0058：依赖 /internal/v1 写入（判分、诊断作答、再练与复测作答，及依赖它们的今日计划）的项。
#                      写入前的计量核对函数 platform.learning_meter_check 在迁移 0058（草稿，待人在副本演练后执行）；
#                      缺 0058 或学习服务角色没有执行权时学习服务拒绝启动（LT-04 决定记录（再续）第 4 条），所以人执行之前
#                      学习服务在 staging 起不来，这些项都不可用
#     model_provider   开关开，但要调模型的路径待人开通与填写快照名：LT-02 已在路由表 staging 节登记百炼（主）与方舟（备）的
#                      变量名与占位（services/learning/config/model_routes.yaml），开通、密钥、带日期快照名、接入主机名、
#                      白名单批准与 docs/compliance/vendors.md 登记由人完成；完成之前不设路由客户端令牌，模型路由接口回 503
#                      （设了令牌而占位未填，学习服务拒绝启动）。步骤见 deploy/config/README.md 第 7 节
#     human            还没有开关或口径，待人确认（见 notes）
#     migration_0059   待人执行 0059（LT-06 内部成员测试运营：问题反馈表、退出记录表与库函数，草稿，待人在副本演练后执行）
# switches 每项：service（bff / web / learning / insight / knowledge / review_console / scheduler）、var（环境变量名）、
#   value（staging 设的值；null = 不设）、source（定义它的源码文件，测试核对变量名真实存在）。
# LT-03（阿里云 staging，specs/launch-lt03-cloud-staging）：健康端点（/healthz、/readyz）与 ACK / RDS / 出网白名单都不设开关——
#   健康端点总是在（调度器的健康监听由 SCHEDULER_HEALTH_PORT 决定，不是功能开关）；矩阵里的开关取值与 staging 环境不变。
#   model_provider 的出网放行另有一处要人填：deploy/iac/alicloud 的 model_egress_fqdns（与路由表 allowed_hosts 等三处一致）。
# 测试：deploy/tests/test_flags_matrix.py（名字在源码里、取值被 staging 的解析器接受、关的开关在 staging 不设）
#       deploy/tests/flags_check.ts（用 BFF 与前端的真实解析函数核对 staging 取值，pilot / 生产仍拒绝或按关）。
schema: starbuddy-flags/1
environment: staging

