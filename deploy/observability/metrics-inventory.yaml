# 指标登记清单（LT-05 范围第 1、3、4 条，specs/launch-lt05-observability）。
# services：各服务进程实际注册的指标族（按暴露的名字：计数器带 _total；直方图写基名，采集时另有 _bucket / _sum / _count）。
#   清单由代码导出、测试核对：每个服务的测试把本进程注册表（Python：learning/obs.py 等的 catalog()；BFF：src/observability/metrics.ts
#   的 catalog()）与这里逐项比对，多一个少一个都失败——改指标必须同步改这里。
# labels：标签名白名单（与各服务 obs 模块的 LABELS 一致，测试核对）。直方图另有 Prometheus 自带的 le。
# external：不是本仓库服务注册的指标，由采集侧提供（Prometheus 的 up、ARMS 托管采集的 kube-state-metrics / kubelet、
#   拨测）。名字以阿里云 ARMS 实际可用的为准，待人在开通后核对（specs/launch-lt05-observability 待人确认）。
# 告警规则（alerts.yaml）与仪表盘（dashboards/*.json）只能引用这里登记的名字：deploy/observability/check_observability.py 核对。
version: 1
labels: [service, route, method, status_class, subject, task, provider, outcome]
# 直方图（规则与仪表盘只能用 _bucket / _sum / _count，不能直接用基名）
histograms: [starbuddy_http_request_duration_seconds, starbuddy_scheduler_job_duration_seconds]
services:
  learning:
    - starbuddy_db_pool_idle
    - starbuddy_db_pool_max
    - starbuddy_db_pool_size
    - starbuddy_http_request_duration_seconds
    - starbuddy_http_requests_total
    - starbuddy_learning_meter_check_total
    - starbuddy_model_breaker_open
    - starbuddy_model_budget_remaining_calls
    - starbuddy_model_budget_remaining_ratio
    - starbuddy_model_budget_remaining_tokens
    - starbuddy_model_estimated_cost_cny_total
    - starbuddy_model_provider_calls_total
    - starbuddy_model_route_calls_total
    - starbuddy_ready
    - starbuddy_review_queue_backlog
    - starbuddy_review_queue_oldest_seconds
  review-console:
    - starbuddy_db_pool_idle
    - starbuddy_db_pool_max
    - starbuddy_db_pool_size
    - starbuddy_http_request_duration_seconds
    - starbuddy_http_requests_total
    - starbuddy_ready
  insight:
    - starbuddy_db_pool_idle
    - starbuddy_db_pool_max
    - starbuddy_db_pool_size
    - starbuddy_http_request_duration_seconds
    - starbuddy_http_requests_total
    - starbuddy_ready
  knowledge:
    - starbuddy_db_pool_idle
    - starbuddy_db_pool_max
    - starbuddy_db_pool_size
    - starbuddy_http_request_duration_seconds
    - starbuddy_http_requests_total
    - starbuddy_ready
  scheduler:
    - starbuddy_db_pool_idle
    - starbuddy_db_pool_max
    - starbuddy_db_pool_size
    - starbuddy_http_request_duration_seconds
    - starbuddy_http_requests_total
    - starbuddy_ready
    - starbuddy_scheduler_job_duration_seconds
    - starbuddy_scheduler_job_last_success_timestamp_seconds
    - starbuddy_scheduler_job_runs_total
  bff:
    - starbuddy_db_pool_idle
    - starbuddy_db_pool_max
    - starbuddy_db_pool_size
    - starbuddy_db_pool_waiting
    - starbuddy_http_request_duration_seconds
    - starbuddy_http_requests_total
    - starbuddy_meter_conflict_total
    - starbuddy_meter_events_total
    - starbuddy_meter_release_total
    - starbuddy_meter_reserve_total
    - starbuddy_meter_settle_total
    - starbuddy_ready
    - starbuddy_staging_otp_revoke_audit_failed_total
external:
  up: Prometheus 自带：每个采集目标是否采到（服务不可用告警）
  kube_pod_container_status_ready: kube-state-metrics（ARMS 托管采集）：容器就绪探针结果
  kube_pod_container_status_restarts_total: kube-state-metrics：容器重启次数
  kubelet_volume_stats_available_bytes: kubelet：持久卷剩余字节（磁盘告警）
  kubelet_volume_stats_capacity_bytes: kubelet：持久卷容量
  probe_ssl_earliest_cert_expiry: 拨测（ARMS 拨测或 blackbox_exporter）：内网负载均衡 HTTPS 证书最早到期时间（证书告警）
