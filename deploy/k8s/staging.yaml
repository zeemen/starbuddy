            - {name: BFF_STAGING_OTP_FILE, value: /run/otp/otp.json}
            - {name: BFF_STAGING_OTP_AUDIT_FILE, value: /var/lib/starbuddy/audit/otp-audit.jsonl}
            - {name: BFF_CONSENT_VERSIONS, valueFrom: {configMapKeyRef: {name: starbuddy-staging, key: consent-versions}}}
            - {name: STARBUDDY_TRUST_UI, value: "why,dispute,reconcile,weekly,data_rights,report"}
            - {name: STARBUDDY_STARMAP, value: starmap_v1}
            - {name: STARBUDDY_PRACTICE, value: practice}
            - {name: STARBUDDY_RETEST_UI, value: retest}
            - {name: STARBUDDY_TODAY_ORCH, value: today_orch}
          volumeMounts:
            - {name: otp, mountPath: /run/otp, readOnly: true}
            - {name: audit, mountPath: /var/lib/starbuddy/audit}
