            - {name: BFF_LEARNING_URL, value: "http://10.96.100.10:8788"}
            - {name: BFF_LEARNING_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: service-token}}}
            - {name: BFF_INSIGHT_URL, value: "http://10.96.100.14:8791"}
