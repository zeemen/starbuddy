# ---------------------------------------------------------------- 审核台后端
apiVersion: apps/v1
kind: Deployment
metadata: {name: review-console, namespace: starbuddy-staging, labels: {app: review-console}}
spec:
  replicas: 1
  selector: {matchLabels: {app: review-console}}
  template:
    metadata: {labels: {app: review-console, starbuddy/db-client: "true", starbuddy/metrics: "true"}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: rds-ca, configMap: {name: starbuddy-rds-ca}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
      containers:
        - name: review-console
          image: ACR_REGISTRY/starbuddy/starbuddy-review-console@sha256:DIGEST
          ports: [{name: http, containerPort: 8792}, {name: metrics, containerPort: 9792}]
          env:
            - {name: REVIEW_CONSOLE_ENV, value: staging}
            - {name: REVIEW_CONSOLE_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: REVIEW_CONSOLE_PORT, value: "8792"}
            - {name: REVIEW_CONSOLE_METRICS_PORT, value: "9792"}
            # 契约审查阻断 2：前端经 Service 访问，Host 头是 clusterIP——另收这一个地址（= Service 的 clusterIP，部署测试核对）
            - {name: REVIEW_CONSOLE_EXTRA_HOST, value: "10.96.100.13"}
            - {name: REVIEW_CONSOLE_KGE_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-review-console, key: kge-database-url}}}
            - {name: REVIEW_CONSOLE_REVIEW_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-review-console, key: review-database-url}}}
          volumeMounts:
            - {name: rds-ca, mountPath: /run/rds-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          # 探针的 Host 头是 Pod 地址：审核台在 staging 另收显式配置的监听地址与 REVIEW_CONSOLE_EXTRA_HOST（LT-03，review_console/app.py allowed_hosts）
          readinessProbe: {httpGet: {path: /readyz, port: 8792}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8792}, initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
