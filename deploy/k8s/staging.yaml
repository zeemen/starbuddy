# staging 清单草案（LT-01 范围第 3 条）：云厂商无关的 Kubernetes 清单——Deployment / Service / 探针 / 资源限制 / 出网白名单注释。
# 不绑定任何云厂商、不写真实地址、域名、镜像仓库或凭据（规则 8、9）；云厂商选定后转为该厂商的具体配置（LT-03，spec 待人确认 #1）。
# 约定：
#   - 镜像写成 REGISTRY/starbuddy-<服务>@sha256:DIGEST 占位，由发布流程替换为境内镜像仓库的摘要（决定记录第 11 条）；
#   - 密钥只经 Secret 引用（secretKeyRef），Secret 由人在集群里创建，本仓库不提交任何 Secret 清单；签字配置与白名单 OTP 条目经
#     只读挂载的 Secret / ConfigMap 提供；
#   - 监听地址：staging 各服务显式配置为 Pod IP（downward API status.podIP，属集群内网地址）；服务间地址只收内网 IPv4 字面量，
#     所以 Service 显式指定 clusterIP（10.96.100.x 是合成占位，须按集群的 Service 网段改写）；
#   - 学习服务与三科适配器在同一个 Pod（共用网络命名空间，经回环互访；决定记录第 5 条，适配器不改代码）；
#   - 每个容器：非 root、只读根文件系统、禁止提权、去掉全部 capability、RuntimeDefault seccomp、不挂 ServiceAccount 令牌；
#   - 探针：TCP（HTTP 健康端点另起，决定记录第 11 条）；只监听回环的适配器用 exec 探针。
#   - 出网白名单（ADR 09 §5）：默认拒绝全部出网，只放行集群内服务、托管 Postgres、（LT-02 后）境内已备案模型供应商的地址；
#     具体名单随 LT-02 / LT-03 由人填写，NetworkPolicy 只表达“默认拒绝 + 集群内”，供应商地址见注释占位。
apiVersion: v1
kind: Namespace
metadata:
  name: starbuddy-staging
  labels: {app.kubernetes.io/part-of: starbuddy, starbuddy/environment: staging}
---
# ---------------------------------------------------------------- 学习服务 + 三科适配器（同一个 Pod）
apiVersion: apps/v1
kind: Deployment
metadata: {name: learning, namespace: starbuddy-staging, labels: {app: learning}}
spec:
  replicas: 1
  selector: {matchLabels: {app: learning}}
  template:
    metadata:
      labels: {app: learning}
      # 出网白名单占位（LT-02）：只有本 Pod（学习服务的模型路由）可以出网到模型供应商；主机名由人在开通后填写，
      # 须与路由表 allowed_hosts、docs/compliance/vendors.md 一致，并据此在集群出网网关 / FQDN 策略里放行 443（见下方 NetworkPolicy 注释）
      annotations:
        starbuddy/model-egress-hosts: "<由人填写：MODEL_BAILIAN_URL、MODEL_ARK_URL 的主机名，见 deploy/config/README.md 第 7 节>"
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: signed-config, secret: {secretName: starbuddy-signed-config}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
      containers:
        - name: learning
          image: REGISTRY/starbuddy-learning@sha256:DIGEST
          ports: [{containerPort: 8788}]
          env:
            - {name: LEARNING_ENV, value: staging}
            - {name: LEARNING_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: PORT, value: "8788"}
            - {name: LEARNING_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: database-url}}}
            - {name: LEARNING_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: service-token}}}
            - {name: LEARNING_ADAPTER_AYA_URL, value: "http://127.0.0.1:8781"}
            - {name: LEARNING_ADAPTER_AYA_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-adapters, key: aya-token}}}
            - {name: LEARNING_ADAPTER_ZHIXING_URL, value: "http://127.0.0.1:8782"}
            - {name: LEARNING_ADAPTER_ZHIXING_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-adapters, key: zhixing-token}}}
            - {name: LEARNING_ADAPTER_WENLI_URL, value: "http://127.0.0.1:8783"}
            - {name: LEARNING_ADAPTER_WENLI_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-adapters, key: wenli-token}}}
            - {name: LEARNING_KNOWLEDGE_URL, value: "http://10.96.100.12:8790"}
            - {name: LEARNING_KNOWLEDGE_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-knowledge, key: learning-token}}}
            - {name: LEARNING_INSIGHT_CLIENT_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: insight-client-token}}}
            - {name: LEARNING_MASTERY_CONFIG_AYA, value: /run/config/mastery-aya.signed.json}
            - {name: LEARNING_PRACTICE_CONFIG, value: /run/config/practice.signed.json}
            - {name: LEARNING_PRACTICE_TICKET_SECRET, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: practice-ticket-secret}}}
            - {name: LEARNING_RETEST_CONFIG, value: /run/config/retest.signed.json}
            - {name: LEARNING_TODAY_CONFIG, value: /run/config/today.signed.json}
            - {name: LEARNING_TODAY_SNAPSHOT, value: "0"}
            # 回环路由监听（LT-02 决定记录（续）第 5 条）：staging 下学习服务另在 127.0.0.1:8785 只服务 /internal/v1/model/route，
            # 其他路径 404；同 Pod 的适配器经它调模型（适配器只认 https 或回环）。端口须与下面适配器注释里的 *_ROUTE_URL 一致（部署测试核对）
            - {name: LEARNING_ROUTE_PORT, value: "8785"}
            # 模型供应商（LT-02，开关矩阵 model_provider 仍 pending）：人开通、填好路由表 staging 节的快照名与主机名、
            # 两处登记改为已批准之后，才解开下面几行（路由客户端令牌一旦设置，学习服务就加载路由表，占位未填会拒绝启动）。
            # 两科适配器另加的几行见各自容器里的注释（ZHIXING_ROUTE_URL / WENLI_ROUTE_URL = http://127.0.0.1:8785）。
            # - {name: MODEL_BAILIAN_URL, valueFrom: {secretKeyRef: {name: starbuddy-model-vendors, key: bailian-url}}}
            # - {name: MODEL_BAILIAN_API_KEY, valueFrom: {secretKeyRef: {name: starbuddy-model-vendors, key: bailian-api-key}}}
            # - {name: MODEL_ARK_URL, valueFrom: {secretKeyRef: {name: starbuddy-model-vendors, key: ark-url}}}
            # - {name: MODEL_ARK_API_KEY, valueFrom: {secretKeyRef: {name: starbuddy-model-vendors, key: ark-api-key}}}
            # - {name: LEARNING_ROUTE_CLIENT_ZHIXING_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: route-client-zhixing}}}
            # - {name: LEARNING_ROUTE_CLIENT_WENLI_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: route-client-wenli}}}
          volumeMounts:
            - {name: signed-config, mountPath: /run/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {tcpSocket: {port: 8788}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {tcpSocket: {port: 8788}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext: &csc {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        - name: adapter-aya
          image: REGISTRY/starbuddy-adapter-aya@sha256:DIGEST
          env:
            - {name: PORT, value: "8781"}
            - {name: AYA_ADAPTER_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-adapters, key: aya-token}}}
          readinessProbe: &adapterprobe {exec: {command: ["node", "-e", "const s=require('node:net').connect(Number(process.env.PORT),'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: *adapterprobe
          resources: &adapterres {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: *csc
        - name: adapter-zhixing
          image: REGISTRY/starbuddy-adapter-zhixing@sha256:DIGEST
          env:
            - {name: PORT, value: "8782"}
            - {name: ZHIXING_ADAPTER_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-adapters, key: zhixing-token}}}
            # 模型路由（LT-02，model_provider 解开 pending 后再设）：学习服务的回环路由监听
            # - {name: ZHIXING_ROUTE_URL, value: "http://127.0.0.1:8785"}
            # - {name: ZHIXING_ROUTE_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: route-client-zhixing}}}
          readinessProbe: *adapterprobe
          livenessProbe: *adapterprobe
          resources: *adapterres
          securityContext: *csc
        - name: adapter-wenli
          image: REGISTRY/starbuddy-adapter-wenli@sha256:DIGEST
          env:
            - {name: PORT, value: "8783"}
            - {name: WENLI_ADAPTER_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-adapters, key: wenli-token}}}
            # 模型路由（LT-02，model_provider 解开 pending 后再设）：学习服务的回环路由监听
            # - {name: WENLI_ROUTE_URL, value: "http://127.0.0.1:8785"}
            # - {name: WENLI_ROUTE_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: route-client-wenli}}}
          readinessProbe: *adapterprobe
          livenessProbe: *adapterprobe
          resources: *adapterres
          securityContext: *csc
---
apiVersion: v1
kind: Service
metadata: {name: learning, namespace: starbuddy-staging}
spec: {selector: {app: learning}, clusterIP: 10.96.100.10, ports: [{port: 8788, targetPort: 8788}]}
---
# ---------------------------------------------------------------- 知识服务
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowledge, namespace: starbuddy-staging, labels: {app: knowledge}}
spec:
  replicas: 1
  selector: {matchLabels: {app: knowledge}}
  template:
    metadata: {labels: {app: knowledge}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: snapshot, persistentVolumeClaim: {claimName: knowledge-snapshot, readOnly: true}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
      containers:
        - name: knowledge
          image: REGISTRY/starbuddy-knowledge@sha256:DIGEST
          ports: [{containerPort: 8790}]
          env:
            - {name: KNOWLEDGE_ENV, value: staging}
            - {name: KNOWLEDGE_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: KNOWLEDGE_PORT, value: "8790"}
            - {name: KNOWLEDGE_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-knowledge, key: database-url}}}
            - {name: KNOWLEDGE_TOKEN_LEARNING, valueFrom: {secretKeyRef: {name: starbuddy-knowledge, key: learning-token}}}
            - {name: KNOWLEDGE_PAGE_SNAPSHOT, value: /run/snapshot}
            - {name: KNOWLEDGE_READ_CACHE, value: "0"}
            - {name: KNOWLEDGE_CACHE_DIR, value: /tmp/knowledge-cache}
          volumeMounts:
            - {name: snapshot, mountPath: /run/snapshot, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {tcpSocket: {port: 8790}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {tcpSocket: {port: 8790}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
