kind: Service
metadata: {name: web, namespace: starbuddy-staging}
spec: {selector: {app: web}, ports: [{port: 3000, targetPort: 3000}]}
---
# ---------------------------------------------------------------- 调度器（单实例；只收签字时间表）
apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler, namespace: starbuddy-staging, labels: {app: scheduler}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: scheduler}}
  template:
    metadata: {labels: {app: scheduler}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: signed-config, secret: {secretName: starbuddy-signed-config}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
      containers:
        - name: scheduler
          image: REGISTRY/starbuddy-scheduler@sha256:DIGEST
          args: ["--schedule", "/run/config/schedule.signed.yaml"]
          env:
            - {name: SCHEDULER_ENV, value: staging}
            - {name: SCHEDULER_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-scheduler, key: database-url}}}
            - {name: INSIGHT_ENV, value: staging}
            - {name: INSIGHT_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-insight, key: database-url}}}
            - {name: INSIGHT_POLICY, value: /run/config/claims.signed.json}
            - {name: LEARNING_ENV, value: staging}
            - {name: LEARNING_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: database-url}}}
            - {name: LEARNING_MASTERY_CONFIG_AYA, value: /run/config/mastery-aya.signed.json}
            - {name: REVIEW_CONSOLE_ENV, value: staging}
            - {name: REVIEW_CONSOLE_KGE_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-review-console, key: kge-database-url}}}
          volumeMounts:
            - {name: signed-config, mountPath: /run/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          livenessProbe: {exec: {command: ["/srv/starbuddy/services/insight/.venv/bin/python", "-I", "-c", "import os; os.kill(1, 0)"]}, periodSeconds: 60}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
# ---------------------------------------------------------------- 出网白名单（ADR 09 §5）：默认拒绝出网，只放行集群内与 DNS
# 托管 Postgres（境内，LT-03）与境内已备案模型供应商（LT-02）的地址段由人按白名单流程补入，例如：
#   - to: [{ipBlock: {cidr: <托管 Postgres 内网地址段>}}]          ports: [{port: 5432}]
#   - to: [{ipBlock: {cidr: <模型供应商入口地址段>}}]                ports: [{port: 443}]   # 只放学习服务（模型路由）
# 模型供应商（LT-02）：只给 app=learning 的 Pod 另加一条出网策略，目标是下面两家的接入主机名（由人填写，三处一致：
#   路由表 allowed_hosts、docs/compliance/vendors.md、learning Pod 注解 starbuddy/model-egress-hosts）：
#   - 阿里云百炼：<由人填写：百炼 OpenAI 兼容接入的主机名>   端口 443
#   - 火山方舟：  <由人填写：方舟 OpenAI 兼容接入的主机名>   端口 443
#   NetworkPolicy 只认 IP 段：按主机名放行须用云厂商的出网网关 / NAT 白名单或支持 FQDN 的策略（LT-03 选定后转写）；
#   路由在建连前还会再核一次主机名（providers.check_endpoint），两道都要有。
# 境外地址一律不放行；白名单外的出网须被拦截（发布检查项）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-egress, namespace: starbuddy-staging}
spec:
  podSelector: {}
  policyTypes: [Egress, Ingress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
