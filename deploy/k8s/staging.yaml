# ---------------------------------------------------------------- BFF（单实例：白名单 OTP 状态、连续使用提醒在进程内，见 lessons）
apiVersion: apps/v1
kind: Deployment
metadata: {name: bff, namespace: starbuddy-staging, labels: {app: bff}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: bff}}
  template:
    metadata: {labels: {app: bff}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: otp, secret: {secretName: starbuddy-staging-otp, defaultMode: 0400}}
        - {name: audit, persistentVolumeClaim: {claimName: bff-otp-audit}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
      containers:
        - name: bff
          image: REGISTRY/starbuddy-bff@sha256:DIGEST
          ports: [{containerPort: 8787}]
          env:
            - {name: STARBUDDY_ENV, value: staging}
            - {name: BFF_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: PORT, value: "8787"}
            - {name: BFF_DATABASE_URL, valueFrom: {secretKeyRef: {name: starbuddy-bff, key: database-url}}}
            - {name: BFF_SHELL_ORIGIN, valueFrom: {configMapKeyRef: {name: starbuddy-staging, key: shell-origin}}}
            - {name: BFF_LOG_HMAC_KEY, valueFrom: {secretKeyRef: {name: starbuddy-bff, key: log-hmac-key}}}
            - {name: BFF_AUTH_SECRET, valueFrom: {secretKeyRef: {name: starbuddy-bff, key: auth-secret}}}
            - {name: BFF_TRUST_SECRET, valueFrom: {secretKeyRef: {name: starbuddy-bff, key: trust-secret}}}
            # 只在网关覆盖 X-Forwarded-For、BFF 只对前端开放时才能改为 1（发布检查项，安全审查 S5）
            - {name: BFF_TRUST_CLIENT_IP, value: "0"}
            - {name: BFF_LEARNING_URL, value: "http://10.96.100.10:8788"}
            - {name: BFF_LEARNING_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-learning, key: service-token}}}
            - {name: BFF_INSIGHT_URL, value: "http://10.96.100.14:8791"}
            - {name: BFF_INSIGHT_TOKEN, valueFrom: {secretKeyRef: {name: starbuddy-insight, key: bff-token}}}
            - {name: BFF_STAGING_OTP_FILE, value: /run/otp/otp.json}
            - {name: BFF_STAGING_OTP_AUDIT_FILE, value: /var/lib/starbuddy/audit/otp-audit.jsonl}
            - {name: BFF_CONSENT_VERSIONS, valueFrom: {configMapKeyRef: {name: starbuddy-staging, key: consent-versions}}}
            - {name: STARBUDDY_TRUST_UI, value: "why,dispute,reconcile,weekly,data_rights,report"}
            - {name: STARBUDDY_STARMAP, value: starmap_v1}
            - {name: STARBUDDY_PRACTICE, value: practice}
            - {name: STARBUDDY_RETEST_UI, value: retest}
            - {name: STARBUDDY_TODAY_ORCH, value: today_orch}
          volumeMounts:
            - {name: otp, mountPath: /run/otp, readOnly: true}
            - {name: audit, mountPath: /var/lib/starbuddy/audit}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {tcpSocket: {port: 8787}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {tcpSocket: {port: 8787}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
