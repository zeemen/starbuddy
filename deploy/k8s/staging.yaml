      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: otp, secret: {secretName: starbuddy-staging-otp, defaultMode: 0400}}
        - {name: audit, persistentVolumeClaim: {claimName: bff-otp-audit}}
        - {name: rds-ca, configMap: {name: starbuddy-rds-ca}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
      containers:
        - name: bff
          image: ACR_REGISTRY/starbuddy/starbuddy-bff@sha256:DIGEST
          ports: [{name: http, containerPort: 8787}, {name: metrics, containerPort: 9787}]
          env:
            - {name: STARBUDDY_ENV, value: staging}
            - {name: BFF_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
