      - {name: ZHIXING_ROUTE_TOKEN, purpose: 适配器 → 模型路由令牌（与学习服务的 LEARNING_ROUTE_CLIENT_ZHIXING_TOKEN 同值）, secret: true, default: null, envs: all}
      - {name: ZHIXING_CONTRACT_VERSION, purpose: 默认契约版本, secret: false, default: "1.0.0", envs: all}
      - {name: STARBUDDY_ALLOW_CANDIDATE_CONTRACT, purpose: 候选契约开关（开发开关；适配器自身不区分环境，staging 编排一律不设）, secret: false, default: null, envs: local}
