      - {name: STARBUDDY_ALLOW_CANDIDATE_CONTRACT, purpose: 候选契约开关（开发开关；适配器不改代码、自身不区分环境，staging 编排一律不设，由编排测试把关）, secret: false, default: null, envs: local}
      - {name: AYA_CONTENT_PACK, purpose: 换内容包（只给测试与演练；只在候选契约开关打开时才读，否则拒绝启动）, secret: false, default: null, envs: local}
      - {name: AYA_STEM_OVERLAY, purpose: 题面叠加文件（同上）, secret: false, default: null, envs: local}
