# “名次 / 概率 / 承诺”最小词表 v0（草稿）
# 状态：草稿，待产品负责人、教研与外部合规顾问签字（CLAUDE.md 必停项“判断模板、禁用推断词表”；PLT-14 第 2 步 lessons 待人确认）。
# 依据：平台规划 v1.3 增补篇“不给名次、录取概率、提分承诺”（:167）、“差距须与下一步做什么同屏”（:168）；
#       specs/family-goals-monthly-plan/spec.md 硬约束“不出现名次、录取概率、提分承诺、同伴比较”。
# 用途：月度计划模板库（services/insight/templates/monthly_plan.v0.yaml）加载时逐条检查，命中即拒绝加载；
#       与禁用推断词表（forbidden-inference.v0.yaml）同一格式、同一个匹配函数（docs/design/sie/sie_lexicon.py 的 load / find，
#       同一套规范化：全角转半角、去空白与零宽字符、常用繁体转简体）。本词表不替代禁用推断词表，两张表都要过。
# 规则：patterns 是正则，不区分大小写。每类的 forbidden_examples 必须被本类命中；全部 allowed_examples 不能被任何一类命中（防误伤）。
#       “请保证每周 X 天的安静时段”这类对家长的安排建议不是对结果的承诺，不能被误伤（allowed_examples 里有）。
version: 0.1.0
status: draft
categories:
  - id: rank
    name: 名次与同伴比较
    patterns:
      - "名次|排名|第\\s*[0-9一二三四五六七八九十百]+\\s*名|前\\s*[0-9一二三四五六七八九十百]+\\s*名|年级前|班级前|全班第|全年级第"
      - "(超过|超越|击败|打败|领先|落后于?)(了)?\\s*([0-9]+\\s*%|百分之|大多数|多数|一半|其他)?的?(同学|同龄人|考生|人)"
      - "比(同学|同龄人|别人|别的孩子|其他孩子)(强|好|差|快|慢|高|低)"
      - "\\brank(ed|ing)?\\b|percentile|top\\s*[0-9]+\\s*%|\\boutperform"
    forbidden_examples:
      - 期中有望进入年级前 50 名
      - 你已经超过了 80% 的同学
      - 这次排名上升了
      - He ranked third in class
    allowed_examples: []

  - id: probability
    name: 录取或得分的概率
    patterns:
      - "概率|几率|机率|可能性|胜算|(有|没有)\\s*[0-9一二三四五六七八九十]*\\s*成?\\s*把握|把握(很大|较大|不大)|录取率|上线率|命中率"
      - "(有|约|大约|将近)?\\s*[0-9]+\\s*(%|成)\\s*的?(可能|机会|希望|把握)"
      - "(够得着|够不着|稳上|稳进|冲一冲|保底|有希望考上|考上的希望)"
      - "probabilit|likelihood|\\bchance(s)? of\\b"
    forbidden_examples:
      - 考上目标学校的概率是 60%
      - 有八成把握达到目标分
      - 这所学校够得着
      - The chance of admission is high
    allowed_examples: []

  - id: promise
    name: 提分或结果承诺
    patterns:
      - "包过|包提分|保过|稳过|必考上|必上|一定(能|会|可以)(考上|提高|提升|达到|进步|上升|涨)|保证(能|会|可以)?(考上|提高|提升|达到|进步|提分|涨分)"
      - "(提高|提升|涨|增加|多考)\\s*[0-9一二三四五六七八九十]+\\s*分(?!钟)"
      - "承诺|担保|确保(能|会)?(考上|提高|提升|达到|进步|提分)"
      - "\\bguarantee|\\bpromise|will definitely"
    forbidden_examples:
      - 坚持一个月保证提分
      - 按计划学一定能考上
      - 本月可以提高 15 分
      - We guarantee a higher score
    allowed_examples: []

allowed_examples:
  - 本月复测 3 次，请保证每周 4 天、每天 30 分钟的安静时段
  - 数学有 5 个知识点待点亮，本月优先
  - 期中目标与最近一次成绩相差 12 分，下一步先复测函数图像
  - 每周 5 次，每次 30 分钟
  - 本月 24 日安排一次数学小复评
  - 上个月计划里的 3 个知识点已点亮
  - 上个月完成复测 6 次
  - 考试在本月，请帮孩子提前安排好考前一周的作息
  - 请和孩子一起看一下本月的复测日期
  - 目标分由家长自填，只与最近一次录入的成绩对照
